              "zh": "神亲爱的孩子，请想象那凯旋的行进！想象那些兴奋的孩子们不断被父母制止和约束，以免爆发出惊叹。想想那些妇女们，当她们发现自己忽然从比死更可怕的命运中被拯救出来时，该是何等不可抑制地激动。想象那些跟随的男人们，必定为曾不信靠神、抱怨摩西而感到羞愧和自责。当你想象红海那由永恒之神回应单一个人的信心而伸出手臂所分开的雄伟水墙时，就当认识到神要为属祂的人成就何等大的事。",
              "simpEn": "Dear child of God, imagine that triumphal march! Picture the excited children being hushed by their parents. Think how the women felt, suddenly saved from a fate worse than death. Imagine the men feeling ashamed for mistrusting God and complaining against Moses. As you envision the mighty walls of water, separated by God's outstretched hand in response to one man's faith, learn what God will do for His own.",
              "simpZh": "神亲爱的孩子，想象那凯旋的行进！兴奋的孩子们被父母不断制止。妇女们发现自己忽然从比死更可怕的命运中被救出来，多么激动！男人们为不信神、抱怨摩西感到羞愧。当你想象红海那因着一个人的信心、神伸手分开的雄伟水墙，就知道神要为属祂的人做什么。"
            },
            {
              "en": "Never dread any consequence resulting from absolute obedience to His command. Never fear the rough waters ahead, which through their proud <span class=\"vocab-trigger\" data-vocab=\"contempt\">contempt<\/span> <span class=\"vocab-trigger\" data-vocab=\"impede\">impede<\/span> your progress. God is greater than the roar of raging water and the mighty waves of the sea. \"The Lord sits enthroned over the flood; the Lord is enthroned as King forever\" (Ps. 29:10). A storm is simply the hem of His robe, the sign of His coming, and the evidence of His presence.",
              "zh": "永远不要惧怕全然顺服祂命令所带来的任何后果。永远不要害怕前面咆哮的怒涛，它们以骄傲的藐视阻挡你的前进。神大于汪洋的咆哮和海中的巨浪。「洪水泛滥之时，耶和华坐着为王；耶和华坐着为王，直到永远」（诗29:10）。风暴不过是祂衣袍的边缘，是祂来临的标记，是祂同在的证据。",
              "simpEn": "Never dread the results of absolute obedience to His command. Never fear the rough waters ahead that proudly block your way. God is greater than raging floods and mighty waves. 'The Lord sits enthroned over the flood; the Lord is enthroned as King forever' (Ps. 29:10). A storm is simply the hem of His robe, the sign of His coming, the proof of His presence.",
              "simpZh": "永远不要害怕全然顺服祂命令的结果。不要害怕前面汹涌的怒涛骄傲地挡你的路。神大于洪水的咆哮和海中的巨浪。'洪水泛滥时，耶和华坐着为王，直到永远。' 风暴不过是祂袍子的边缘，是祂来临的标记，是祂同在的证据。"
            },
            {
              "en": "Dare to trust Him! Dare to follow Him! Then discover that the forces that blocked your progress and threatened your life become at His command the very materials He uses to build your street of freedom. —F. B. Meyer",
              "zh": "要敢信靠祂！要敢跟随祂！然后你必发现，那些曾阻挡你前进、威胁你生命的力量，在祂的命令下，成为祂用来建造你自由之路的原材料。——F. B.迈尔",
              "simpEn": "Dare to trust Him! Dare to follow Him! Then you will find that the forces that blocked your way and threatened your life become, at His command, the very materials He uses to build your street of freedom.",
              "simpZh": "敢信靠祂！敢跟随祂！然后你会发现，那些曾挡住你、威胁你生命的力量，在祂的命令下，竟成了祂用来建造你自由之路的材料。"
            },
            {
              "en": "Have you come to the Red Sea place in your life, <br>Where, in spite of all you can do, <br>There is no way out, there is no way back, <br>There is no other way but through? <br>Then wait on the Lord with a trust <span class=\"vocab-trigger\" data-vocab=\"serene\">serene<\/span> <br>Till the night of your fear is gone; <br>He will send the wind, He will heap the floods, <br>When He says to your soul, \"Move on.\" <br>And His hand will lead you through—clear through— <br>Ere the watery walls roll down, <br>No foe can reach you, no wave can touch, <br>No mightiest sea can drown; <br>The tossing <span class=\"vocab-trigger\" data-vocab=\"billows\">billows<\/span> may rear their crests, <br>Their foam at your feet may break, <br>But o'er the seabed you will walk dry ground <br>In the path that your Lord will make. <br>In the morning watch, 'neath the lifted cloud, <br>You will see but the Lord alone, <br>When He leads you on from the place of the sea <br>To a land that you have not known; <br>And your fears will pass as your foes have passed, <br>You will be no more afraid; <br>You will sing His praise in a better place, <br>A place that His hand has made. <br>—Annie Johnson Flint",
              "zh": "你是否已到了生命中的红海之处，在那里，尽管你尽力而为，却没有出路，没有退路，除了穿过别无他途？那么以安静的信托等候主，直到你惧怕的黑夜过去；祂必差来大风，祂必堆积洪水，当祂对你的灵魂说：「往前走。」祂的手必领你经过——全然经过——在水墙倒塌之前，没有仇敌能碰到你，没有波浪能触及你，最强大的海也不能淹没你；翻腾的巨浪可以昂起它们的冠冕，它们的飞沫可以在你脚前碎裂，但你要在海床上走干地，在你主所开的道路中。在晨更之时，在升起的云下，你必只见主独自一人，当祂从海边领你前行，到一片你所不认识的土地；你的恐惧必过去，如同你的仇敌已过去，你必不再惧怕；你要在更美之地歌唱赞美祂，一片祂手所造的地方。——安妮·约翰逊·弗林特",
              "simpEn": "Have you come to your Red Sea place in life, where there is no way out, no way back, no other way but through? Then wait on the Lord with calm trust till your night of fear is gone. He will send the wind, heap the floods, when He says to your soul, 'Move on.' His hand will lead you through, clear through, before the watery walls roll down. No foe can reach you, no wave can touch, no mightiest sea can drown. The tossing billows may rear their crests, their foam may break at your feet, but over the seabed you will walk dry ground in the path your Lord will make. In the morning watch, beneath the lifted cloud, you will see only the Lord, when He leads you from the sea to a land you have not known. Your fears will pass as your foes have passed; you will be no more afraid. You will sing His praise in a better place, a place His hand has made.",
              "simpZh": "你是否到了人生的红海之处，没有出路，没有退路，只有穿过去这一条路？那就以安静的信任等候主，直到恐惧的黑夜过去。祂会差来风，堆积洪水，当祂对你的灵魂说：'往前走。' 祂的手必领你穿过，完全穿过，在水墙倒塌之前。没有仇敌能碰到你，没有波浪能触及你，最强大的海也不能淹死你。翻腾的巨浪可以昂起头，飞沫在你脚前碎裂，但你要在海床上走干地，走你主所开的路。在晨更之时，在升起的云下，你必只见主独自一人，当祂领你从海边到一片你不认识的土地。你的恐惧必过去，如同你的仇敌已过去；你必不再惧怕。你要在更美之地歌唱赞美祂，一片祂手所造的地方。"

            {
              "en": "What if some did not have faith? Will their lack of faith <span class=\"vocab-trigger\" data-vocab=\"nullify\">nullify<\/span> God's faithfulness? (Romans 3:3)",
              "zh": "即便有不信的，这有何妨呢？难道他们的不信就废掉神的信吗？（罗马书3:3）",
              "simpEn": "What if some did not believe? Will their unbelief cancel God's faithfulness?",
              "simpZh": "即使有人不信，那又怎样？难道他们的不信能取消神的信实吗？"
            },
            {
              "en": "I suspect that the source of every bit of sorrow in my life can be traced to simple unbelief. If I truly believe the past is totally forgiven, the present is supplied with power, and the future is bright with hope, how could I be anything but completely happy? Yes, the future is bright, because of God's faithfulness. His <span class=\"vocab-trigger\" data-vocab=\"abiding truth\">abiding truth<\/span> does not change with my mood, and He never <span class=\"vocab-trigger\" data-vocab=\"wavers\">wavers<\/span> when I stumble and fall over a promise of His through my unbelief. His faithfulness stands firm and as <span class=\"vocab-trigger\" data-vocab=\"prominent\">prominent<\/span> as mountain peaks of pearl splitting the clouds of eternity. And each base of His hills is rooted at an <span class=\"vocab-trigger\" data-vocab=\"unfathomable depth\">unfathomable depth<\/span> on the rock of God.",
              "zh": "我怀疑我生命中每一点忧伤的源头都可以追溯到简单的不信。如果我真相信过去已经完全被赦免，现在有能力的供应，未来有盼望的光明，我怎能不完全快乐呢？是的，未来是光明的，因为神是信实的。祂永存的真理不因我的情绪而改变，当我因不信而在祂的应许上绊跌时，祂永不动摇。祂的信实坚定稳固，如同劈开永恒之云的珍珠般山峰那样显著。祂诸山的每一根基，都扎根在神磐石那不可测度的深处。",
              "simpEn": "I suspect every sorrow in my life comes from simple unbelief. If I truly believed the past is forgiven, the present is full of power, and the future is bright with hope, I could only be completely happy. The future is bright because God is faithful. His unchanging truth doesn't shift with my moods, and He never wavers when I stumble over His promises in unbelief. His faithfulness stands as prominent as pearl mountain peaks splitting the clouds of eternity, rooted at unfathomable depth on the rock of God.",
              "simpZh": "我怀疑我生命中每一点忧伤的根源都是简单的不信。如果我真相信过去完全被赦免，现在满有能力供应，未来充满盼望的光明，我怎会不完全快乐呢？未来是光明的，因为神是信实的。祂永存的真理不随我的情绪改变，当我因不信在祂应许上跌倒时，祂永不动摇。祂的信实坚定稳固，像珍珠般的山峰劈开永恒的云那样显著，根基扎根在神磐石那不可测度的深处。"

              "simpEn": "Mont Blanc doesn't disappear like a passing vision or fanciful mist just because a climber gets dizzy on its slopes.",

            },
            {
              "en": "Is it any wonder that we do not receive God's blessing after stumbling over His promise through unbelief? I am not saying that faith <span class=\"vocab-trigger\" data-vocab=\"merits\">merits<\/span> an answer or that we can work to earn it. But God Himself has made believing a condition of receiving, and the Giver has a <span class=\"vocab-trigger\" data-vocab=\"sovereign right\">sovereign right<\/span> to choose His own terms for His gifts. —Samuel Hart",
              "zh": "我们因不信而绊跌在神的应许上之后，得不着神的祝福，这有什么奇怪呢？我不是说信心配得答复，或我们可以靠行为赚得。但神自己立定了相信是领受的条件，并且赐予者有权柄选择祂赐恩的条件。——撒母耳·哈特",
              "simpEn": "Is it any wonder we don't receive God's blessing after stumbling over His promise through unbelief? Faith doesn't earn the answer, but God Himself made believing a condition of receiving. The Giver has the right to choose His own terms for His gifts.",
              "simpZh": "我们因不信在神的应许上跌倒后得不着祝福，这有什么奇怪呢？信心不是赚得答复，但神自己定下了相信是领受的条件。赐予者有权选择祂赐恩的条件。"
            },
            {
              "en": "Unbelief continually asks, \"How can this be possible?\" It is always full of \"how's,\" yet faith needs only one great answer to even ten thousand \"how's.\" That answer is—GOD! —C. H. M. <br>No one accomplishes so much in so little time as when he or she is praying. And the following thought certainly aligns well with all that the Lord Jesus Christ taught on prayer: If only ONE BELIEVER WITH TOTAL FAITH rises up, the history of the world will be changed. Will YOU be that one to rise up, submitting yourself to the sovereignty and guidance of God our Father? —A. E. McAdam <br>Prayer without faith quickly <span class=\"vocab-trigger\" data-vocab=\"degenerates\">degenerates<\/span> into an aimless routine or heartless hypocrisy. However, prayer with faith brings the omnipotence of God to the support of our petitions. It is better not to pray until your entire being responds to, and understands, the power of prayer. When genuine prayer is even whispered, earth and heaven, and the past and future, say, \"Amen!\" This is the kind of prayer Christ prayed. —P. C. M. <br>Nothing lies beyond the reach of prayer except those things outside the will of God.",
              "zh": "不信不断在问：「这怎么可能？」它总是满了「怎样」，然而信心对一万个「怎样」只需要一个伟大的答案。那答案就是——神！——C. H. M.。没有人在如此短的时间内，能像他或她祷告时所成就的那么多。并且下面这个想法，完全符合主耶稣基督关于祷告的教导：只要有一个完全信心的信徒站起来，世界的历史就会改变。你愿意成为那一个站起来的人，将自己降服于我们父神的主权和引导之下吗？——A. E. 麦克亚当。没有信心的祷告，很快就退化成无目的的形式或无心的假冒。然而，有信心的祷告，则使神的全能来支持我们的祈求。宁可不祷告，直到你的全人对祷告的能力有反应、有领会。当真正的祷告哪怕只是低语，天地和过去未来都说「阿们！」这正是基督所献上的那种祷告。——P. C. M.。除了在神旨意之外的事，没有什么是在祷告范围之外的。",
              "simpEn": "Unbelief always asks, 'How is this possible?' It's full of 'how's,' but faith needs only one answer to ten thousand 'how's': GOD! —C. H. M. No one accomplishes so much in so little time as when praying. If only one believer with total faith rises up, the history of the world will change. Will YOU be that one? —A. E. McAdam. Prayer without faith quickly becomes an empty routine or hollow hypocrisy. But prayer with faith brings God's omnipotence to support our requests. Better not to pray until your whole being responds to the power of prayer. When genuine prayer is whispered, earth, heaven, past, and future say, 'Amen!' This is the kind of prayer Christ prayed. —P. C. M. Nothing lies beyond the reach of prayer except what is outside God's will.",
              "simpZh": "不信一直问：'这怎么可能？' 它总是满了'怎样'，但信心对一万个'怎样'只需要一个答案：神！—C. H. M.。没有人在短时间内能像祷告时成就那么多。只要有一个完全信心的信徒站起来，世界的历史就会改变。你愿意成为那一个吗？—A. E. 麦克亚当。没有信心的祷告很快就变成空洞的形式或假冒。但有信心的祷告使神的全能来支持我们的祈求。最好在你全人对祷告的能力有反应之前不要祷告。当真正的祷告被低语出来时，天地、过去未来都说'阿们！' 这就是基督所献上的祷告。—P. C. M.。除了在神旨意之外的事，没有什么是祷告范围之外的。"

            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Summon your power\">Summon your power<\/span>, O God; show us your strength. (Psalm 68:28)",
              "zh": "神啊，求你施展你的能力；神啊，求你显出你为我们所施展的大能。（诗篇68:28）",
              "simpEn": "Show Your power, O God; display Your strength.",
              "simpZh": "神啊，显出你的能力，展现你的力量。"
            },
            {
              "en": "The Lord imparts to me the <span class=\"vocab-trigger\" data-vocab=\"underlying strength\">underlying strength<\/span> of character that gives me the necessary energy and decision-making ability to live my life. He strengthens me \"with power through his Spirit in [my] inner being\" (Eph. 3:16). And the strength He gives is continuous, for He is a source of power I cannot <span class=\"vocab-trigger\" data-vocab=\"exhaust\">exhaust<\/span>. \"Your strength will equal your days\" (Deut. 33:25)—my strength of will, affection, judgment, ideals, and achievement will last a lifetime.",
              "zh": "主赐给我品格的底层力量，这力量给了我生活所需的精力和决断能力。祂「借着祂的灵，叫〔我〕心里的力量刚强起来」（弗3:16）。并且祂赐的力量是连续的，因为祂是我无法耗尽的能源。「你的日子如何，你的力量也必如何」（申33:25）——我意志、情感、判断、理想和成就的力量将持续一生之久。",
              "simpEn": "The Lord gives me deep strength of character—the energy and decision-making ability I need to live. He strengthens me with power through His Spirit in my inner being (Eph. 3:16). And the strength He gives is continuous, a source I cannot exhaust. 'Your strength will equal your days' (Deut. 33:25)—strength of will, love, judgment, ideals, and achievement will last a lifetime.",
              "simpZh": "主赐给我品格的深层力量，给我生活所需的精力和决断能力。祂借着祂的灵使我心里的力量刚强起来（弗3:16）。祂赐的力量是持续不断的，是我无法耗尽的源头。'你的日子如何，你的力量也必如何'（申33:25）——意志、情感、判断、理想和成就的力量将持续一生。"
            },
            {
              "en": "\"The Lord is my strength\" (Ex. 15:2) to go on. He gives me the power to walk the long, straight, and level path, even when the <span class=\"vocab-trigger\" data-vocab=\"monotonous\">monotonous<\/span> way has no turns or curves offering pleasant surprises and when my spirit is depressed with the terrible <span class=\"vocab-trigger\" data-vocab=\"drudgery\">drudgery<\/span>. \"The Lord is my strength\" to go up. He is my power to climb the straight and narrow path up the Hill of Difficulty, as Christian did in Pilgrim's Progress, and not be afraid. \"The Lord is my strength\" to go down. It is often once I leave the <span class=\"vocab-trigger\" data-vocab=\"invigorating heights\">invigorating heights<\/span>, where the wind and sunlight have surrounded me, and begin to descend to the more confining, humid, and <span class=\"vocab-trigger\" data-vocab=\"stifling\">stifling<\/span> heat of the valley below that my heart grows faint.",
              "zh": "「耶和华是我的力量」（出15:2）去继续前进。祂给我能力行走那漫长、笔直又平坦的路，即使那单调的路途没有转弯或曲径提供惊喜，我的灵因可怕的苦工而消沉时也是如此。「耶和华是我的力量」去向上攀登。祂是我攀登那通往困难山的窄而直之路的能力，正如《天路历程》中的基督徒一样，并且不惧怕。「耶和华是我的力量」去向下行。往往是当我离开那风和阳光环绕的清爽高处，开始下降到下面更局限、潮湿且令人窒息的谷中热气时，我的心才会发昏。",
              "simpEn": "'The Lord is my strength' (Ex. 15:2) to go on. He gives power to walk the long, straight, level path, even when the monotonous way has no pleasant surprises and my spirit is depressed with terrible drudgery. 'The Lord is my strength' to go up—power to climb the straight, narrow path up the Hill of Difficulty, like Christian in Pilgrim's Progress, without fear. 'The Lord is my strength' to go down. Often when I leave the invigorating heights where wind and sunlight surrounded me and descend to the confining, humid, stifling heat of the valley below, my heart grows faint.",
              "simpZh": "'耶和华是我的力量'（出15:2）去继续前进。祂给我能力走那漫长、笔直、平坦的路，即使路单调没有惊喜，我的灵因苦工消沉时也是如此。'耶和华是我的力量'去向上攀登——能力去爬那通往困难山的窄路，像《天路历程》里的基督徒一样，不惧怕。'耶和华是我的力量'去向下行。往往当我离开风和阳光环绕的清爽高处，开始下降到下面又闷又湿热令人窒息的山谷时，我的心才会发昏。"
            },
            {
              "en": "\"The Lord is my strength\" to sit still. And what a difficult accomplishment this is! I often say to others during those times when I am compelled to be still, \"If only I could do something!\" I feel like the mother who stands by her sick child but is powerless to heal. What a severe test! Yet to do nothing except to sit still and wait requires tremendous strength. \"The Lord is my strength!\" \"Our competence comes from God\" (2 Cor. 3:5). —from The Silver Lining",
              "zh": "「耶和华是我的力量」去安静坐着不动。这是何等困难的成就！我被迫安静不动的时候，常对别人说：「只要我能做点什么就好了！」我觉得自己像那位站在生病孩子旁边却无力医治的母亲。这是何等严峻的考验！然而，除了安静坐着等待之外什么也不做，需要极大的力量。「耶和华是我的力量！」「我们所能承担的，乃是出于神」（林后3:5）。——摘自《银边》",
              "simpEn": "'The Lord is my strength' to sit still. What a hard thing this is! When I am forced to be still, I often say, 'If only I could do something!' I feel like a mother standing by her sick child but powerless to heal. What a severe test! Yet to do nothing but sit still and wait requires tremendous strength. 'The Lord is my strength!' 'Our competence comes from God' (2 Cor. 3:5).",
              "simpZh": "'耶和华是我的力量'去安静坐着不动。这是多难的事啊！我被迫安静时，常说：'只要我能做点什么就好了！' 我觉得自己像那位站在生病孩子旁却无力医治的母亲。多么严峻的考验！然而，除了安静坐着等候以外什么也不做，需要极大的力量。'耶和华是我的力量！' '我们所能承担的，乃是出于神'（林后3:5）。"

          "heading": "June 28",
          "audio": "audio/Streams in the Desert - June 28.m4a",
          "paragraphs": [
            {
              "en": "There before me was a door standing open in heaven. (Revelation 4:1)",
              "zh": "此后，我观看，见天上有门开了。（启示录4:1）",
              "simpEn": "There before me was a door standing open in heaven.",
              "simpZh": "在我面前，天上有扇门敞开着。"
            },
            {
              "en": "We should remember that John wrote these words while on the island of Patmos. He was there \"because of the word of God and the testimony of Jesus\" (Rev. 1:9). He had been <span class=\"vocab-trigger\" data-vocab=\"banished\">banished<\/span> to this island, which was an isolated, rocky, and <span class=\"vocab-trigger\" data-vocab=\"inhospitable\">inhospitable<\/span> prison. Yet it was here, under difficult circumstances—separated from all his loved ones in Ephesus, excluded from worshiping with the church, and condemned to only the companionship of unpleasant fellow captives—that he was granted this vision as a special privilege. It was as a prisoner that he saw \"a door standing open in heaven.\"",
              "zh": "我们应当记住，约翰是在拔摩岛上写这些话的。他是在那里「为神的道，并为给耶稣作的见证」（启1:9）。他已经被放逐到这座岛上，这是一个与世隔绝、岩石遍布、不宜居住的监狱。然而就在这里，在艰苦的环境中——与他所有以弗所的亲人分离，被禁止与教会一同敬拜，只能与不愉快的同囚为伴——他却蒙赐予这异象作为特别的权利。正是作为囚徒，他看见「天上有门开了」。",
              "simpEn": "Remember, John wrote these words while on the island of Patmos. He was banished there for God's word and Jesus' testimony. It was an isolated, rocky, harsh prison. Yet here, separated from loved ones, excluded from church worship, surrounded by unpleasant fellow prisoners, he was granted this vision. As a prisoner, he saw 'a door standing open in heaven.'",
              "simpZh": "要记住，约翰是在拔摩岛上写这些话的。他因神的道和耶稣的见证被放逐到那里。那是一个与世隔绝、布满岩石、不宜居住的监狱。然而就在这里，与亲人分离，不能和教会一同敬拜，只能与不愉快的同囚作伴，他却蒙赐予这异象。正是作为囚徒，他看见'天上有门开了'。"
            },
            {
              "en": "We should also remember Jacob, who laid down in the desert to sleep after leaving his father's house. \"He had a dream in which he saw a stairway resting on the earth, with its top reaching to heaven, and . . . above it stood the Lord\" (Gen. 28:12–13). The doors of heaven have been opened not only for these two men but also for many others. And in the world's estimation, it seems as if their circumstances were utterly unlikely to receive such revelations. Yet how often we have seen \"a door standing open in heaven\" for those who are prisoners and captives, for those who suffer from a chronic illness and are bound with iron chains of pain to a bed of sickness, for those who wander the earth in lonely isolation, and for those who are kept from the Lord's house by the demands of home and family.",
              "zh": "我们也应当记念雅各，他离开父家之后在旷野躺卧睡觉。「梦见一个梯子立在地上，梯子的头顶着天，有神的使者在梯子上，上去下来……耶和华站在梯子以上」（创28:12-13）。天国之门不仅为这两个人敞开，也为许多其他人敞开。在世人的评估中，他们的环境似乎完全不可能领受这样的启示。然而，我们何等经常看见，对于那些被囚和被掳的人，对于那些患慢性疾病、被铁链般的疼痛绑在病床上的人，对于那些在孤寂隔离中飘零的人，对于那些因家庭的需要而被阻于主殿之外的人，「天上有门开了」。",
              "simpEn": "Remember Jacob, who lay down in the desert to sleep after leaving his father's house. He dreamed of a stairway reaching to heaven with the Lord above it (Gen. 28:12-13). Heaven's doors have opened not only for these two but for many others whose circumstances seemed utterly unlikely for such revelations. How often we see 'a door standing open in heaven' for prisoners, the chronically ill bound to a sickbed, the lonely wanderer, and those kept from the Lord's house by family demands.",
              "simpZh": "也要记念雅各，他离开父家后在旷野躺下睡觉，梦见一个梯子立在地上，头顶着天，有神的使者上去下来，耶和华站在梯子以上（创28:12-13）。天国之门不仅为这两人敞开，也为许多其他人敞开。在世人的评估中，他们的环境似乎完全不可能领受这样的启示。然而我们何等经常看见，对于那些被囚的、患慢性疾病被铁链般的疼痛绑在病床上的、在孤寂中飘零的、因家庭需要而不能去主殿的人，'天上有门开了'。"
            },
            {
              "en": "But there are conditions to seeing the open door. We must know what it is to be \"in the Spirit\" (Rev. 1:10). We must be \"pure in heart\" (Matt. 5:8) and obedient in faith. We must be willing to \"consider everything a loss compared to the surpassing greatness of knowing Christ Jesus\" (Phil. 3:8). Then once God is everything to us, so that \"in him we live and move and have our being\" (Acts 17:28), the door to heaven will stand open before us as well. —from Daily Devotional Commentary",
              "zh": "但是看见敞开的门有条件。我们必须知道什么叫「被圣灵感动」（启1:10）。我们必须「清心」（太5:8）且在信心上顺服。我们必须甘愿「将万事当作有损的，因以认识我主基督耶稣为至宝」（腓3:8）。然后，一旦神成为我们的一切，以致「我们生活、动作、存留，都在乎祂」（徒17:28），天国的门也会在我们面前敞开。——摘自《每日灵修注释》",
              "simpEn": "But there are conditions to seeing the open door. We must know what it is to be 'in the Spirit' (Rev. 1:10). We must be 'pure in heart' (Matt. 5:8) and obedient in faith. We must be willing to 'consider everything a loss compared to the surpassing greatness of knowing Christ Jesus' (Phil. 3:8). Once God is everything to us, so that 'in Him we live and move and have our being' (Acts 17:28), the door to heaven will stand open before us as well.",
              "simpZh": "但看见敞开的门是有条件的。我们必须知道什么是'在灵里'（启1:10）。我们必须'清心'（太5:8）且在信心上顺服。我们必须甘愿'将万事当作有损的，因以认识我主基督耶稣为至宝'（腓3:8）。一旦神成为我们的一切，以致'我们生活、动作、存留都在乎祂'（徒17:28），天国的门也会在我们面前敞开。"
            },
            {
              "en": "God has His mountains bleak and bare, <br>Where He does bid us rest awhile; <br>Cliffs where we breathe a purer air, <br>Lone peaks that catch the day's first smile. <br>God has His deserts broad and brown— <br>A solitude—a sea of sand, <br>Where He does let heaven's curtain down, <br>Unveiled by His Almighty hand.",
              "zh": "神有祂萧瑟光秃的山岭，在那里祂叫我们片时安歇；有我们可以呼吸更纯净空气的峭壁，有捕捉白日第一抹微笑的孤峰。神有祂宽广褐色的大漠——一片孤寂——一片沙海，在那里祂让天幕垂下，由祂全能的手揭开。",
              "simpEn": "God has His bleak and bare mountains, where He bids us rest awhile; cliffs where we breathe purer air, lone peaks that catch the day's first smile. God has His deserts broad and brown—a solitude, a sea of sand, where He lets heaven's curtain down, unveiled by His almighty hand.",
              "simpZh": "神有祂萧瑟光秃的山岭，在那里祂叫我们片时安歇；有可以呼吸更纯净空气的峭壁，有捕捉清晨第一缕阳光的孤峰。神有祂宽广褐色的大漠——一片孤寂，一片沙海，在那里祂让天幕垂下，由祂全能的手揭开。"
            }

        {
          "sectionId": 6,
          "heading": "June 29",
          "audio": "audio/Streams in the Desert - June 29.m4a",
          "paragraphs": [
            {
              "en": "There we saw the <span class=\"vocab-trigger\" data-vocab=\"giants\">giants<\/span>. (Numbers 13:33 KJV)",
              "zh": "我们在那里看见……伟人。（民数记13:33）",
              "simpEn": "We saw the giants there.",
              "simpZh": "我们在那里看见了巨人。"
            },
            {
              "en": "Yes, the Israeli spies saw giants, but Joshua and Caleb saw God! Those who doubt still say today, \"We can't attack ...; they are stronger than we are\" (v. 31). Yet those who believe say, \"We should go up and take possession ... , for we can certainly do it\" (v. 30). Giants represent great difficulties, and they <span class=\"vocab-trigger\" data-vocab=\"stalk\">stalk<\/span> us everywhere. They are in our families, our churches, our social life, and even our own hearts. We must overcome them or they will devour us, just as the ancient Israelites, fearing those in Canaan, said, \"The land we explored devours those living in it. All the people we saw there are of great size\" (v. 32). We should exhibit faith as did Joshua and Caleb, who said, \"Do not be afraid . . . , because we will swallow them up\" (Num. 14:9). In effect, they told the others, \"We will be stronger by overcoming them than if there had been no giants to defeat.\"",
              "zh": "是的，以色列的探子看见了巨人，但约书亚和迦勒看见了神！那些怀疑的人今天仍然说：「我们不能上去攻击那民，因为他们比我们强壮」（31节）。然而那些相信的人说：「我们立刻上去得那地吧！我们足能得胜」（30节）。巨人代表巨大的困难，它们到处窥探我们。它们在我们的家庭、我们的教会、我们的社交生活、甚至我们自己的心中。我们必须战胜它们，否则它们就要吞吃我们，正如古以色列人惧怕迦南人所说的：「我们所窥探、经过之地是吞吃居民之地，我们在那里所看见的人民都身量高大」（32节）。我们应当显出约书亚和迦勒那样的信心，他们说：「不要怕……因为他们是我们的食物」（民14:9）。实际上，他们告诉其他人：「我们胜过他们之后，会变得比若没有巨人去击败时更刚强。」",
              "simpEn": "Yes, the spies saw giants, but Joshua and Caleb saw God! Doubters still say, 'We can't attack them; they are stronger than we are.' But believers say, 'We should go up and take possession, for we can certainly do it.' Giants are great difficulties, and they stalk us everywhere—in our families, churches, social life, and even our own hearts. We must overcome them or they will devour us. Joshua and Caleb said, 'Don't be afraid... we will swallow them up.' In effect, they said, 'We will be stronger by overcoming them than if there had been no giants to defeat.'",
              "simpZh": "是的，探子看见了巨人，但约书亚和迦勒看见了神！怀疑的人今天还说：'我们不能上去攻击他们，他们比我们强壮。' 但相信的人说：'我们立刻上去得那地吧！我们足能得胜。' 巨人代表巨大的困难，它们到处窥探我们——在我们的家庭、教会、社交生活、甚至我们自己的心中。我们必须战胜它们，否则它们就要吞吃我们。约书亚和迦勒说：'不要怕……因为他们是我们的食物。' 实际上他们在说：'我们胜过他们之后，会变得比没有巨人去击败时更刚强。'"
            },
            {
              "en": "In fact, unless we have overcoming faith, we will be swallowed up—consumed by the giants who block our path. \"With that same spirit of faith\" (2 Cor. 4:13) that Joshua and Caleb had, let us look to God, and He will take care of the difficulties. —selected <br>We encounter giants only when we are serving God and following Him. It was when Israel was going forward that the giants appeared, for when they turned back into the wilderness, they found none.",
              "zh": "事实上，除非我们有得胜的信心，我们就会被吞吃——被那些阻挡我们道路的巨人吞灭。让我们以约书亚和迦勒所有「那同样的信心之灵」（林后4:13），仰望神，祂必对付这些困难。——选。我们只有在服事神、跟随祂的时候，才会遇到巨人。当以色列人向前进的时候巨人才出现，因为当他们转回旷野时，一个巨人也找不到。",
              "simpEn": "Unless we have overcoming faith, we will be swallowed up by the giants blocking our path. With the same spirit of faith Joshua and Caleb had, let us look to God; He will take care of the difficulties. We encounter giants only when we are serving God and following Him. When Israel was going forward, the giants appeared; when they turned back into the wilderness, they found none.",
              "simpZh": "除非我们有得胜的信心，否则我们就会被那些挡路的巨人吞灭。让我们以约书亚和迦勒同样的信心之灵仰望神，祂必对付这些困难。我们只有在服事神、跟随祂的时候才会遇到巨人。当以色列人向前进时巨人才出现；当他们转回旷野时，一个巨人也找不到。"
            },
            {
              "en": "Many people believe that the power of God in a person's life should keep him from all trials and conflicts. However, the power of God actually brings conflict and struggles. You would think that Paul, during his great missionary journey to Rome, would have been kept by God's sovereignty from the power of violent storms and of his enemies. Yet just the opposite was true. He endured one long, difficult struggle with the Jews who were persecuting him. He faced fierce winds, poisonous snakes, and all the powers of earth and of hell. And finally, he narrowly escaped drowning, by swimming to shore at Malta after a shipwreck nearly sent him to a watery grave.",
              "zh": "许多人相信，神在一个人生命中的大能应当保守他免去一切试炼和冲突。然而，神的能力实际上带来了冲突和挣扎。你会想，保罗在他前往罗马的伟大宣教旅程中，神的主权本该保守他脱离暴风和仇敌的能力。但事实恰恰相反。他忍受了与迫害他的犹太人之间漫长艰苦的斗争。他面对了猛烈的狂风、毒蛇、以及地上和地狱的一切权势。最后，他勉强逃过溺毙，在船难几乎将他送入水墓之后，游泳到了马耳他岸上。",
              "simpEn": "Many believe God's power should keep us from all trials and conflicts. But God's power actually brings conflict and struggles. You would think Paul, on his great missionary journey to Rome, would have been kept by God from violent storms and enemies. Yet the opposite was true. He endured long, difficult struggles with persecuting Jews. He faced fierce winds, poisonous snakes, and all the powers of earth and hell. Finally, he narrowly escaped drowning, swimming to shore at Malta after a shipwreck nearly sent him to a watery grave.",
              "simpZh": "许多人相信神在一个人生命中的大能应该保守他免去一切试炼和冲突。但神的能力实际上带来了冲突和挣扎。你会想，保罗在前往罗马的伟大宣教旅程中，神的主权本该保守他脱离暴风和仇敌。但事实恰恰相反。他忍受了与迫害他的犹太人之间漫长艰苦的斗争。他面对了猛烈的狂风、毒蛇、以及地上和地狱的一切权势。最后，他勉强逃过溺毙，在船难几乎将他送入水墓之后，游泳到了马耳他岸上。"
            },
            {
              "en": "Does this sound like a God of infinite power? Yes, it is just like Him. And that is why Paul told us that once he took the Lord Jesus Christ as his life in his body, a severe conflict immediately arose. In fact, the conflict never ended. The pressure on Paul was persistent, but from the conflict he always emerged victorious through the strength of Jesus Christ. Paul described this in quite vivid language: \"We are hard pressed on every side, but not crushed; perplexed, but not in despair; persecuted, but not abandoned; struck down, but not destroyed. We always carry around in our body the death of Jesus, so that the life of Jesus may also be revealed in our body\" (2 Cor. 4:8–10).",
              "zh": "这听起来像是一位无限大能的神吗？是的，这正是祂的方式。所以保罗告诉我们，一旦他将主耶稣基督取为在他身体里的生命，一场猛烈的冲突立刻开始了。事实上，冲突从未止息。保罗身上的压力是持续的，但借着耶稣基督的力量，他永远从冲突中得胜而出。保罗用极生动的语言描述了这点：「我们四面受敌，却不被困住；心里作难，却不至失望；遭逼迫，却不被丢弃；打倒了，却不至死亡。身上常带着耶稣的死，使耶稣的生也显明在我们身上」（林后4:8-10）。",
              "simpEn": "Does this sound like a God of infinite power? Yes, this is just like Him. That's why Paul said that once he took Christ as his life, a severe conflict immediately arose—and never ended. The pressure was persistent, but he always emerged victorious through Christ's strength. Paul vividly described it: 'We are hard pressed on every side, but not crushed; perplexed, but not in despair; persecuted, but not abandoned; struck down, but not destroyed. We always carry around in our body the death of Jesus, so that the life of Jesus may also be revealed in our body' (2 Cor. 4:8-10).",
              "simpZh": "这听起来像是一位无限大能的神吗？是的，这正是祂的方式。所以保罗说，一旦他将基督取为他的生命，一场猛烈的冲突立刻开始了——而且从未结束。压力是持续的，但借着基督的力量他总是得胜。保罗生动地描述：'我们四面受敌，却不被困住；心里作难，却不至失望；遭逼迫，却不被丢弃；打倒了，却不至死亡。身上常带着耶稣的死，使耶稣的生也显明在我们身上'（林后4:8-10）。"
            },
            {
              "en": "What a ceaseless and <span class=\"vocab-trigger\" data-vocab=\"strenuous\">strenuous<\/span> struggle he related! It is nearly impossible to express in English the impact of the original language. Paul gives us five different images in succession. ... The reason so many people fail to experience this divine principle is that they expect to receive it all without a struggle. When conflict comes and the battle rages on, they become discouraged and surrender. God has nothing worth having that is easily gained, for there are no cheap goods on the heavenly market. The cost of our redemption was everything God had to give, and anything worth having is expensive. Difficult times and places are our schools of faith and character. If we are ever to rise above mere human strength, and experience the power of the life of Christ in our mortal bodies, it will be through the process of conflict that could very well be called the \"<span class=\"vocab-trigger\" data-vocab=\"labor pains\">labor pains<\/span>\" of the new life. ... Dear child of God, you may be suffering, but you cannot fail if you will only dare to believe, stand firm, and refuse to be overcome. —from a tract",
              "zh": "他所述的是一场何等不息且艰苦的争战！原语的影响力几乎无法用英文表达。保罗连续给了我们五个不同的画面。……许多人未能经历这属天原则的原因，是他们期望不经过挣扎就得着一切。当冲突来临、战斗剧烈之时，他们就灰心投降。神没有任何值得拥有的事物是轻易可以得到的，因为天国的市场上没有廉价货。我们救赎的代价是神所给予的一切，任何值得拥有的事物都是昂贵的。艰难的时刻和地方，是我们信心和品格的学校。如果我们想要超越单纯人的力量，在我们必死的身体上经历基督生命的权能，就必须经过那大可称为新生「生产之痛」的冲突过程。……神亲爱的孩子，你或许正在受苦，但只要你敢相信，站稳，拒绝被压倒，你就不会失败。——摘自一份福音单张",

              "simpZh": "大约二十年前，一个朋友给了我一本叫《真平安》的书。主要的思想是：神正在我生命深处等候向我说话，只要我够安静去听。我以为这不难，就试着安静下来。但才刚开始，一片完全的喧嚷就好像爆发出来。突然我听见内外上千个声音，有我自己说的话、问题、甚至祷告，还有仇敌的试探和世界混乱的声音。"

      const ch = bookData.chapters[bookmark.chapterIndex];
      let label = LABEL + ' ' + (bookmark.chapterIndex + 1);
      if (ch && ch.sections && bookmark.sectionIndex != null) label += ' · ' + (ch.sections[bookmark.sectionIndex] ? ch.sections[bookmark.sectionIndex].heading : '');
      lbl.textContent = label;
    }
    document.getElementById('bookmarkBtn').addEventListener('click', () => {
      bookmark = { chapterIndex: currentChapterIndex, sectionIndex: currentSection };
      localStorage.setItem(BOOKMARK_KEY, JSON.stringify(bookmark));
      updateBookmarkUI();
    });
    document.getElementById('goBookmarkBtn').addEventListener('click', () => {
      if (!bookmark) return;
      loadChapter(bookmark.chapterIndex);
      document.getElementById('chapterSelect').value = bookmark.chapterIndex;
      if (readingMode === 'sections' && bookmark.sectionIndex != null) { currentSection = bookmark.sectionIndex; renderSectionsMode(); }
    });
    document.getElementById('clearBookmarkBtn').addEventListener('click', () => { bookmark = null; localStorage.removeItem(BOOKMARK_KEY); updateBookmarkUI(); });
    updateBookmarkUI();

    function detectReadingMode(ch) {
      const stored = localStorage.getItem(READING_MODE_KEY);
      if (stored && ['sections','full','pages'].includes(stored)) readingMode = stored;
      else if (ch.sections && ch.sections.length > 0) readingMode = 'sections';
      else readingMode = 'full';
    }

    const readingModeSelect = document.getElementById('readingModeSelect');
    readingModeSelect.addEventListener('change', () => {
      stopSpeaking();
      readingMode = readingModeSelect.value;
      currentPage = 0;
      localStorage.setItem(READING_MODE_KEY, readingMode);
      if (currentChapter) renderWithMode();
    });

    function populateChapterSelector() {
      const select = document.getElementById("chapterSelect");
      select.innerHTML = "";
      bookData.chapters.forEach((ch, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = LABEL + " " + ch.id + ": " + ch.title;
        select.appendChild(opt);
      });
      select.addEventListener("change", (e) => loadChapter(parseInt(e.target.value)));
    }

    function loadChapter(index) {
      stopSpeaking();
      currentChapterIndex = index;
      currentChapter = bookData.chapters[index];
      currentSection = 0;
      currentPage = 0;
      document.querySelector(".title").textContent = "📖 " + bookData.title + " – " + LABEL + " " + currentChapter.id;
      detectReadingMode(currentChapter);
      readingModeSelect.value = readingMode;
      setupAudioForChapter(currentChapter);
      renderWithMode();
      saveFullProgress();
      updateProgressBar();
      updateMarkReadUI();
    }

    function renderWithMode() {
      const ch = currentChapter;
      if (!ch) return;
      if (readingMode === 'sections' && ch.sections && ch.sections.length > 0) {
        renderSectionsMode();
      } else if (readingMode === 'pages') {
        renderPagesMode();
      } else {
        renderFullMode();
      }
    }

    function renderFullMode() {
      document.getElementById('sectionTabs').innerHTML = '';
      document.getElementById('sectionProgress').textContent = '';
      const paragraphs = currentChapter.paragraphs || (currentChapter.sections ? currentChapter.sections.flatMap(s => s.paragraphs) : []);
      renderParagraphs(paragraphs);
      renderQuiz(currentChapter.quiz || []);
      applyMobileLang(mobileLang);
    }

    function renderPagesMode() {
      document.getElementById('sectionTabs').innerHTML = '';
      const allParagraphs = currentChapter.paragraphs || (currentChapter.sections ? currentChapter.sections.flatMap(s => s.paragraphs) : []);
      const totalPages = Math.max(1, Math.ceil(allParagraphs.length / PAGE_SIZE));
      if (currentPage >= totalPages) currentPage = totalPages - 1;
      if (currentPage < 0) currentPage = 0;
      const pageParagraphs = allParagraphs.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
      renderParagraphs(pageParagraphs);

      const progress = document.getElementById('sectionProgress');
      progress.innerHTML = '';
      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-nav-btn'; prevBtn.textContent = '⬅ 上一页';
      prevBtn.disabled = currentPage === 0;
      prevBtn.addEventListener('click', () => { stopSpeaking(); currentPage--; renderPagesMode(); saveFullProgress(); });
      const label = document.createElement('span');
      label.className = 'page-nav-label';
      label.textContent = '📄 Page ' + (currentPage + 1) + ' of ' + totalPages;
      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-nav-btn'; nextBtn.textContent = '下一页 ➡';
      nextBtn.disabled = currentPage >= totalPages - 1;
      nextBtn.addEventListener('click', () => { stopSpeaking(); currentPage++; renderPagesMode(); saveFullProgress(); });
      progress.appendChild(prevBtn);
      progress.appendChild(label);
      progress.appendChild(nextBtn);

      renderQuiz(currentChapter.quiz || []);
      applyMobileLang(mobileLang);
    }

    function renderSectionsMode() {
      const sections = currentChapter.sections;
      if (!sections || sections.length === 0) { renderFullMode(); return; }
      const tabContainer = document.getElementById('sectionTabs');
      tabContainer.innerHTML = '';
      sections.forEach((sec, idx) => {
        const tab = document.createElement('button');
        tab.className = 'section-tab'; if (idx === currentSection) tab.classList.add('active');
        tab.textContent = (idx+1) + '. ' + sec.heading;
        tab.addEventListener('click', () => {
          stopSpeaking();
          currentSection = idx;
          renderSectionsMode();
          saveFullProgress();
        });
        tabContainer.appendChild(tab);
      });
      document.getElementById('sectionProgress').textContent = 'Section ' + (currentSection+1) + ' of ' + sections.length;
      renderParagraphs(sections[currentSection].paragraphs);
      renderQuiz(sections[currentSection].quiz || []);
      loadSectionAudio(sections[currentSection]);
      applyMobileLang(mobileLang);
      updateMarkReadUI();
    }

    // ----- KEY FIX: renderParagraphs now handles "image" field -----
    function renderParagraphs(paragraphs) {
      const enDiv = document.getElementById('enContent');
      const zhDiv = document.getElementById('zhContent');
      enDiv.innerHTML = ''; zhDiv.innerHTML = '';
      paragraphs.forEach(p => {
        // If there is an image property, show it before the English text
        if (p.image) {
          const imgDiv = document.createElement('div');
          imgDiv.className = 'paragraph-image';
          imgDiv.innerHTML = '<img src="' + p.image + '" alt="illustration">';
          enDiv.appendChild(imgDiv);
        }
        const enContent = isSimplified ? ((() => { const d = document.createElement('div'); d.innerHTML = p.simpEn || ''; return d.textContent; })()) : p.en;
        const enP = document.createElement('p'); enP.innerHTML = enContent;
        enDiv.appendChild(enP);
        const zhP = document.createElement('p'); zhP.textContent = isSimplified ? p.simpZh : p.zh;
        zhDiv.appendChild(zhP);
      });
    }

    // ----- Quiz rendering (unchanged, includes rationale) -----
    function renderQuiz(quizArr) {
      const tfContainer = document.getElementById('tfQuestions');
      tfContainer.innerHTML = '';
      const quizToUse = (quizArr && quizArr.length) ? quizArr : placeholderQuiz;
      quizToUse.forEach((q, i) => {
        const div = document.createElement('div'); div.className = 'quiz-item-wrapper';
        div.innerHTML = `
          <div><strong>${i+1}.</strong> ${q.text}
            <select class='tf-sel' style='width:auto; display:inline-block; margin-left:0.5rem; padding:0.2rem 0.5rem;'>
              <option value=''>--</option><option value='true'>True</option><option value='false'>False</option>
            </select>
          </div>
          <div class='rationale-container'></div>
        `;
        tfContainer.appendChild(div);
      });
      document.getElementById('tfFeedback').textContent = '';
    }

    // ... rest of reader JS unchanged (simplify, speak, check quiz, progress) ...
    document.getElementById('simplifyToggle').addEventListener('click', () => {
      stopSpeaking();
      isSimplified = !isSimplified;
      document.getElementById('simpActiveLabel').classList.toggle('active', isSimplified);
      if (currentChapter) renderWithMode();
      document.getElementById('simplifyToggle').textContent = isSimplified ? '📖 Switch back to Original' : '📖 Switch to Simplified';
      hidePopup();
    });

    const popup = document.getElementById('vocabPopup');
    function showPopup(trigger, vocabKey) {
      const def = vocabDefinitions[vocabKey];
      if (!def) return;
      document.getElementById('popupZh').textContent = def.zh;
      document.getElementById('popupExplain').textContent = '📘 ' + def.explain;
      document.getElementById('popupSimple').textContent = '💬 Simple: ' + def.simple;
      if (window.innerWidth <= 640) {
        // Mobile: pin to bottom of viewport via CSS class (CSS handles position)
        popup.style.top = ''; popup.style.left = '';
        popup.style.bottom = '1rem'; popup.style.left = '1rem'; popup.style.right = '1rem'; popup.style.width = 'auto'; popup.style.maxWidth = 'none';
      } else {
        popup.style.bottom = ''; popup.style.right = ''; popup.style.width = ''; popup.style.maxWidth = '';
        const rect = trigger.getBoundingClientRect();
        let top = rect.bottom + 8, left = rect.left;
        if (left + 320 > window.innerWidth) left = window.innerWidth - 330;
        if (top + 180 > window.innerHeight) top = rect.top - 180;
        popup.style.top = top + 'px'; popup.style.left = left + 'px';
      }
      popup.classList.add('show'); currentVocabTrigger = trigger;
    }
    function hidePopup() { popup.classList.remove('show'); currentVocabTrigger = null; }
    document.addEventListener('click', function(e) {
      const trig = e.target.closest('.vocab-trigger');
      if (trig && trig !== currentVocabTrigger) { e.stopPropagation(); showPopup(trig, trig.getAttribute('data-vocab')); }
      else if (trig === currentVocabTrigger) hidePopup();
      else if (!e.target.closest('#vocabPopup')) hidePopup();
    });
    document.getElementById('closePopup').addEventListener('click', (e) => { e.stopPropagation(); hidePopup(); });
    window.addEventListener('scroll', () => { if (currentVocabTrigger) hidePopup(); });

    // ----- Per-Section Audio Player -----
    const sectionAudio = document.getElementById('sectionAudio');
    const sectionAudioBar = document.getElementById('sectionAudioBar');
    const audioSectionLabel = document.getElementById('audioSectionLabel');

    function loadSectionAudio(sec) {
      if (sec && sec.audio) {
        const src = sec.audio;
        if (sectionAudio.getAttribute('src') !== src) {
          sectionAudio.pause();
          sectionAudio.src = src;
          sectionAudio.load();
        }
        audioSectionLabel.textContent = sec.heading || '';
        sectionAudioBar.style.display = 'flex';
      } else {
        sectionAudio.pause();
        sectionAudio.removeAttribute('src');
        sectionAudioBar.style.display = 'none';
        audioSectionLabel.textContent = '';
      }
    }

    function setupAudioForChapter(ch) {
      // Called on chapter load — clear player; section audio loaded when section is rendered
      sectionAudio.pause();
      sectionAudio.removeAttribute('src');
      sectionAudioBar.style.display = 'none';
      audioSectionLabel.textContent = '';
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) sectionAudio.pause();
    });

    // ----- EN/ZH Mobile Toggle & Swipe -----
    function applyMobileLang(lang) {
      mobileLang = lang;
      const enCol = document.getElementById('enCol');
      const zhCol = document.getElementById('zhCol');
      const btnEn = document.getElementById('toggleEnBtn');
      const btnZh = document.getElementById('toggleZhBtn');
      if (window.innerWidth <= 640) {
        enCol.classList.toggle('mobile-visible', lang === 'en');
        zhCol.classList.toggle('mobile-visible', lang === 'zh');
      } else {
        enCol.classList.add('mobile-visible');
        zhCol.classList.add('mobile-visible');
      }
      if (btnEn) btnEn.classList.toggle('active', lang === 'en');
      if (btnZh) btnZh.classList.toggle('active', lang === 'zh');
    }

    document.getElementById('toggleEnBtn').addEventListener('click', () => applyMobileLang('en'));
    document.getElementById('toggleZhBtn').addEventListener('click', () => applyMobileLang('zh'));
    window.addEventListener('resize', () => applyMobileLang(mobileLang));

    // Swipe left = show Chinese, swipe right = show English
    // Only triggers if horizontal movement clearly dominates vertical (not a scroll)
    let swipeStartX = 0;
    let swipeStartY = 0;
    const colsContainer = document.getElementById('colsContainer');
    colsContainer.addEventListener('touchstart', e => {
      swipeStartX = e.touches[0].clientX;
      swipeStartY = e.touches[0].clientY;
    }, { passive: true });
    colsContainer.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - swipeStartX;
      const dy = e.changedTouches[0].clientY - swipeStartY;
      const isHorizontalSwipe = Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2;
      if (isHorizontalSwipe && window.innerWidth <= 640) {
        applyMobileLang(dx < 0 ? 'zh' : 'en');
      }
    }, { passive: true });

    // stub — called in simplify toggle and chapter load
    function stopSpeaking() {}

    document.getElementById('checkTfBtn').addEventListener('click', () => {
      const quizArr = currentChapter.sections && readingMode==='sections' ? (currentChapter.sections[currentSection]?.quiz || []) : (currentChapter.quiz || []);
      const quizToUse = quizArr.length ? quizArr : placeholderQuiz;
      let correct = 0;
      document.querySelectorAll('.tf-sel').forEach((sel, i) => {
        const val = sel.value;
        const currentItem = quizToUse[i];
        const wrapper = sel.closest('.quiz-item-wrapper');
        const ratBox = wrapper.querySelector('.rationale-container');
        if (val === '') { sel.style.border = '1px solid #ccc'; ratBox.style.display = 'none'; return; }
        const userTrue = (val === 'true');
        const correctChoice = (userTrue === currentItem.answer);
        ratBox.style.display = 'block';
        if (correctChoice) {
          sel.style.border = '2px solid green';
          correct++;
          ratBox.style.borderLeft = '4px solid green';
          ratBox.innerHTML = '<span style="color:green; font-weight:bold;">✓ Correct.</span> ' + (currentItem.rationale || '');
        } else {
          sel.style.border = '2px solid red';
          ratBox.style.borderLeft = '4px solid red';
          ratBox.innerHTML = '<span style="color:red; font-weight:bold;">✗ Incorrect.</span> ' + (currentItem.rationale || '');
        }
      });
      document.getElementById('tfFeedback').textContent = 'Score: ' + correct + ' / ' + quizToUse.length;
    });

    function saveFullProgress() {
      const state = { chapterIndex: currentChapterIndex, sectionIndex: (readingMode==='sections' && currentChapter.sections) ? currentSection : 0, pageIndex: (readingMode==='pages') ? currentPage : 0, readingMode };
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(state));
      updateProgressIndicator();
    }

    function updateProgressIndicator() {
      const saved = localStorage.getItem(PROGRESS_KEY);
      if (saved) {
        try {
          const state = JSON.parse(saved);
          const ch = bookData.chapters[state.chapterIndex];
          if (ch) {
            let info = '📌 Last read: ' + LABEL + ' ' + ch.id;
            if (ch.sections && state.sectionIndex) info += ' · ' + ch.sections[state.sectionIndex].heading;
            info += ' | ' + (state.chapterIndex+1) + '/' + bookData.chapters.length + ' chapters';
            document.getElementById('progressBox').textContent = info;
          }
        } catch(e) {}
      }
    }

    function restoreProgress() {
      const saved = localStorage.getItem(PROGRESS_KEY);
      if (saved) {
        try {
          const state = JSON.parse(saved);
          if (state.chapterIndex >= 0 && state.chapterIndex < bookData.chapters.length) {
            document.getElementById('chapterSelect').value = state.chapterIndex;
            readingMode = state.readingMode || 'sections';
            readingModeSelect.value = readingMode;
            loadChapter(state.chapterIndex);
            if (readingMode === 'sections' && bookData.chapters[state.chapterIndex].sections) {
              currentSection = state.sectionIndex || 0;
              renderSectionsMode();
            } else if (readingMode === 'pages') {
              currentPage = state.pageIndex || 0;
              renderPagesMode();
            }
            return;
          }
        } catch(e) {}
      }
      loadChapter(0);
    }

    populateChapterSelector();
    restoreProgress();
    updateProgressIndicator();
  })();
</script>
</body>
</html>
