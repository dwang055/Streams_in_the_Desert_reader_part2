              "en": "God plowed one day with an earthquake, <br>And drove His <span class=\"vocab-trigger\" data-vocab=\"furrows\">furrows<\/span> deep! <br>The huddled plains <span class=\"vocab-trigger\" data-vocab=\"upstarted\">upstarted<\/span>, <br>The hills were all <span class=\"vocab-trigger\" data-vocab=\"aleap\">aleap<\/span>! <br>But that is the mountains' secret, <br>Long hidden in their breast; <br>\"God's peace is everlasting,\" <br>Are the dream words of their rest. <br>He made them the <span class=\"vocab-trigger\" data-vocab=\"haunts of beauty\">haunts of beauty<\/span>, <br>The home chosen for His grace; <br>He spreads forth His mornings upon them, <br>His sunsets light their face. <br>... <br>They are nurseries for young rivers, <br>Nests for His flying cloud, <br><span class=\"vocab-trigger\" data-vocab=\"Homesteads\">Homesteads<\/span> for newborn races, <br>Masterful, free, and proud. <br>The people of tired cities <br>Come up to their shrines and pray; <br>God <span class=\"vocab-trigger\" data-vocab=\"freshens\">freshens<\/span> them within again, <br>As He passes by all day. <br>And lo, I have caught their secret! <br>The beauty deeper than all! <br>This faith—that life's hard moments, <br>When the <span class=\"vocab-trigger\" data-vocab=\"jarring sorrows\">jarring sorrows<\/span> befall, <br>Are but God plowing His mountains; <br>And those mountains yet will be <br>The source of His grace and freshness, <br>And His peace everlasting to me. <br>—William C. Garnett",
              "zh": "神曾以地震犁地，犁开深深的垄沟！聚拢的平原隆然突起，群山全都在跳跃！然而那就是群山的秘密，久藏于它们胸怀之中：「神的平安是永远的」，是它们安息的梦语。祂使它们成为美的居所，祂恩典选定的家；祂铺开祂的清晨在它们之上，祂的晚霞光照它们的面庞。……它们是幼河的保育园，是祂飞云的巢窝，是新生的族类的家园，豪迈、自由、骄傲。疲惫城市的居民上到它们的圣所祈祷；神终日经过，使他们重新得力。看哪，我已经得着它们的秘密！那比一切都深的美丽！就是这信心——人生艰难的时刻，当不和谐的忧伤临到时，都不过是神正在犁祂的山岭；而那群山终将成为祂恩典与新力的源头，并祂赐给我的永在平安。——威廉·C. 加内特",
              "simpEn": "God plowed with an earthquake, making deep furrows. The plains rose, hills leaped. But the mountains' secret, hidden long, is 'God's peace is everlasting.' He made them haunts of beauty, homes of grace. He spreads mornings on them, sunsets light their faces. They are nurseries for young rivers, nests for flying clouds, homes for newborn races. Tired city people come to their shrines to pray; God freshens them again as He passes by. I have caught their secret—the deepest beauty. This faith: life's hard moments, when jarring sorrows befall, are but God plowing His mountains. Those mountains will yet be the source of His grace, freshness, and everlasting peace to me.",
              "simpZh": "神用地震犁地，犁出深深的沟。平原隆起来，群山在跳跃。但那就是群山的秘密，久藏胸中：‘神的平安是永远的。’祂造它们成为美的居所，恩典的家。祂铺展清晨在其上，晚霞照它们的脸。它们是幼河的保育园，飞云的巢窝，新生种族的家园。疲惫城市里的人上到它们的圣所祷告；神整天经过，使他们重新得力。看哪，我得着它们的秘密了——那最深的美丽。这信心：人生艰难的时刻，不和谐的忧伤来到时，不过是神在犁祂的山。那些山终必成为祂恩典和新力的源头，并祂给我的永远平安。"
            }

          "sectionId": 7,
          "heading": "May 5",
          "audio": "audio/Streams in the Desert - May 5.m4a",
          "paragraphs": [
            {
              "en": "As they began to sing and praise, the Lord set <span class=\"vocab-trigger\" data-vocab=\"ambushes\">ambushes<\/span> against the men . . . who were invading Judah, and they were defeated. (2 Chronicles 20:22)",
              "zh": "众人方唱歌赞美的时候，耶和华就派伏兵击杀那……来攻击犹大人……他们就被打败了。（历代志下20:22）",
              "simpEn": "As they began to sing and praise, the Lord set ambushes against the men invading Judah, and they were defeated.",

            {
              "en": "Oh, if only we would worry less about our problems and sing and praise more! There are thousands of things that <span class=\"vocab-trigger\" data-vocab=\"shackle\">shackle<\/span> us that could be turned into instruments of music, if we just knew how to do it. Think of those people who ponder, meditate, and weigh the affairs of life, and who continually study the mysterious inner workings of God's <span class=\"vocab-trigger\" data-vocab=\"providence\">providence<\/span>, wondering why they suffer burdens and are opposed and battled on every front. How different their lives would be, and how much more joyful, if they would stop <span class=\"vocab-trigger\" data-vocab=\"indulging\">indulging<\/span> in self-centered and inward thinking and instead would daily lift their experiences to God, praising Him for them.",
              "zh": "哦，只要我们少为问题忧虑，多唱歌赞美就好了！有成千上万件捆绑我们的事物，只要我们知道怎样去做，都可以变成音乐的器皿。想想那些不断沉思、默想、掂量人生诸事的人，他们不断研究神眷顾那奥秘的内在运行，稀奇他们为何背负重担，在各面受敌受攻。如果他们停止沉浸于自我中心和内向的思虑，而是天天将他们的经历呈到神面前，为这些经历赞美祂，他们的生活会何等不同，又会有多大的喜乐！",
              "simpEn": "Oh, if only we worried less and sang and praised more! Thousands of things that shackle us could become instruments of music, if we knew how. Think of people who ponder and study God's providence, wondering why they suffer. How different and joyful their lives would be if they stopped indulging in inward thinking and daily lifted their experiences to God in praise!",
              "simpZh": "哦，只要我们少为问题忧虑，多唱歌赞美就好了！有成千上万捆住我们的事，只要我们懂得方法，都可以变成乐器。想想那些不断思考、研究神眷顾的人，奇怪自己为什么受苦。如果他们不再沉浸于自我中心的思想，而是每天把经历带到神面前赞美祂，他们的生活会多么不同，多么喜乐！"
            },
            {
              "en": "It is easier to sing your worries away than to reason them away. Why not sing in the morning? Think of the birds—they are the first to sing each day, and they have fewer worries than anything else in creation. And don't forget to sing in the evening, which is what the robins do when they have finished their daily work. Once they have flown their last flight of the day and gathered the last bit of food, they find a treetop from which to sing a song of praise. Oh, that we might sing morning and evening, offering up song after song of <span class=\"vocab-trigger\" data-vocab=\"continual praise\">continual praise<\/span> throughout our day! —selected",
              "zh": "把忧虑唱走比把它们想通更容易。何不在清晨歌唱呢？想想飞鸟吧——它们是每天最早歌唱的，而且它们比一切受造之物忧虑更少。也不要忘了在傍晚歌唱，那是知更鸟结束一天工作之后所做的。它们飞完一天最后一程，采集了最后一点食物，就找到一棵树梢，从那里唱出赞美之歌。哦，愿我们从早到晚都歌唱，献上一首又一首不住的赞美！——选",
              "simpEn": "It's easier to sing your worries away than to reason them away. Sing in the morning like the birds—they sing first and have the fewest worries. Sing in the evening like the robins when their day's work is done. They find a treetop and sing a song of praise. Oh, that we might sing morning and evening, offering continual praise all day!",
              "simpZh": "把忧虑唱走比想通更容易。早晨唱歌吧，像鸟儿一样——它们最早唱，忧虑最少。晚上也唱歌吧，像知更鸟工作完了就唱。它们飞完一天，找一棵树顶唱赞美歌。哦，但愿我们早晚都唱，整天献上不住的赞美！"
            },
            {
              "en": "Don't let the song go out of your life <br>Although it sometimes will flow <br>In a <span class=\"vocab-trigger\" data-vocab=\"minor strain\">minor strain<\/span>; it will blend again <br>With the major tone you know. <br>Although shadows rise to obscure life's skies, <br>And hide for a time the sun, <br>The sooner they'll lift and reveal the <span class=\"vocab-trigger\" data-vocab=\"rift\">rift<\/span>, <br>If you let the melody run. <br>Don't let the song go out of your life; <br>Though the voice may have lost its trill, <br>Though the <span class=\"vocab-trigger\" data-vocab=\"quivering note\">quivering note<\/span> may die in your throat, <br>Let it sing in your spirit still. <br>Don't let the song go out of your life; <br>Let it ring in your soul while here; <br>And when you go hence, it will follow you thence, <br>And live on in another sphere.",
              "zh": "不要让歌声离开你的生命，虽然有时它会以小调流淌；它必再与大调交融。虽然暗影升起遮蔽生命的天空，片时掩藏了太阳，你若让旋律持续奔流，它们就必更快消褪，露出缝隙。不要让歌声离开你的生命；虽然声音失去了颤音，虽然发颤的音符消逝于喉间，仍要让它在心灵中歌唱。不要让歌声离开你的生命；让它在此地你的灵魂中鸣响；等你离开此地时，它也要随你而去，活在另一个境界。",
              "simpEn": "Don't let the song go out of your life. Though sometimes in a minor strain, it will blend again with the major tone you know. Though shadows rise to hide the sun, they'll lift sooner if you let the melody run. Don't let the song go out of your life; though your voice loses its trill and the quivering note dies in your throat, let it sing in your spirit still. Don't let the song go out of your life; let it ring in your soul while here. And when you go, it will follow and live on in another sphere.",
              "simpZh": "不要让歌声离开你的生命。虽然有时会转为小调，但它必再与你熟悉的大调交融。虽然暗影升起遮住太阳，你若让旋律继续，它们就更快散去。不要让歌声离开你的生命；虽然声音失去了颤音，发颤的音符在喉咙里消失，仍要让你里面歌唱。不要让歌声离开你的生命；让它在这里你的灵魂中响起；等你离开时，它也要跟去，活在另一个境界里。"

              "zh": "要记得，钻石是在粗糙的矿石中找到的，它们的真正价值无法看见。当会幕在旷野建造时，外表毫无华丽可言。事实上，外面那层厚海狗皮的罩盖，丝毫不显露出内里贵重之物。",
              "simpEn": "Remember, diamonds are found in rough stone, and their real value can't be seen. When the tabernacle was built in the desert, its outside wasn't fancy. The thick animal-skin covering gave no clue of the valuable things inside.",
              "simpZh": "要记住，钻石是在粗糙的石头里找到的，真正的价值看不出来。旷野里建的会幕，外面一点也不华丽，厚海狗皮盖着，完全看不出里面有珍贵的东西。"

              "zh": "亲爱的朋友，神可能会把一些珍贵的礼物用不吸引人的包装纸包好寄给你。但不要为包装忧虑，因为你可以确信，在里面祂藏着慈爱、良善和智慧的珍宝。我们只要接受祂所赐的，并信靠祂里面必有祝福，那么即使是在黑暗中，我们也会学到祂护理之奥秘的意义。——宣信",
              "simpEn": "Dear friend, God may send you valuable gifts wrapped in ugly paper. Don't worry about the wrapping; be sure that inside He has hidden treasures of love, kindness, and wisdom. If we simply accept what He sends and trust Him for the blessings inside, we will learn the meaning of the secrets of His care, even in dark times.",

              "simpZh": "只有当每架织布机都停了，线不再飞的时候，神才会把图案展开，告诉我们为什么在织匠巧手里，那些深色的线和金线、银线一样，都是祂图案里必需的。"

        {
          "sectionId": 2,

          "audio": "audio/Streams in the Desert - May 7.m4a",
          "paragraphs": [
            {
              "en": "Jesus told his disciples a parable to show them that they should always pray and not give up. (Luke 18:1)",
              "zh": "耶稣设一个比喻，是要人常常祷告，不可灰心。（路加福音18:1）",
              "simpEn": "Jesus told His disciples a story to teach them that they should always pray and never lose heart.",
              "simpZh": "耶稣讲了一个比喻，教导他们要一直祷告，不要灰心。"
            },
            {
              "en": "The failure to <span class=\"vocab-trigger\" data-vocab=\"persevere\">persevere<\/span> is the most common problem in prayer and <span class=\"vocab-trigger\" data-vocab=\"intercession\">intercession<\/span>. We begin to pray for something, raising our <span class=\"vocab-trigger\" data-vocab=\"petitions\">petitions<\/span> for a day, a week, or even a month, but then if we have not received a definite answer, we quickly give up and stop praying for it altogether.",
              "zh": "不能坚持，是祷告和代祷中最常见的问题。我们开始为某事祷告，祈求了一天、一周、甚至一个月，然后如果还没有得到明确的答复，我们就迅速放弃，完全停止为它祷告。",
              "simpEn": "Failure to keep going is the most common problem in prayer. We start praying for something, asking for a day, a week, or even a month, but if we don't get a clear answer, we quickly give up and stop praying altogether.",
              "simpZh": "不能坚持是祷告里最常见的问题。我们开始为某件事祷告，求了一天、一周甚至一个月，但如果还没有得到清楚的回答，就很快放弃，完全不再祷告了。"
            },
            {
              "en": "This is a mistake with deadly consequences and is simply a trap where we begin many things but never see them completed. It leads to ruin in every area of life. People who get into the habit of starting without ever finishing form the habit of failure. And those who begin praying about something without ever praying it through to a successful conclusion form the same habit in prayer. Giving up is admitting failure and defeat. Defeat then leads to discouragement and doubt in the power of prayer, and that is <span class=\"vocab-trigger\" data-vocab=\"fatal\">fatal<\/span> to the success of a person's prayer life.",
              "zh": "这是一个有致命后果的错误，仅仅是一个陷阱，使我们开始许多事却从不完成。它在生活的每个领域都导致败坏。养成开始却从不完成习惯的人，形成的是失败的习惯。而那些开始为某事祷告，却从未祷告到成功结局的人，在祷告上也形成同样的习惯。放弃就是承认失败和打败。而失败又导致对祷告能力的灰心和疑惑，这对一个人祷告生活的成功是致命的。",
              "simpEn": "This is a serious mistake with deadly consequences. It's a trap where we start many things but never finish them. It leads to ruin. People who start without finishing form the habit of failure. Those who begin praying without praying through to success form the same habit in prayer. Giving up is admitting defeat, and defeat leads to discouragement and doubt in prayer's power, which is fatal to a successful prayer life.",
              "simpZh": "这是一个有致命后果的严重错误，只是一个陷阱：我们开始很多事，却从没有完成。这会在各方面带来败坏。习惯开始却不完成的人，养成的是失败的习惯。开始祷告却没祷告到成功的人，在祷告上也养成了失败的习惯。放弃就是承认失败，失败会导致灰心和怀疑祷告的能力，这会毁掉祷告的生活。"
            },
            {
              "en": "People often ask, \"How long should I pray? Shouldn't I come to the place where I stop praying and leave the matter in God's hands?\" The only answer is this: Pray until what you pray for has been accomplished or until you have complete <span class=\"vocab-trigger\" data-vocab=\"assurance\">assurance<\/span> in your heart that it will be. Only when one of these two conditions has been met is it safe to stop <span class=\"vocab-trigger\" data-vocab=\"persisting\">persisting<\/span> in prayer, for prayer not only is calling upon God but is also a battle with Satan. And because God uses our intercession as a mighty weapon of victory in the conflict, He alone must decide when it is safe to cease from petitioning. Therefore we dare not stop praying until either the answer itself has come or we receive assurance it will come.",
              "zh": "人们常问：「我应当祷告多久？难道不该到达一个地步，就停止祷告，把事情交在神手中吗？」唯一的答案是：祷告直到你所求的已经成就，或直到你心中有了完全的把握它会成就。只有这两样条件之一满足时，才可以安全地停止坚持祷告，因为祷告不仅是呼求神，也是与撒但的争战。并且因为神以我们的代祷作为争战中得胜的大能武器，唯有祂才能决定什么时候停止祈求是安全的。所以，我们非等到答复本身临到，或得到答复必临到的把握，就绝不敢停止祷告。",
              "simpEn": "People often ask, 'How long should I pray? Shouldn't I stop and leave the matter with God?' The only answer: Pray until what you asked for is done, or until you have complete certainty in your heart that it will be. Only then is it safe to stop continuing in prayer, because prayer is not only calling on God but also battling Satan. God uses our prayers as a mighty weapon, so only He knows when it's safe to stop. So we must not stop until the answer comes or we have assurance it will.",
              "simpZh": "人常问：'要祷告多久？是不是该到一个地步就不祷告了，把事情交给神？' 唯一的答案是：祷告到你求的事成就了，或者你心里有完全的把握它会成就。只有这两个条件之一满足时，才可以安全地停下持续的祷告，因为祷告不单是呼求神，也是与撒但争战。神用我们的代祷作得胜的武器，所以只有祂知道什么时候停下来是安全的。所以，除非答复来了，或者我们有了它会来的把握，否则我们不敢停止祷告。"
            },
            {
              "en": "In the first instance, we stop because we actually see the answer. In the second, we stop because we believe, and faith in our hearts is as trustworthy as the sight of our eyes, for it is “faith from God” (Eph. 6:23) and the “faith of God” (Rom. 3:3 KJV) that we have within us. As we live a life of prayer, we will more and more come to experience and recognize this God-given assurance. We will know when to quietly rest in it or when to continue praying until we receive His answer. —from The Practice of Prayer <br>Wait at God’s promise until He meets you there, for He always returns by the path of His promises. —selected",
              "zh": "在第一种情况下，我们停止是因为实际看见了答复。在第二种情况下，我们停止是因为相信，而我们心中的信心，如同肉眼所见一样可靠，因为它是「从神来的信心」（弗6:23）和「神的信心」（罗3:3 钦定本）在我们里面。当我们过祷告的生活时，就会越来越多地经历并认出这种神所赐的把握。我们将知道何时应当安静地安息在其中，或者何时应当继续祷告直到得着祂的答复。——摘自《祷告的操练》。要在神的应许那里等候，直到祂在那里迎接你，因为祂总是沿祂应许的路径回来。——选",
              "simpEn": "In the first case, we stop because we see the answer. In the second, we stop because we believe, and faith in our hearts is as reliable as sight, for it is 'faith from God' and the 'faith of God' within us. As we live a life of prayer, we will more and more experience and recognize this God-given assurance. We will know when to rest in it or when to keep praying until His answer comes. Wait at God's promise until He meets you there, for He always returns by the path of His promises.",
              "simpZh": "在第一种情况，我们停下来是因为看见了答复。在第二种，停下来是因为相信，而我们心里的信心跟眼睛看见一样可靠，因为那是从神来的信心，是神的信心在我们里面。当我们过着祷告的生活，就会越来越多地经历并认出这种神给的把握。我们会知道什么时候该安静安息在其中，什么时候该继续祷告直到得着答复。要在神的应许那里等候，直到祂在那里遇见你，因为祂总是沿着祂应许的路回来。"
            }
          ],

          "sectionId": 3,

            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Walking around in the fire\">Walking around in the fire<\/span>. (Daniel 3:25)",
              "zh": "在火中行走。（但以理书3:25）",
              "simpEn": "Walking around in the fire.",
              "simpZh": "在火中走来走去。"
            },
            {
              "en": "When Shadrach, Meshach, and Abednego were thrown into the furnace, the fire did not stop them from moving, for they were seen “walking around.” Actually, the fire was one of the streets they traveled to their destination. The comfort we have from Christ’s revealed truth is not that it teaches us freedom from sorrow but that it teaches us freedom through sorrow.",
              "zh": "当沙得拉、米煞、亚伯尼歌被扔进火窑时，火并没有阻止他们移动，因为他们被看见「在火中行走」。实际上，那火是他们通往目的地所行过的街道之一。我们从基督所启示的真理中所得的安慰，并不是它教我们免于忧伤，而是教我们通过忧伤得以自由。",
              "simpEn": "When Shadrach, Meshach, and Abednego were thrown into the furnace, the fire didn't stop them from moving—they were seen walking around. Actually, the fire was one of the streets they traveled to reach their destination. The comfort we have from Christ's truth is not that it teaches us freedom from sorrow, but freedom through sorrow.",
              "simpZh": "沙得拉、米煞、亚伯尼歌被丢进火窑里，火没有拦阻他们走动——他们还在火中走来走去。其实那火是他们去目的地走的路之一。我们从基督的真理得到的安慰，不是教我们免除忧伤，而是教我们经过忧伤得以自由。"
            },
            {
              "en": "O dear God, when darkness overshadows me, teach me that I am merely traveling through a tunnel. It will then be enough for me to know that someday it will be all right. I have been told that someday I will stand at the top of the Mount of Olives and experience the height of resurrection glory. But heavenly Father, I want more—I want <span class=\"vocab-trigger\" data-vocab=\"Calvary\">Calvary<\/span> to lead up to it. I want to know that the shadows of darkness are the shade on a road—the road leading to Your heavenly house. Teach me that the reason I must climb the hill is because Your house is there! Knowing this, I will not be hurt by sorrow, if I will only walk in the fire. —George Matheson",
              "zh": "哦，亲爱的神，当黑暗遮蔽我时，求祢教导我，我只不过是正在穿过隧道。那时我知道总有一天一切都会好的就足够了。有人告诉我，有一天我要站在橄榄山顶，经历复活荣耀的高峰。但是天父，我要更多——我要各各他引到那里。我要知道黑暗的阴影是路上的树荫——那条通向祢天家之路上。教导我，我必须爬山的原因，是因祢的家在那里！知道了这点，只要我肯在火中行走，就不会被忧伤所伤。——乔治·马西森",
              "simpEn": "O dear God, when darkness covers me, teach me that I am only traveling through a tunnel. It will be enough to know that someday it will be all right. I've been told that someday I will stand on the top of the Mount of Olives and experience resurrection glory. But Father, I want more—I want Calvary to lead up to it. I want to know that the shadows of darkness are the shade on a road—the road to Your heavenly house. Teach me that the reason I must climb the hill is because Your house is there! Knowing this, I won't be hurt by sorrow, if I will only walk in the fire.",
              "simpZh": "神啊，当黑暗遮盖我时，求祢教我知道我只是在穿过一条隧道。那时只要知道有一天一切都会好就够了。有人告诉我，有一天我要站在橄榄山顶，经历复活荣耀的高峰。但天父啊，我要更多——我要各各他引到那里。我要知道黑暗的影子是路上的树荫——是通往祢天上家的路。教我知道我必须爬山的原因，是因祢的家在那里！知道了这一点，只要我肯在火中行走，就不会被忧伤伤害。"
            },
            {
              "en": "\"The road is too rough,\" I said; <br>\"It is uphill all the way; <br>No flowers, but thorns instead; <br>And the skies overhead are gray.\" <br>But One took my hand at the entrance dim, <br>And sweet is the road that I walk with Him. <br>\"The cross is too great,\" I cried— <br>\"More than the back can bear, <br>So rough and heavy and wide, <br>And nobody near to care.\" <br>And One stooped softly and touched my hand: <br>\"I know. I care. And I understand.\" <br>Then why do we <span class=\"vocab-trigger\" data-vocab=\"fret and cry\">fret and cry<\/span>; <br>Cross-bearers all we go: <br>But the road ends by and by <br>In the dearest place we know, <br>And every step in the journey we <br>May take in the Lord's own company.",
              "zh": "「这路太崎岖了，」我说；「一路上都在爬坡；没有花，只有荆棘；头顶上的天空是灰暗的。」但有位在那幽暗的入口牵着我的手，与祂同行之路何等甘甜。「十字架太重了，」我喊着说——「过于背所能负，又粗糙又沉重又宽大，身边没有人在意。」有一位轻柔地弯腰摸我的手：「我知道。我在意。我理解。」那我们何须焦躁哭泣；我们虽都背十架而行：但此路终究会结束，在我们所知最亲爱的地方，而旅程的每一步我们都可，在与主同行中走过。",
              "simpEn": "'The road is too rough,' I said; 'It's uphill all the way; no flowers, but thorns instead; and the skies overhead are gray.' But One took my hand at the dim entrance, and sweet is the road that I walk with Him. 'The cross is too great,' I cried—'More than my back can bear, so rough and heavy and wide, and nobody near to care.' And One stooped softly and touched my hand: 'I know. I care. And I understand.' Then why do we worry and cry; cross-bearers all we go: But the road ends by and by in the dearest place we know, and every step in the journey we may take in the Lord's own company.",
              "simpZh": "我说：'这路太崎岖了，全是上坡；没有花，只有刺；头顶上的天灰蒙蒙的。' 但有一个人在幽暗的入口牵着我的手，与祂一起走的路很甜美。我喊：'十字架太重了——背受不了，又粗又重又宽，身边没人在意。' 有一个人轻轻弯腰摸我的手：'我知道，我在意，我理解。' 那我们为什么还烦躁哭泣；我们都背着十字架走：但路终究会走完，在我们所知道的最亲爱的地方，而且路上的每一步都可以有主陪伴。"

            {
              "en": "Abraham <span class=\"vocab-trigger\" data-vocab=\"remained standing\">remained standing<\/span> before the Lord. (Genesis 18:22)",

            {
              "en": "In this chapter, Abraham <span class=\"vocab-trigger\" data-vocab=\"pleaded\">pleaded<\/span> with God for the lives of others. A friend of God's can do exactly that. But perhaps you see Abraham's level of faith and his friendship with God as something far beyond your own possibilities. Do not be discouraged, however, for Abraham grew in his faith not by giant leaps but step by step. And we can do the same.",
              "zh": "在这一章里，亚伯拉罕为别人的生命向神恳求。神的朋友正是能如此行。但或许你认为亚伯拉罕信心的程度和他与神的友谊，是你自己远远达不到的。然而不要灰心，因为亚伯拉罕的信心不是借着巨大的飞跃，而是一步一步增长的。我们也能如此。",
              "simpEn": "In this chapter, Abraham pleaded with God for the lives of others. A friend of God can do exactly that. Perhaps you see Abraham's faith and friendship with God as far beyond you. Don't be discouraged: Abraham grew in faith not by huge leaps but step by step. And we can do the same.",
              "simpZh": "在这一章，亚伯拉罕为别人的生命向神恳求。神的朋友就是能这样做。也许你觉得亚伯拉罕的信心和与神的友谊离你太远。但不要灰心，亚伯拉罕的信心不是一下子跳上去的，而是一步一步增长的。我们也能这样。"
            },
            {
              "en": "The person whose faith has been severely tested yet who has come through the battle victoriously is the person to whom even greater tests will come. The finest jewels are those that are the most carefully cut and polished, and the most precious metals are put through the hottest fires. You can be sure Abraham would never have been called the Father of Faith had he not been tested to the <span class=\"vocab-trigger\" data-vocab=\"utmost\">utmost<\/span>.",
              "zh": "信心被严酷试验却经过争战得胜而出的人，正是那将要面对更大试炼的人。最精美的珠宝是那些切割和打磨得最细致的，最贵重的金属是经过最烈火焰的。你可以肯定，亚伯拉罕若没有被试验到极致，就永不会被称为信心之父。",
              "simpEn": "The person whose faith has been severely tested and has come through the battle victoriously is the one to whom even greater tests will come. The finest jewels are cut and polished most carefully, and the most precious metals go through the hottest fires. Abraham would never have been called the Father of Faith if he hadn't been tested to the utmost.",
              "simpZh": "信心受过严峻考验并得胜的人，将来还会遇到更大的考验。最美的宝石是切割打磨得最仔细的，最贵的金属是经过最烈火的。亚伯拉罕如果没有被考验到极限，就绝不会被称为信心之父。"
            },
            {
              "en": "Read Genesis 22. In verse 2 God said to Abraham, \"Take your son, your only son, Isaac, whom you love, and . . . <span class=\"vocab-trigger\" data-vocab=\"sacrifice\">sacrifice<\/span> him.\" We then see him climbing Mount Moriah with his heart heavy and yearning yet humbly obedient. He climbed with Isaac, the object of his great love, who was about to be sacrificed at the command of God—the One whom Abraham faithfully loved and served!",
              "zh": "请读创世记22章。在第二节神对亚伯拉罕说：「你带着你的儿子，就是你独生的儿子，你所爱的以撒……把他献为燔祭。」然后我们看见他登上摩利亚山，心中沉重、依恋不舍，却谦卑顺服。他带着以撒——他大爱的对象，那即将按他所忠爱并事奉之神的命令被献上的以撒——一同攀登！",
              "simpEn": "Read Genesis 22. God said to Abraham, 'Take your son, your only son, Isaac, whom you love, and sacrifice him.' Then we see him climbing Mount Moriah, his heart heavy and longing yet humbly obedient. He climbed with Isaac, the object of his great love, who was about to be sacrificed at the command of God—the One Abraham faithfully loved and served!",
              "simpZh": "读创世记22章。神对亚伯拉罕说：'带着你的儿子，你独生的儿子，你所爱的以撒，去把他献为祭。' 然后我们看见他登上摩利亚山，心又沉重又舍不得，却谦卑顺服。他带着以撒——他所爱的儿子，就要照他所忠爱、事奉之神的命令被献上——一起登上去！"
            },
            {
              "en": "What a lesson this should be to us when we question God's dealings in our lives! <span class=\"vocab-trigger\" data-vocab=\"Rebuke\">Rebuke<\/span> all explanations that try to cast doubt on this <span class=\"vocab-trigger\" data-vocab=\"staggering\">staggering<\/span> scene, for this was an object lesson for all ages! Angels also looked on in <span class=\"vocab-trigger\" data-vocab=\"awe\">awe<\/span>. Will Abraham's faith not stand forever as a strength and a help to all God's people? Will his trial not be a witness to the fact that unwavering faith will always prove the faithfulness of God?",
              "zh": "当我们质疑神在生命中的作为时，这该是何等的一课！要驳斥一切试图向这撼人一幕投以疑惑的解释，因为这是给所有时代的一个实物教训！天使也敬畏地观望。亚伯拉罕的信心，岂不永远站立，作所有神子民的力量和帮助吗？他的试炼岂不要见证那事实：不动摇的信心终必证实神的信实？",
              "simpEn": "What a lesson when we question God's dealings! Reject all explanations that try to cast doubt on this staggering scene—it was an object lesson for all ages! Angels looked on in awe. Will not Abraham's faith stand forever as a strength and help to all God's people? Will his trial not witness that unwavering faith will always prove the faithfulness of God?",
              "simpZh": "当我们质疑神在我们生命中的作为时，这真是一大功课！要拒绝一切想对这令人震撼的场景投以疑惑的解释，因为这是给所有时代的一个实物课程！天使也敬畏观看。亚伯拉罕的信心难道不永远站立，成为所有神子民的力量和帮助吗？他的试炼岂不是见证了不动摇的信心总要证明神的信实吗？"
            },
            {
              "en": "The answer is a resounding—yes! And once Abraham's faith had victoriously endured its greatest test, the Angel of the Lord—the Lord Jesus, Jehovah, and He in whom the \"many promises God has made . . . are 'Yes' . . . [and] 'Amen'\" (2 Cor. 1:20)—spoke to him and said, \"Now I know that you fear God\" (Gen. 22:12). The Lord said to him, in effect, \"Because you have trusted me through this great trial, I will trust you, and you will forever be 'my friend' [Isa. 41:8].\" The Lord promised Abraham, \"I will surely bless you . . . and through your offspring all nations on earth will be blessed, because you have obeyed me\" (Gen. 22:17–18). It is true, and always will be, that \"those who have faith are blessed along with Abraham, the man of faith\" (Gal. 3:9). —selected <br>Having a friendship with God is no small thing.",
              "zh": "答案是响亮的——是的！并且当亚伯拉罕的信心得胜地忍受了它最大的考验之后，耶和华的使者——就是主耶稣，耶和华，那位在祂里面「神的应许……都是『是』的……『阿们』的」（林后1:20）——对他说话，说：「现在我知道你是敬畏神的了」（创22:12）。主实际上是告诉他：「因为你在这大试炼中信靠了我，我也要信任你，你将要永远作『我的朋友』（赛41:8）。」主应许亚伯拉罕：「论福，我必赐大福给你……并且地上万国都必因你的后裔得福，因为你听从了我的话」（创22:17-18）。这是真实的，且永远是真实的，就是「那以信为本的人，和有信心的亚伯拉罕一同得福」（加3:9）。——选。与神有友谊，这绝非小事。",
              "simpEn": "The answer is a resounding—yes! And once Abraham's faith had endured its greatest test victoriously, the Angel of the Lord—the Lord Jesus, in whom all God's promises are 'Yes' and 'Amen'—spoke to him: 'Now I know that you fear God.' The Lord in effect said, 'Because you trusted Me through this great trial, I will trust you, and you will forever be My friend.' The Lord promised, 'I will surely bless you ... and through your offspring all nations on earth will be blessed, because you have obeyed Me.' It is true, and always will be, that those who have faith are blessed along with Abraham, the man of faith. Having a friendship with God is no small thing.",

              "zh": "逆风袭击我的生命；我的小船在忧伤中颠簸；我的计划全毁了——心中满了斗争，一切盼望似乎都失丧了——「于是祂起来了」——一句平安的话。「就大大平静了」——一个甜美的释放。一阵巨大的疑惑与恐惧风暴抓住我的心；没有光引导，或使我的视野清晰。黑夜啊！超过我所能受——「于是祂起来了，」我看见了祂的面——「就大大平静了，」充满了祂的恩典。我的心在深化的试炼和狂怒的忧伤之浪下下沉；一切似乎都失丧了，无人能救，无一物能带给我释脱——「于是祂起来了」——说了一句话，「就大大平静了！」「是主。」——L. S. P.",

            {
              "en": "The \"everything\" mentioned here does not always come simply by asking, because God is always seeking to teach you the way of faith. Your training for a life of faith requires many areas of learning, including the trial of faith, the <span class=\"vocab-trigger\" data-vocab=\"discipline of faith\">discipline of faith<\/span>, the patience of faith, and the courage of faith. Often you will pass through many stages before you finally realize the result of faith—namely, the victory of faith.",
              "zh": "这里所说的「凡事」，并不总是仅仅借着祈求就临到，因为神总是在寻求教导你信心之路。你为信心生活所受的训练需要许多方面的学习，包括信心的试验、信心的管教、信心的忍耐和信心的勇气。往往你要经过许多阶段，才能最终实现信心的结果——就是信心的得胜。",
              "simpEn": "The 'everything' mentioned here doesn't always come simply by asking, because God is always teaching you the way of faith. Your training for a life of faith requires many lessons: the trial of faith, the discipline of faith, the patience of faith, and the courage of faith. Often you will go through many stages before you finally reach the result of faith—the victory of faith.",
              "simpZh": "这里说的'一切'不总是单靠祈求就来，因为神一直在教我们信心的路。你为信心生活所受的训练需要学很多功课：信心的试验、信心的管教、信心的忍耐和信心的勇气。往往你要经过很多阶段，才能最终达到信心的结果——就是信心的得胜。"
            },
            {
              "en": "Genuine moral <span class=\"vocab-trigger\" data-vocab=\"fiber\">fiber<\/span> is developed by enduring the discipline of faith. When you have made your request to God, and the answer still has not come, what are you to do? Keep on believing His Word! Never be <span class=\"vocab-trigger\" data-vocab=\"swayed\">swayed<\/span> from it by what you may see or feel. Then as you stand firm, your power and experience is being developed, strengthened, and deepened. When you remain <span class=\"vocab-trigger\" data-vocab=\"unswayed\">unswayed<\/span> from your stance of faith, even in view of supposed contradictions to God's Word, you grow stronger on every front.",
              "zh": "真正的道德品质是借着忍受信心的管教而培养出来的。当你向神祈求之后，答复仍未临到，你当怎样行？要持续相信祂的话！绝不要因你所见或所感的而动摇离弃它。然后当你站稳时，你的能力和经历就被发展、坚固和加深。当你在面对似乎与神的话相矛盾的情况时，仍然保持信心不动摇，你就在各方面变得更刚强。",
              "simpEn": "Real character is developed by enduring the discipline of faith. When you have asked God and the answer still hasn't come, what should you do? Keep believing His Word! Never let what you see or feel shake you from it. As you stand firm, your power and experience is being developed, strengthened, and deepened. When you stay unshaken in your faith, even when things seem to contradict God's Word, you grow stronger in every way.",
              "simpZh": "真正的品格是借着忍受信心的管教养成的。你向神求了，答复还没来，你该怎么办？继续相信祂的话！绝不要因为所看见或感觉的而动摇。当你站稳时，你的能力和经历就在被发展、坚固和加深。当你面对好像与神的话矛盾的情况，仍然不动摇，你就在各方面都变得更刚强。"
            },
            {
              "en": "God will often purposely delay in giving you His answer, and in fact the delay is just as much an answer to your prayer as is the fulfillment when it comes. He worked this way in the lives of all the great Bible characters. Abraham, Moses, and Elijah were not great in the beginning but made great through the discipline of their faith. Only through that discipline were they then equipped for the work to which God had called them.",
              "zh": "神常常故意延迟赐下答复，事实上，迟延本身就是对你祷告的答复，正如成就临到时一样。祂在所有伟大的圣经人物生命中都是如此行事。亚伯拉罕、摩西、以利亚起初并非伟大，而是借着信心的管教被塑造为伟大。唯有借着那管教，他们才被装备，去作神呼召他们所作的工。",
              "simpEn": "God often deliberately delays His answer. In fact, the delay is as much an answer to your prayer as the fulfillment when it comes. He worked this way in all the great Bible characters. Abraham, Moses, and Elijah were not great at the beginning but were made great through the discipline of their faith. Only through that discipline were they equipped for the work God called them to.",
              "simpZh": "神常常故意延迟赐下回答，事实上，迟延本身就是对你祷告的回应，就像事情成就时一样。祂在所有伟大的圣经人物生命中都是这样做的。亚伯拉罕、摩西、以利亚起初并不是伟人，而是借着信心的管教被塑造为伟人。只有借着那样的管教，他们才被装备好，去做神呼召他们做的工。"
            },
            {
              "en": "Think, for example, of Joseph, whom the Lord was training for the throne of Egypt. Psalm 105:19 (KJV) says, \"The word of the Lord tried him.\" It was not the prison life with its hard beds or poor food that \"tried him\" but \"the word of the Lord.\" The words God spoke into his heart in his early years, concerning his elevated place of honor above his brothers, were the words that were always before him. He remained alone in prison, in spite of his innocence, and watched others being released who were <span class=\"vocab-trigger\" data-vocab=\"justly incarcerated\">justly incarcerated<\/span>. Yet he remembered God's words even when every step of his career made fulfillment seem more and more impossible.",
              "zh": "比如，想想约瑟，主正在训练他登上埃及的宝座。诗篇105:19（钦定本）说：「耶和华的话试炼他。」不是牢狱生活的硬床或粗食「试炼他」，而是「耶和华的话」。那些神在他早年时对他说在他心里、有关他高于众弟兄的尊荣地位的话，是一直摆在他面前的话。他虽清白无辜，却独自留在狱中，看着那些被公正囚禁的人得到释放。然而，即使他生涯的每一步都使应许的实现显得愈发不可能，他仍记得神的话。",
              "simpEn": "Think of Joseph, whom the Lord was training for Egypt's throne. Psalm 105:19 (KJV) says, 'The word of the Lord tried him.' It wasn't the prison's hard bed or poor food that tried him but 'the word of the Lord.' The words God spoke into his heart in his early years, about his high place of honor above his brothers, were always before him. He stayed alone in prison, though innocent, and watched others rightly jailed be released. Yet he remembered God's words even when every step made fulfillment seem more and more impossible.",
              "simpZh": "想想约瑟，主正在训练他登上埃及的宝座。诗篇105:19说：'耶和华的话试炼他。' 不是监狱的硬床或粗食试炼他，而是'耶和华的话'。神在他早年对他心里说的那些话，关于他高过兄弟的尊荣地位，一直摆在他面前。他虽清白，却独自留在狱中，看着那些罪有应得的人被释放。然而，就算他生涯的每一步都让应许的实现显得越来越不可能，他仍记得神的话。"
            },
            {
              "en": "These were the times that tried his soul, but they were also the times of his spiritual growth and development. Then when word of his release from prison finally came, he was found ready and equipped for the delicate task of dealing with his <span class=\"vocab-trigger\" data-vocab=\"wayward\">wayward<\/span> brothers. And he was able to do so with a love and a patience only surpassed by God Himself. No amount of persecution will try you as much as experiences like these—ones in which you are required to wait on God. Once He has spoken His promise to work, it is truly hard to wait as you see the days go by with no fulfillment. Yet it is this discipline of faith that will bring you into a knowledge of God that would otherwise be impossible.",
              "zh": "这些就是试炼他灵魂的时刻，但也正是他属灵成长和发展的时刻。当出狱的命令终于临到时，他已预备好、装备好，去处理与他那些任性弟兄之间的微妙任务。并且他能以只有神自己超过的爱和忍耐去完成。没有什么逼迫能像这些经历一样试炼你——那些要求你等候神的经历。一旦祂说了应许要作工，看着日子一天天过去却没有成就，那真是难熬。然而，正是这种信心的管教，将带你进入对神的认识，是别的方法不可能的。",
              "simpEn": "These were the times that tried his soul, but they were also the times of his spiritual growth and development. Then when word of his release finally came, he was ready and equipped for the delicate task of dealing with his wayward brothers. And he did so with a love and patience only surpassed by God Himself. No persecution will try you as much as these experiences—ones where you must wait on God. Once He has spoken His promise to work, it is truly hard to wait as days go by with no fulfillment. Yet it is this discipline of faith that will bring you into a knowledge of God that would otherwise be impossible.",
              "simpZh": "这些是试炼他灵魂的时刻，但也是他属灵成长和发展的时刻。当出狱的命令终于临到时，他已经预备好、装备好，去处理与他那些任性兄弟之间的微妙任务。并且他做到了，带着只有神自己超过的爱和忍耐。没有任何逼迫能像这些经历一样试炼你——那些要求你等候神的经历。一旦祂说了应许要作工，看着日子一天天过去却没有成就，真的很煎熬。然而，正是这种信心的管教，要带你进入对神的认识，是别的方法不可能的。"
            }
          ],
          "quiz": [
            {
              "text": "Mark 9:23 says everything is possible for him who believes.",
              "answer": true
            },
            {
              "text": "God's delays are never an answer to prayer.",
              "answer": false
            },
            {
              "text": "Joseph was tried by the hard prison conditions.",
              "answer": false
            },
            {
              "text": "The discipline of faith brings knowledge of God otherwise impossible.",
              "answer": true
            },
            {
              "text": "Waiting for God's promises is always easy.",
              "answer": false
            }
          ]
        }
      ]
    },
    {
      "id": 20,
      "title": "May 13–19",
      "sections": [
        {
          "sectionId": 1,
          "heading": "May 13",
          "audio": "audio/Streams in the Desert - May 13.m4a",
          "paragraphs": [
            {
              "en": "We do not know what we ought to pray for. (Romans 8:26)",
              "zh": "我们本不晓得当怎样祷告。（罗马书8:26）",
              "simpEn": "We don't know what we should pray for.",
              "simpZh": "我们不知道应该祷告什么。"
            },
            {
              "en": "Often it is simply the answers to our prayers that cause many of the difficulties in the Christian life. We pray for patience, and our Father sends <span class=\"vocab-trigger\" data-vocab=\"demanding people\">demanding people<\/span> our way who test us to the limit, \"because . . . suffering produces <span class=\"vocab-trigger\" data-vocab=\"perseverance\">perseverance<\/span>\" (Rom. 5:3). We pray for a <span class=\"vocab-trigger\" data-vocab=\"submissive spirit\">submissive spirit<\/span>, and God sends suffering again, for we learn to be obedient in the same way Christ \"learned obedience from what he suffered\" (Heb. 5:8).",
              "zh": "常是祷告的答复，引发了基督徒生活中许多困难。我们祈求忍耐，天父就差来苛刻的人，把我们试炼到极限，因为「患难生忍耐」（罗5:3）。我们祈求顺服的心，神就再次差来苦难，因为我们学习顺服，正如基督「因所受的苦难学了顺从」（来5:8）。",
              "simpEn": "Often the answers to our prayers cause difficulties. We pray for patience, and God sends demanding people to test us, because suffering produces perseverance. We pray for a submissive spirit, and God sends suffering, because we learn obedience the same way Christ learned—through what He suffered.",
              "simpZh": "常常是祷告的回应导致了基督徒生活中的困难。我们求忍耐，神就差来苛刻的人来考验我们，因为患难产生忍耐。我们求顺服的心，神就差来苦难，因为我们像基督一样，通过受苦学习顺服。"
            },
            {
              "en": "We pray to be <span class=\"vocab-trigger\" data-vocab=\"unselfish\">unselfish<\/span>, and God gives us opportunities to sacrifice by placing other people's needs first and by laying down our lives for other believers. We pray for strength and <span class=\"vocab-trigger\" data-vocab=\"humility\">humility<\/span>, and \"a messenger of Satan\" (2 Cor. 12:7) comes to torment us until we lie on the ground pleading for it to be withdrawn.",
              "zh": "我们祈求无私，神就给我们牺牲的机会，将他人的需要放在前面，为其他信徒舍命。我们祈求力量和谦卑，便有「撒但的差役」（林后12:7）来折磨我们，直到我们躺在地上恳求它离开。",
              "simpEn": "We pray to be unselfish, and God gives opportunities to sacrifice by putting others first. We pray for strength and humility, and a messenger of Satan comes to torment us until we plead for it to leave.",
              "simpZh": "我们求无私，神就给我们机会去牺牲，把别人放在首位。我们求力量和谦卑，撒但的使者就来折磨我们，直到我们求它离开。"
            },
            {
              "en": "We pray to the Lord, as His apostles did, saying, \"<span class=\"vocab-trigger\" data-vocab=\"Increase our faith\">Increase our faith<\/span>!\" (Luke 17:5). Then our money seems to take wings and fly away; our children become critically ill; an employee becomes careless, slow, and wasteful; or some other new trial comes upon us, requiring more faith than we have ever before experienced.",
              "zh": "我们向主祈求，像祂的使徒那样说：「加增我们的信心」（路17:5）。然后我们的钱财仿佛长了翅膀飞去；孩子病危；雇员变得粗心、迟慢和浪费；或者其他新的试炼临到我们，需要比我们从前所经历的更大的信心。",
              "simpEn": "We pray, 'Increase our faith!' Then money flies away, children become very sick, an employee becomes careless, or other new trials come that require more faith than ever before.",
              "simpZh": "我们祷告说‘加增我们的信心’，然后钱就飞走了，孩子病得很重，员工变得粗心，或其他新的试炼到来，需要比以前更大的信心。"
            },
            {
              "en": "We pray for a Christlike life that exhibits the humility of a lamb. Then we are asked to perform some <span class=\"vocab-trigger\" data-vocab=\"lowly task\">lowly task<\/span>, or we are unjustly accused and given no opportunity to explain, for \"he was led like a lamb to the slaughter, and . . . did not open his mouth\" (Isa. 53:7). We pray for <span class=\"vocab-trigger\" data-vocab=\"gentleness\">gentleness<\/span> and quickly face a storm of temptation to be harsh and <span class=\"vocab-trigger\" data-vocab=\"irritable\">irritable<\/span>. We pray for <span class=\"vocab-trigger\" data-vocab=\"quietness\">quietness<\/span>, and suddenly every nerve is stressed to its limit with tremendous tension so that we may learn that when He sends His peace, no one can disturb it.",
              "zh": "我们祈求像基督的生命，显出羔羊般的谦卑。然后我们被要求去从事低微的任务，或被不公义地控告，且没有机会辩解，因为「祂像羊羔被牵到宰杀之地……也是这样不开口」（赛53:7）。我们祈求温柔，立刻就有风暴般的试探临到，要我们变得苛刻易怒。我们祈求安静，突然每根神经都被拉到极限，充满极大的张力，好叫我们学习当祂赐下平安时，没有人能打扰。",
              "simpEn": "We pray for a life like Christ's with lamb-like humility. Then we're given a humble task or unjustly accused without a chance to explain, like Jesus who was led like a lamb to slaughter and didn't open His mouth. We pray for gentleness and face storms of harshness. We pray for quietness and are stretched to the limit, so we learn that when God gives peace, nothing can disturb it.",
              "simpZh": "我们求像基督的生命，有羔羊般的谦卑。然后就被要求做卑微的事，或被冤枉没有机会解释，就像耶稣像羊被牵去宰杀时不开口。我们求温柔，马上就有暴风试探让我们变得苛刻。我们求安静，突然每根神经都被拉到极限，让我们学习当神赐下平安时，没有任何东西能打扰。"
            },
            {
              "en": "We pray for love for others, and God sends unique suffering by sending people our way who are <span class=\"vocab-trigger\" data-vocab=\"difficult to love\">difficult to love<\/span> and who say things that get on our nerves and tear at our heart. He does this because \"love is patient, love is kind. . . . It is not rude, . . . it is not easily angered. . . . It always protects, always trusts, always hopes, always perseveres. Love never fails.\" (1 Cor. 13:4–5, 7–8).",
              "zh": "我们祈求对他人的爱心，神就差来一些难爱的人，说些刺激我们神经、撕裂我们内心的话，借此送来独特的苦难。祂这样做是因为「爱是恒久忍耐，又有恩慈……爱是不自夸，不张狂……不轻易发怒……凡事包容，凡事相信，凡事盼望，凡事忍耐。爱是永不止息」（林前13:4-8）。",
              "simpEn": "We pray for love, and God sends people who are hard to love and who say hurtful things, because 'love is patient, love is kind... it is not easily angered... it always protects, trusts, hopes, perseveres. Love never fails.'",
              "simpZh": "我们求爱心，神就差来很难爱的人，说些伤人的话，因为爱是恒久忍耐，又有恩慈，不轻易发怒，凡事包容，凡事相信，凡事盼望，凡事忍耐。爱永不止息。"
            },
            {
              "en": "Y es, we pray to be like Jesus, and God's answer is: \"I have tested you in the <span class=\"vocab-trigger\" data-vocab=\"furnace of affliction\">furnace of affliction<\/span>\" (Isa. 48:10); \"Will your courage endure or your hands be strong?\" (Ezek. 22:14); \"Can you drink the cup?\" (Matt. 20:22). The way to peace and victory is to accept every circumstance and every trial as being straight from the hand of our loving Father; to live \"with him in the heavenly realms\" (Eph. 2:6), above the clouds, in the very presence of His throne; and to look down from glory on our circumstances as being lovingly and <span class=\"vocab-trigger\" data-vocab=\"divinely appointed\">divinely appointed<\/span>. —selected",
              "zh": "是的，我们祈求像耶稣，神的回答却是：「你在苦难的炉中，我拣选你」（赛48:10）；「到了我惩罚你的日子，你的心还能忍受吗？你的手还能有力吗？」（结22:14）；「我将要喝的杯，你们能喝吗？」（太20:22）。通往平安和胜利的路，就是要接受每一个环境和每一个试炼，都是直接从我们慈爱的父手中来的；要「与基督耶稣一同……坐在天上」（弗2:6），在云层之上，就在祂宝座的同在中；并从荣耀中俯视我们的环境，看作是被爱所命定、被神所指派的。——选",
              "simpEn": "Yes, we pray to be like Jesus, and God answers: 'I have tested you in the furnace of affliction.' 'Can you drink the cup?' The way to peace is to accept every trial as from our loving Father's hand, to live above the clouds in His presence, and to look down on our circumstances as lovingly and divinely planned.",
              "simpZh": "是的，我们求像耶稣，神的回答却是：我在苦难的炉中试炼你；你能喝那杯吗？通往平安和胜利的路是接受每个环境和试炼都是从慈爱父的手中来的，活在云层之上祂的同在里，从荣耀中看我们的环境是出于爱和神的安排。"
            },
            {
              "en": "I prayed for strength, and then I lost awhile <br>All sense of nearness, human and divine; <br>The love I leaned on failed and pierced my heart, <br>The hands I clung to loosed themselves from mine; <br>But while I swayed, weak, trembling, and alone, <br>The <span class=\"vocab-trigger\" data-vocab=\"everlasting arms\">everlasting arms<\/span> upheld my own. <br>I prayed for light; the sun went down in clouds, <br>The moon was darkened by a misty doubt, <br>The stars of heaven were dimmed by earthly fears, <br>And all my little candle flames burned out; <br>But while I sat in shadow, wrapped in night, <br>The face of Christ made all the darkness bright. <br>I prayed for peace, and dreamed of restful ease, <br>A slumber free from pain, a hushed repose; <br>Above my head the skies were black with storm, <br>And fiercer grew the <span class=\"vocab-trigger\" data-vocab=\"onslaught\">onslaught<\/span> of my foes; <br>But while the battle raged, and wild winds blew, <br>I heard His voice and perfect peace I knew. <br>I thank You, Lord, You were too wise to heed <br>My feeble prayers, and answer as I sought, <br>Since these rich gifts Your bounty has bestowed <br>Have brought me more than all I asked or thought; <br>Giver of good, so answer each request <br>With Your own giving, better than my best. <br>—Annie Johnson Flint",
              "zh": "我祈求力量，随后片时失去一切亲近感，无论人间与天上；我所倚靠的爱辜负了我，刺透我心，我所紧握的手松开了我；但在我摇晃、软弱、战栗、孤独之际，永久的膀臂扶托着我。我祈求亮光；太阳在云中沉落，月亮被朦雾般的疑惑遮蔽，天上的星辰被地上的恐惧变为黯淡，我所有的小烛火都燃尽了；但当我坐在暗影中，被黑夜包裹时，基督的容颜使一切黑暗变为光明。我祈求平安，梦想着安舒的闲逸，毫无痛楚的沉睡，静寂的安息；我头上天空因风暴而乌黑，仇敌的攻势越发凶猛；但当战役肆虐，狂风呼啸之际，我听见祂的声音，便知道完全的平安。感谢祢，主，祢太有智慧，不照我软弱祈祷所求的来答允，因为祢慷慨赐下的厚恩，带给我远超我所求所想；美善的赐予者啊，求祢以祢自己的赐予，回应每一个请求，比我的最好更好。——安妮·约翰逊·弗林特",
              "simpEn": "I prayed for strength and lost all sense of closeness, human and divine. The love I leaned on failed me, hands let go. But while I swayed weak and alone, the everlasting arms held me. I prayed for light; sun went down, moon darkened by doubt, stars dimmed, my candles burned out. But while sitting in shadow, Christ's face made the darkness bright. I prayed for peace and dreamed of restful sleep; but skies grew black with storm, foes attacked fiercer. Yet while the battle raged, I heard His voice and knew perfect peace. I thank You, Lord, You were too wise to answer as I sought. Your rich gifts brought more than I asked or thought. Giver of good, answer each request with Your giving, better than my best.",

              "simpEn": "Pressed beyond measure, pressed beyond my strength; pressed in body, soul, and mind till dark surges roll. Pressure from foes and dear friends, pressure on pressure till life almost ends. Pressed into knowing no helper but God; pressed into loving His staff and rod. Pressed into liberty where nothing clings; pressed into faith for impossible things. Pressed into living my life for the Lord, into living a poured-out Christ-life.",

              "zh": "有些人身上有一种浅薄。凭着他们浮浅的天性，他们轻轻抓住一个理论或应许，然后轻率地表示不信那些遇试炼就退缩的人。然而经历过巨大苦难的男女永不会这样做。他们非常温柔，明白受苦究竟意味着什么。这正是保罗所说的：「死是在我们身上发动」（林后4:12）。",
              "simpEn": "Some people are shallow. They lightly grab a theory or promise and carelessly distrust those who retreat from trials. But those who have suffered greatly will never do this. They are very tender and gentle, understanding what suffering really means. This is what Paul meant: 'Death is at work in us' (2 Cor. 4:12).",

              "simpZh": "当我们凭信心向神要祝福时，我们必须抱着信心的态度，开始行动和祷告，好像那祝福已经是我们的一样。我们要向神回应，好像祂已经允准了我们的祈求。这种信赖的态度就是为我们认领的倚靠祂，理所当然地认定祂已赐给我们所求的，并且会继续赐予。"

              "simpEn": "Who hasn't learned that our most sorrowful days are often our best? The days when we smile and skip easily through the soft meadow God has adorned with spring flowers, our heart's capacity is often wasted.",
              "simpZh": "谁没有学到，最忧伤的日子往往是最好的日子？当我们满脸笑容，在神用春花装饰的柔软草地上轻快跳跃时，内心的容量常常被浪费了。"

            {
              "en": "The soul that is always <span class=\"vocab-trigger\" data-vocab=\"lighthearted\">lighthearted<\/span> and cheerful misses the deepest things of life. Certainly that life has its reward and is fully satisfied, but the depth of its satisfaction is very shallow. Its heart is <span class=\"vocab-trigger\" data-vocab=\"dwarfed\">dwarfed<\/span>, and its nature, which has the potential of experiencing the highest heights and the deepest depths, remains undeveloped. And the wick of its life burns quickly to the bottom, without ever knowing the richness of profound joy.",

              "simpZh": "总是轻松愉快的灵魂错过了人生最深的事。那种生活有它的报偿和满足，但满足的深度很浅。它的心是矮小的，它的本性没有发展，生命的灯芯很快就烧完了，从未体会过深刻喜乐的丰盛。"

              "simpEn": "Remember, Jesus said, 'Blessed are those who mourn' (Matt. 5:4). Stars shine brightest in winter's long dark night. Gentian flowers display their fairest blooms among nearly inaccessible heights of mountain snow and ice.",
              "simpZh": "要记得，耶稣说哀恸的人有福了。星星在冬天漫长黑夜中照得最亮。龙胆野花在几乎无法到达的冰雪高山之巅开出最美的花。"
            },
            {
              "en": "God seems to use the pressure of pain to <span class=\"vocab-trigger\" data-vocab=\"trample\">trample<\/span> out the fulfillment of His promises and thereby release the sweetest juice of His <span class=\"vocab-trigger\" data-vocab=\"winepress\">winepress<\/span>. Only those who have known sorrow can fully appreciate the great tenderness of the \"man of sorrows\" (Isa. 53:3). —selected",
              "zh": "神似乎用痛苦的压力来践出祂应许的成就，从而释放祂酒榨中最甜的汁浆。只有经历过忧伤的人，才能完全体会那「忧患之子」（赛53:3）的极大温柔。——选",
              "simpEn": "God uses the pressure of pain to trample out the fulfillment of His promises and release the sweetest juice of His winepress. Only those who have known sorrow can fully appreciate the tenderness of the 'Man of Sorrows' (Isa. 53:3).",
              "simpZh": "神用痛苦的压力把应许践踏出来，释放祂酒榨中最甜的汁。只有经历过忧伤的人，才能完全体会那位‘忧患之子’的极大温柔。"
            },
            {

              "zh": "你或许正在经历很少的阳光，但那漫长幽暗的日子乃是为你精心设计的，因为或许一段漫长的夏日天气会使你成为像干裂的土地或荒芜的旷野。你的主知道最好的安排，乌云和太阳都在等候祂的命令。——选。当有人对一位苏格兰老鞋匠说「这是个阴天」时，他回答：「是的，但你看见那片蓝色了吗？」",
              "simpEn": "You may have little sunshine, but the long gloomy periods are wisely designed for you; a lengthy stretch of summer might have made you like parched land or a barren wilderness. Your Lord knows best; clouds and sun await His command. An old Scottish cobbler, told 'It's a gray day,' replied, 'Yes, but didn't you see the patch of blue?'",
              "simpZh": "你也许正在经历很少阳光，但那漫长幽暗的日子是为你精心设计的；因为一段长时间的夏日可能会使你像干裂的土地或荒芜的旷野。你的主知道最好的，乌云和太阳都在等候祂的命令。一位苏格兰老鞋匠听到‘今天是个阴天’时，回答说：‘是啊，但你没看见那片蓝色吗？’"

              "en": "The people then gathered around with their rods. As they began to dig deeply into the burning sand, they sang, \"Spring up, O well! Sing about it.\" Soon a <span class=\"vocab-trigger\" data-vocab=\"gurgling\">gurgling<\/span> sound was heard, and suddenly a rush of water appeared, filling the well and running along the ground. As they had dug the well in the desert, they had <span class=\"vocab-trigger\" data-vocab=\"tapped\">tapped<\/span> the stream that ran below and that had been unseen for a very long time.",

              "simpEn": "What a beautiful picture! It describes the river of blessings that flows through our lives. If only we respond with faith and praise, we will find our needs supplied even in the most barren desert.",
              "simpZh": "多美的图画！它描绘出流经我们生命的祝福之河。只要我们以信心和赞美回应，我们就要在最荒芜的沙漠中发现我们的需要得到供应。"

              "simpEn": "How did Israel reach the water? Through praise. As they stood on burning sand and dug with the staff of promise, they sang a praise song of faith. Our praise will bring forth water in the wilderness and streams in the desert (Isa. 35:6), while complaining brings only judgment. Even prayer alone may fail to reach the fountain of blessings.",

          "paragraphs": [
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Bring them here to me\">Bring them here to me<\/span>. (Matthew 14:18)",

              "simpEn": "Bring them here to Me.",
              "simpZh": "把它们拿过来给我。"
            },
            {
              "en": "Do you find yourself at this very moment surrounded with needs, and nearly <span class=\"vocab-trigger\" data-vocab=\"overwhelmed\">overwhelmed<\/span> with difficulties, trials, and emergencies? Each of these is God’s way of providing vessels for the Holy Spirit to fill. If you correctly understand their meaning, you will see them as opportunities for receiving new blessings and <span class=\"vocab-trigger\" data-vocab=\"deliverance\">deliverance<\/span> you can receive in no other way.",
              "zh": "你是否此刻正被需要包围，几乎被困难、试炼和急难所淹没？每一样都是神为圣灵所预备要充满的器皿。你若正确明白它们的意义，就必视它们为领受新祝福和拯救的机会，是用别的方法无法得到的。",
              "simpEn": "Are you surrounded by needs and almost overwhelmed with difficulties, trials, and emergencies? Each one is God's way of giving vessels for the Holy Spirit to fill. If you understand this, you'll see them as chances to receive new blessings and rescue you can't get any other way.",
              "simpZh": "你是不是正被需要包围，几乎被困难、试炼和急难淹没？每一个都是神预备给圣灵充满的器皿。如果你明白这点，你就会把它们看作领受新祝福和拯救的机会，是别的办法得不到的。"
            },
            {
              "en": "The Lord is saying to you, \"Bring them here to me.\" Firmly hold the vessels before Him, in faith and in prayer. Remain still before Him, and stop your own restless working until He begins to work. Do nothing that He Himself has not commanded you to do. Allow God time to work and He surely will. Then the very trials that threatened to overcome you with discouragement and disaster will become God’s opportunity to reveal His grace and glory in your life, in ways you have never known before. —A. B. Simpson",
              "zh": "主正对你说：「把它们拿过来给我。」凭信心、在祷告中，将这些器皿稳固地端在祂面前。在祂面前保持安静，停止你自己不停歇的作为，直到祂开始作工。任何祂没有吩咐你作的事都不可作。容让神有时间作工，祂就必定作工。这样，那些曾威胁要以沮丧和灾难胜过你的试炼，就要变成神的机会，以你从前所不知的方式，在你生命中彰显祂的恩典与荣耀。——宣信",
              "simpEn": "The Lord says, 'Bring them here to Me.' Hold your needs before Him in faith and prayer. Be still and stop your own restless working until He begins. Do nothing He hasn't commanded. Give God time to work, and He will. Then the very trials that threatened to crush you with discouragement will become God's chance to show His grace and glory in new ways.",
              "simpZh": "主说：‘把它们拿过来给我。’凭信心在祷告中把需要摆在祂面前。安静下来，停止你自己的忙乱，直到祂开始动工。不要做祂没吩咐的事。给神时间，祂一定会作工。那些曾威胁要让你灰心失败的试炼，就会变成神的机会，在你生命中显出你从未见过的恩典和荣耀。"
            },
            {
              "en": "My God will meet all your needs according to his glorious riches in Christ Jesus. (Philippians 4:19) <br>What a source—\"God\"! What a supply—\"his glorious riches\"! What a channel—\"Christ Jesus\"! It is your heavenly privilege to trust \"all your needs\" to \"his glorious riches,\" and to forget \"your needs\" in the presence of \"his ...riches.\" In His great love, He has thrown open to you His <span class=\"vocab-trigger\" data-vocab=\"exhaustive treasury\">exhaustive treasury<\/span>. Go in and draw upon Him in simple childlike faith, and you will never again have the need to rely on anything else. —C. H. M.",
              "zh": "我的神必照祂荣耀的丰富，在基督耶稣里，使你们一切所需用的都充足。（腓4:19）何等的源头——「神」！何等的供应——「祂荣耀的丰富」！何等的管道——「基督耶稣」！将你「一切所需用的」信托给「祂荣耀的丰富」，并在「祂……的丰富」面前忘记「你的所需」，这是你属天的特权。在祂的大爱中，祂已向你敞开祂那无尽的宝库。凭着单纯如孩童的信心进去支取吧，你就永不再需要倚靠任何其他事物了。——C. H. M.",
              "simpEn": "My God will meet all your needs according to His glorious riches in Christ Jesus. What a source—God! What a supply—His glorious riches! What a channel—Christ Jesus! It's your privilege to trust all your needs to His riches and forget your needs in His presence. In His love, He has opened His endless treasury to you. Draw on Him with simple childlike faith, and you'll never need to rely on anything else.",
              "simpZh": "我的神必照祂荣耀的丰富，在基督耶稣里，使你们一切所需用的都充足。多好的源头——神！多好的供应——祂荣耀的丰富！多好的通道——基督耶稣！把你的所有需要交托给祂的丰富，在祂的丰富面前忘记你的需要，这是你属天的特权。神在爱中已经为你打开祂无尽的宝库。用孩子般单纯的信心去支取，你就再不用靠别的东西了。"
            },
            {
              "en": "My Cup Overflows (Ps. 23:5) <br>There is always something \"over,\" <br>When we trust our gracious Lord; <br>Every cup is overflowing, <br>His great rivers all are broad. <br>Nothing narrow, nothing sparing, <br>Ever springing from His store; <br>To His own He gives full measure, <br>Overflowing, evermore. <br>There is always something \"over,\" <br>When we, from the Father's hand, <br>Take our <span class=\"vocab-trigger\" data-vocab=\"portion\">portion<\/span> with thanksgiving, <br>Praising for the path He planned. <br>Satisfaction, full and deepening, <br>Fills the soul, and lights the eye, <br>When the heart has trusted Jesus <br>All its needs to satisfy. <br>There is always something \"over,\" <br>When we tell of all His love; <br>Unreached depths still lie beneath us, <br>Unscaled heights rise far above: <br>Human lips can never utter <br>All His wondrous tenderness, <br>We can only praise and wonder, <br>And His name forever bless. <br>—Margaret E. Barber",
              "zh": "我的福杯满溢（诗23:5）。总是有「满溢」的，当我们信靠我们恩慈的主；每个杯都满溢，祂的大河全都宽阔。没有狭窄，没有吝惜，永远从祂的库中涌出；祂赐给属祂的人完全的量，永远满溢。总是有「满溢」的，当我们从父的手中，以感谢接过自己的份，为祂所定的道路赞美。全然且不断加深的满足，充满灵魂，照亮眼睛，当心已信托耶稣，满足它一切需要。总是有「满溢」的，当我们述说祂一切的爱；未触及的深度仍在底下，未攀登的高处远远在上：人的嘴唇永不能述尽祂一切奇妙的温柔，我们只能赞美和惊叹，并永远称颂祂的名。——玛格丽特·巴伯",
              "simpEn": "My cup overflows. There is always something 'over' when we trust our gracious Lord. Every cup overflows; His rivers are broad. Nothing narrow, nothing held back, always springing from His store. He gives full measure to His own, overflowing always. When we take our portion with thanksgiving, praising for His path, full satisfaction fills the soul and lights the eye when the heart trusts Jesus to meet all needs. There is always something 'over' when we tell of His love; depths below, heights above unreached. Lips can't utter all His tenderness—we can only praise and bless His name forever.",
              "simpZh": "我的福杯满溢。当我们信靠恩慈的主时，总有一些‘溢出来’。每个杯都满溢，祂的江河宽阔。没有狭窄，没有吝惜，从祂的仓库不断涌出。祂给属祂的人满量，一直满溢。当我们以感谢从父的手中接过份，为祂安排的路赞美，完全的满足就充满灵魂，照亮眼睛，当心信任耶稣来满足一切需要。当我们讲述祂的爱时总有一些‘溢出来’；还有未到的深处，未上的高处。人的嘴唇无法说尽祂奇妙的温柔——我们只能赞美，永永远远称颂祂的名。"
            },

              "en": "He who did not spare his own Son, but gave him up for us all—how will he not also, along with him, <span class=\"vocab-trigger\" data-vocab=\"graciously give\">graciously give<\/span> us all things? (Romans 8:32)",
              "zh": "神既不爱惜自己的儿子，为我们众人舍了，岂不也把万物和祂一同白白地赐给我们吗？（罗马书8:32）",

          "audio": "audio/Streams in the Desert - May 28.m4a",
          "paragraphs": [
            {
              "en": "\"I will not let you go unless you bless me.\" . . . Then he blessed him there. (Genesis 32:26, 29)",
              "zh": "「你不给我祝福，我就不容你去。」……于是在那里给雅各祝福。（创世记32:26,29）",
              "simpEn": "I will not let You go unless You bless me. Then He blessed him there.",
              "simpZh": "你不给我祝福，我就不放你走。于是祂就在那里给他祝福了。"
            },
            {
              "en": "Jacob won the victory and the blessing here not by wrestling but by <span class=\"vocab-trigger\" data-vocab=\"clinging\">clinging<\/span>. His hip was out of joint and he could struggle no longer, but he would not let go. Unable to wrestle further, he locked his arms around the neck of his mysterious opponent, helplessly resting all his weight upon him, until he won at last.",
              "zh": "雅各在此赢得胜利和祝福，不是借着摔跤，乃是借着紧紧抓住。他的大腿窝扭了，不能再搏斗，但他仍不放手。既无力继续摔跤，他就用双臂环抱住那位神秘对手的颈项，无助地将全身重量都靠在祂身上，直到最后得胜。",
              "simpEn": "Jacob won the victory and blessing not by wrestling but by clinging. His hip was out of joint, so he couldn't struggle anymore, but he wouldn't let go. Unable to wrestle further, he locked his arms around his opponent's neck, resting all his weight helplessly on Him, until he finally won.",
              "simpZh": "雅各得胜和祝福不是靠摔跤，而是靠紧紧抓住。他的大腿窝扭了，不能再斗了，但就是不放手。不能再摔了，他就用双臂抱住那位神秘对手的脖子，把全身重量无助地靠在祂身上，直到最后赢了。"
            },
            {
              "en": "We too will not win the victory in prayer until we cease our struggling. We must give up our own will and throw our arms around our Father's neck in clinging faith. What can our <span class=\"vocab-trigger\" data-vocab=\"feeble\">feeble<\/span> human strength take by force from the hand of <span class=\"vocab-trigger\" data-vocab=\"omnipotence\">omnipotence<\/span>? Are we able to wrestle blessings from God by force? Strong-willed violence on our part will never <span class=\"vocab-trigger\" data-vocab=\"prevail\">prevail<\/span> with Him. What wins blessings and victories is the strength of clinging faith.",
              "zh": "我们也要在停止自己的挣扎之后，才能在祷告中得胜。我们必须放下自己的意志，用紧抓的信心，张开双臂抱住天父的颈项。我们微弱的人力能从全能者的手中夺取什么呢？我们能强夺神的祝福吗？我们这方的强硬意志永不能胜过祂。赢得祝福和胜利的，乃是紧抓之信心的力量。",
              "simpEn": "We too won't win in prayer until we stop struggling. We must give up our own will and throw our arms around our Father's neck in clinging faith. What can our weak human strength take by force from the hand of almighty God? Can we force blessings from Him? Strong-willed pressure from us will never succeed with Him. What wins blessings is the strength of clinging faith.",
              "simpZh": "我们也要停止挣扎，才能在祷告中得胜。我们必须放下自己的意思，用紧抓的信心，双手抱住天父的脖子。我们软弱的人的力量，能从全能者手中强夺什么呢？我们能强迫神给祝福吗？我们硬来永远不会胜过祂。能赢得祝福和胜利的，是紧紧抓住不放的信心。"
            },
            {
              "en": "It is not applying pressure or insisting upon our own will that brings victory. It is won when <span class=\"vocab-trigger\" data-vocab=\"humility\">humility<\/span> and trust unite in saying, \"Not my will, but yours be done\" (Luke 22:42). We are strong with God only to the degree that self is conquered and is dead. Blessings come not by wrestling but by clinging to Him in faith. —J. R. Miller",
              "zh": "带来胜利的不是施加压力或坚持己意。胜利乃是当谦卑和信赖联合起来说「不要成就我的意思，只要成就祢的意思」（路22:42）时赢得的。我们在神面前刚强，只在于自我被征服、治死的程度。祝福不是借着摔跤，乃是借着信心紧紧抓住祂而来的。——J. R.米勒",
              "simpEn": "Victory doesn't come by applying pressure or insisting on our own will. It is won when humility and trust unite to say, 'Not my will, but Yours be done' (Luke 22:42). We are strong with God only as much as self is conquered and dead. Blessings come not by wrestling but by clinging to Him in faith.",
              "simpZh": "得胜不是靠施加压力或坚持自己的意思。胜利是当谦卑和信任联合起来说‘不要成就我的意思，只要成就你的意思’时赢得的。我们在神面前有多刚强，只在于自我被治死多少。祝福不是靠摔跤，而是凭信心紧紧抓住祂来的。"
            },
            {
              "en": "An incident from the prayer life of Charles H. Usher illustrates how \"wrestling prayer\" is actually a <span class=\"vocab-trigger\" data-vocab=\"hindrance\">hindrance<\/span> to prevailing prayer. He shared this story: \"My little boy, Frank, was very ill, and the doctors held out little hope of his recovery. I used all the prayer knowledge I possessed on his behalf, but he continued to worsen. This went on for several weeks. One day as I stood watching him while he lay on his bed, I realized he could not live much longer without a quick turn for the better. I said to the Lord, 'Oh, God, I have spent much time in prayer for my son, and yet he is no better. I will now leave him to You and give myself to prayer for others. If it is Your will to take him, I choose Your will—I <span class=\"vocab-trigger\" data-vocab=\"surrender\">surrender<\/span> him entirely to You.'\"",
              "zh": "查尔斯·H. 亚瑟祷告生活中的一件事，显明「摔跤式的祷告」实际上如何阻碍了得胜的祷告。他分享了这个故事：「我的小儿子弗兰克病得很重，医生认为痊愈的希望渺茫。我用尽了我所知道的一切祷告知识为他祈求，但他仍继续恶化。这样持续了几周。一天，我站在他的床边看着他，意识到若没有迅速好转，他活不久了。我对主说：『神啊，我为我的儿子花了许多时间祷告，他却未见好转。现在我要把他交给祢，自己转去为别人祷告。如果祢的旨意是取走他，我选择祢的旨意——我完全把他交给祢了。』」",
              "simpEn": "Charles Usher's prayer life shows how wrestling prayer can actually block answered prayer. He told this story: 'My little boy Frank was very ill, and doctors had little hope. I used all my prayer knowledge for him, but he kept getting worse. This went on for weeks. One day I stood watching him and realized he couldn't live much longer without a quick turn for the better. I said, \"Oh God, I've spent so much time in prayer for my son, and he is no better. I will now leave him to You and give myself to praying for others. If it is Your will to take him, I choose Your will—I surrender him entirely to You.\"'",
              "simpZh": "查尔斯·亚瑟的祷告生活显明，摔跤式的祷告其实会拦阻祷告得答应。他讲了这个故事：‘我的小儿子弗兰克病得很重，医生觉得没什么希望。我用尽一切祷告知识为他求，但他一直恶化，持续了好几周。一天我站在他床边看他，意识到若不快速好转他就活不久了。我对主说：“神啊，我花了很多时间为儿子祷告，他还是不好。现在我要把他交给你，自己去为别人祷告。如果你的旨意是要接走他，我选择你的旨意——我完全把他交给你了。”’"
            },
            {
              "en": "\"I called in my dear wife and told her what I had done. She shed some tears but also handed him over to God. Two days later a godly man came to visit us. He had been very interested in our son Frank and had prayed often for him. He told us, 'God has given me faith to believe that your son will recover. Do you have that faith?' I responded, 'I have surrendered him to God, but I will now go again to Him regarding my son.' I did just that and while in prayer discovered I had faith for his recovery. From that time forward he began to get better. I then realized that it was the 'wrestling' of my prayers that had hindered God's answer, and that if I had continued to wrestle, being unwilling to surrender him to God, he would probably not be here today.\"",
              "zh": "「我叫了我亲爱的妻子来，告诉她我所作的。她流了些眼泪，但也把他交给了神。两天后，一位敬虔的弟兄来看我们。他对我们的儿子弗兰克一直很关心，常为他祷告。他告诉我们：『神已赐我信心，相信你的儿子会康复。你有这信心吗？』我回答说：『我已经把他交给神了，但我现在要再为儿子到神面前去。』我就这样做了，在祷告中我发现我有了他康复的信心。从那时起，他开始好转。我这才明白，是我祷告中的『摔跤』阻碍了神的答复，如果我继续摔跤，不愿把他交给神，他很可能今天已经不在了。」",
              "simpEn": "'I called my wife and told her what I had done. She shed tears but also handed him over to God. Two days later a godly man visited us. He often prayed for Frank and told us, \"God has given me faith that your son will recover. Do you have that faith?\" I responded, \"I have surrendered him to God, but I will go to Him again about my son.\" I did, and in prayer found I had faith for his recovery. From that time on he got better. I then realized that my wrestling prayers had hindered God's answer. If I had kept wrestling, unwilling to surrender him, he probably wouldn't be here today.'",
              "simpZh": "‘我叫了妻子来，告诉她我做的事。她流了泪但也把孩子交给了神。两天后一个敬虔的人来看我们。他常为弗兰克祷告，告诉我们：“神已给我信心，相信你儿子会康复。你有这信心吗？”我回答说：“我已经把他交给神了，但我要再到神面前为他祷告。”我就这样做了，在祷告中发现我有了他康复的信心。从那时起他就开始好转。我才意识到，是我摔跤式的祷告拦阻了神的答复，如果我一直摔跤，不愿把他交给神，他今天恐怕就不在了。’"
            }

          "paragraphs": [
            {
              "en": "No one could learn the song except the 144,000 who had been <span class=\"vocab-trigger\" data-vocab=\"redeemed from the earth\">redeemed from the earth<\/span>. (Revelation 14:3)",

            {
              "en": "Certain songs can only be learned in the valley. No music school can teach them, for no theory can cause them to be perfectly sung. Their music is found in the heart. They are songs remembered through personal experience, revealing their burdens through the shadows of the past, and <span class=\"vocab-trigger\" data-vocab=\"soaring\">soaring<\/span> on the wings of yesterday.",
              "zh": "有些歌只能在山谷里学会。没有音乐学院能教这些歌，因为没有任何理论能使人把它们完美地唱出。它们的音乐是在心里找到的。它们是借着个人经历所记起的歌，穿过过去的阴影展示它们的重担，并乘着昨日的翅膀翱翔。",
              "simpEn": "Certain songs can only be learned in the valley. No music school can teach them; no theory can make them perfectly sung. Their music is found in the heart. They are songs remembered through personal experience, revealing their burdens through the shadows of the past, and soaring on the wings of yesterday.",
              "simpZh": "有些歌只能在谷中学会。没有音乐学校能教，没有理论能让人完美唱出。它们的音乐在心里。它们是借着个人经历记住的歌，在过去的阴影中显明它们的重担，乘着昨天的翅膀飞翔。"

              "zh": "哦，亲爱的灵魂，不要藐视你忧伤的学校。它正在赋予你在天上之歌中一个独特的声部。——乔治·马西森。午夜是否正围拢你？暗影是否又黑又长？求祂来到你身边，祂必赐你一首新的甜歌。祂必赐下，并与你同唱；当你软弱慢下时，祂必接着那断裂的韵律，将它与祂自己的调和。许多天上的歌者，在那些光明之子中，要指着祂最甜美的音乐说：「我是在夜中学到的。」许多美妙的颂歌，充满父的家中，都是在暗室的阴影中，啜泣着完成了第一次的排练。",

              "en": "When Victor Hugo was more than eighty years old, he expressed his faith in this beautiful way: \"Within my soul I feel the evidence of my future life. I am like a forest that has been cut down more than once, yet the new growth has more life than ever. I am always rising toward the sky, with the sun shining down on my head. The earth provides abundant <span class=\"vocab-trigger\" data-vocab=\"sap\">sap<\/span> for me, but heaven lights my way to worlds unknown. People say the soul is nothing but the effect of our bodily powers at work. If that were true, then why is my soul becoming brighter as my body begins to fail? Winter may be filling my head, but an eternal spring rises from my heart. At this late hour of my life, I smell the fragrance of lilacs, violets, and roses, just as I did when I was twenty. And the closer I come to the end of my journey, the more clearly I hear the immortal symphonies of eternal worlds inviting me to come. It is awe-inspiring yet profoundly simple.\"",

              "simpEn": "Why do you worry? What good does your worrying do? You are on such a large ship that you couldn't steer even if the Captain put you at the helm. You couldn't even adjust the sails, yet you worry as if you were the captain. Be quiet, dear soul—God is the Master!",
              "simpZh": "你为什么忧虑？忧虑有什么用？你在一艘这么大的船上，就算船长让你掌舵，你也驾驶不了。你连帆都不会调，却担心得好像你是船长。安静吧，亲爱的灵魂——神才是主人！"
            },
            {
              "en": "Do you think all the <span class=\"vocab-trigger\" data-vocab=\"commotion\">commotion<\/span> and the <span class=\"vocab-trigger\" data-vocab=\"uproar\">uproar<\/span> of this life is evidence that God has left His throne? He has not! His mighty steeds rush furiously ahead, and His chariots are the storms themselves. But the horses have <span class=\"vocab-trigger\" data-vocab=\"bridles\">bridles<\/span>, and it is God who holds the <span class=\"vocab-trigger\" data-vocab=\"reins\">reins<\/span>, guiding the chariots as He wills! Our God Jehovah is still the Master! Believe this and you will have peace. \"Don't be afraid\" (Matt. 14:27). —Charles H. Spurgeon",
              "zh": "你是否以为今生的一切骚动和喧嚷，证明神已经离开了祂的宝座？并没有！祂大力的骏马猛烈前奔，祂的战车就是风暴本身。但马有嚼环，是神握着缰绳，随己意调度战车！我们的神耶和华仍是主人！相信这一点，你就有平安。「不要怕」（太14:27）。——查尔斯·哈丁·司布真",
              "simpEn": "Do you think all the noise and uproar of life proves God has left His throne? He has not! His mighty steeds rush ahead, and His chariots are the storms. But the horses have bridles, and God holds the reins, guiding the chariots as He wills! Our God Jehovah is still the Master! Believe this and you will have peace. 'Don't be afraid' (Matt. 14:27).",
              "simpZh": "你觉得生活中所有的吵闹和喧嚣证明神已离开宝座了吗？没有！祂的大马猛烈往前冲，祂的战车就是风暴本身。但马有嚼环，是神握着缰绳，按自己的意思指挥战车！我们的神耶和华仍是主人！相信这一点，你就必得平安。‘不要怕。’"
            },
            {
              "en": "Tonight, my soul, be still and sleep; <br>The storms are raging on God’s deep— <br>God’s deep, not yours; be still and sleep. <br>Tonight, my soul, be still and sleep; <br>God’s hands will still the Tempter’s sweep— <br>God’s hands, not yours; be still and sleep. <br>Tonight, my soul, be still and sleep; <br>God’s love is strong while night hours creep— <br>God’s love, not yours; be still and sleep. <br>Tonight, my soul, be still and sleep; <br>God’s heaven will comfort those who weep— <br>God’s heaven, not yours; be still and sleep.",
              "zh": "今夜，我的灵魂，安静睡吧；风暴正在神的深海上咆哮——是神的海，不是你的；安静睡吧。今夜，我的灵魂，安静睡吧；神的手必平息那试探者的横扫——是神的手，不是你的；安静睡吧。今夜，我的灵魂，安静睡吧；当夜间的时光爬行时，神的爱是刚强的——是神的爱，不是你的；安静睡吧。今夜，我的灵魂，安静睡吧；神的天必安慰哭泣的人——是神的天，不是你的；安静睡吧。",
              "simpEn": "Tonight, my soul, be still and sleep; storms rage on God's deep—God's deep, not yours; be still and sleep. Tonight, my soul, be still and sleep; God's hands will still the Tempter's sweep—God's hands, not yours; be still and sleep. Tonight, my soul, be still and sleep; God's love is strong while night hours creep—God's love, not yours; be still and sleep. Tonight, my soul, be still and sleep; God's heaven will comfort those who weep—God's heaven, not yours; be still and sleep.",
              "simpZh": "今夜，我的灵魂，安静睡吧；风暴在神的深海上咆哮——是神的海，不是你的；安静睡吧。今夜，我的灵魂，安静睡吧；神的手必止住试探者的横扫——是神的手，不是你的；安静睡吧。今夜，我的灵魂，安静睡吧；夜间的时光爬行时，神的爱是刚强的——是神的爱，不是你的；安静睡吧。今夜，我的灵魂，安静睡吧；神的天必安慰哭泣的人——是神的天，不是你的；安静睡吧。"
            },

              "en": "I implore you to not give in to <span class=\"vocab-trigger\" data-vocab=\"despair\">despair<\/span>. It is a dangerous temptation, because our <span class=\"vocab-trigger\" data-vocab=\"Adversary\">Adversary<\/span> has refined it to the point that it is quite <span class=\"vocab-trigger\" data-vocab=\"subtle\">subtle<\/span>. Hopelessness <span class=\"vocab-trigger\" data-vocab=\"constricts\">constricts<\/span> and <span class=\"vocab-trigger\" data-vocab=\"withers\">withers<\/span> the heart, rendering it unable to sense God’s blessings and grace. It also causes you to <span class=\"vocab-trigger\" data-vocab=\"exaggerate\">exaggerate<\/span> the adversities of life and makes your burdens seem too heavy for you to bear. Yet God’s plans for you, and His ways of bringing about His plans, are infinitely wise. —Madame Guyon",
              "zh": "我恳求你，不要向绝望屈服。那是一个危险的试探，因为我们的仇敌已经将它磨炼得极其狡猾。绝望使心收缩、枯萎，以致不能感知神的祝福和恩典。它也让你夸张人生的逆境，使你的重担显得太重而无法承担。然而神对你的计划，以及祂成就这些计划的方法，是无限智慧的。——盖恩夫人",
              "simpEn": "I beg you not to give in to despair. It's a dangerous temptation, because our Adversary has refined it to be quite subtle. Hopelessness tightens and withers the heart, making it unable to sense God's blessings and grace. It also makes you exaggerate life's troubles and makes your burdens seem too heavy to bear. Yet God's plans for you, and His ways of carrying them out, are infinitely wise.",
              "simpZh": "我求你，不要向绝望投降。那是危险的试探，因为我们的仇敌已经把它磨炼得非常狡猾。绝望使心收缩、枯萎，不能感受神的祝福和恩典。它也让你夸大生活中的逆境，使你的担子显得太重背不起。然而神对你的计划，以及祂实行计划的方法，是无限智慧的。"

          "sectionId": 7,

          "paragraphs": [
            {
              "en": "Against all hope, Abraham in hope believed. . . . Without weakening in his faith. (Romans 4:18–19)",
              "zh": "他在无可指望的时候，因信仍有指望……他的信心还是不软弱。（罗马书4:18-19）",
              "simpEn": "Against all hope, Abraham in hope believed. He did not weaken in his faith.",
              "simpZh": "在完全没有指望的时候，亚伯拉罕仍怀着盼望相信了；他的信心没有软弱。"
            },
            {
              "en": "I will never forget the statement which that great man of faith George Mueller once made to a gentleman who had asked him the best way to have strong faith: \"The only way to know strong faith is to endure great trials. I have learned my faith by standing firm through severe testings.\" How true this is! You must trust when all else fails.",
              "zh": "我永不会忘记那位信心伟人乔治·穆勒，曾对一位问他如何得着刚强信心的人所说的话：「认识刚强信心的唯一方法，就是忍受大试炼。我是借着在严酷的试验中站立得稳，才学会了我的信心。」这是何等真实！当一切都失败时，你必须信靠。",
              "simpEn": "I'll never forget what George Mueller said when asked the best way to have strong faith: 'The only way to know strong faith is to endure great trials. I have learned my faith by standing firm through severe testings.' How true! You must trust when all else fails.",
              "simpZh": "我不会忘记乔治·穆勒被人问及如何有刚强信心时说的话：‘认识刚强信心的唯一方法就是忍受大试炼。我是在严峻的考验中站住，才学会信心的。’多真实！当一切都失败时，你必须信靠。"

              "en": "Dear soul, you may scarcely realize the value of your present situation. If you are enduring great <span class=\"vocab-trigger\" data-vocab=\"afflictions\">afflictions<\/span> right now, you are at the source of the strongest faith. God will teach you during these dark hours to have the most powerful bond to His throne you could ever know, if you will only <span class=\"vocab-trigger\" data-vocab=\"submit\">submit<\/span>. \"Don't be afraid; just believe\" (Mark 5:36). But if you ever are afraid, simply look up and say, \"When I am afraid, I will trust in you\" (Ps. 56:3). Then you will be able to thank God for His school of sorrow that became for you the school of faith. —A. B. Simpson",

              "simpEn": "Dear soul, you may barely realize the value of your present situation. If you are enduring great afflictions right now, you are at the very source of the strongest faith. God will teach you during these dark hours to have the most powerful connection to His throne you could ever know, if you will only submit. 'Don't be afraid; just believe' (Mark 5:36). But if you are afraid, look up and say, 'When I am afraid, I will trust in You' (Ps. 56:3). Then you'll thank God for His school of sorrow that became your school of faith.",
              "simpZh": "亲爱的灵魂，你可能不知道你现在的处境多宝贵。如果你正在忍受大苦难，你就正处在最强信心的源头。只要你顺服，神就要在这些黑暗时刻教你，让你拥有与祂宝座最强力的连结。‘不要怕，只要信。’如果你怕，就向上看说：‘我惧怕的时候要信靠你。’然后你就要感谢神，祂忧伤的学校成了你信心的学校。"
            },
            {
              "en": "Great faith must first endure great trials. God’s greatest gifts come through great pain. Can we find anything of value in the spiritual or the natural realm that has come about without tremendous <span class=\"vocab-trigger\" data-vocab=\"toil and tears\">toil and tears<\/span>? Has there ever been any great reform, any discovery benefiting humankind, or any soul-awakening revival, without the diligence and the shedding of blood of those whose sufferings were actually the <span class=\"vocab-trigger\" data-vocab=\"pangs of its birth\">pangs of its birth<\/span>? For the temple of God to be built, David had to bear intense afflictions. And for the gospel of grace to be <span class=\"vocab-trigger\" data-vocab=\"extricated\">extricated<\/span> from Jewish tradition, Paul’s life had to be one long agony.",
              "zh": "大的信心必须先忍受大的试炼。神最大的恩赐是借着巨大的痛苦而来的。我们能在灵界或自然界中找到任何有价值的事，不是经过极大的劳苦和眼泪而来的吗？有过任何重大的改革，任何造福人类的发现，或任何唤醒灵魂的复兴，是没有经过那些人的殷勤和流血——他们的受苦其实就是它的生产之痛吗？为要建造神的殿，大卫必须承受强烈的苦难。为要使恩典的福音从犹太传统中被解脱出来，保罗的生命必须成为一场漫长的痛楚。",
              "simpEn": "Great faith must first endure great trials. God's greatest gifts come through great pain. Can we find anything valuable in the spiritual or natural world that came without tremendous toil and tears? Has there ever been any great reform, discovery, or revival without the diligence and blood of those whose sufferings were the very birth pangs? For God's temple to be built, David had to bear intense afflictions. And for the gospel of grace to be freed from Jewish tradition, Paul's life had to be one long agony.",
              "simpZh": "大信心必须先忍受大试炼。神最大的恩赐是通过大痛苦来的。在属灵或自然界中，我们找到过什么有价值的东西是不经过巨大的劳苦和眼泪的吗？有过什么重大改革、造福人类的发现或唤醒灵魂的复兴，是不需要那些人的殷勤和流血——他们的受苦其实就是它的生产之痛吗？为要建造神的殿，大卫必须承受极重的苦难。为要让恩典的福音从犹太传统中出来，保罗的一生必须是一场漫长的痛苦。"
            },
            {
              "en": "T ake heart, O weary, burdened one, bowed down <br>Beneath your cross; <br>Remember that your greatest gain may come <br>Through greatest loss. <br>Your life is nobler for a sacrifice, <br>And more divine. <br>Acres of blooms are crushed to make a drop <br>Of perfume fine. <br>Because of storms that lash the ocean waves, <br>The waters there <br>Keep purer than if the heavens o’erhead <br>Were always fair. <br>The brightest banner of the skies floats not <br>At noonday warm; <br>The rainbow follows after thunderclouds, <br>And after storm.",
              "zh": "鼓起勇气吧，哦，疲乏受压、被十架压弯的人；要记得，你最大的收获可能来自最大的损失。你的生命因着牺牲而更加高贵，更加神圣。大片的花朵被压碎，只为制成一滴精细的香膏。因着狂风抽打洋海，那里的水保持得比天空永远晴朗时更纯净。天空最明亮的旗帜不是在温暖的午间飘扬；彩虹乃是在雷云之后，风暴之后出现。",
              "simpEn": "Take heart, O weary, burdened one, bowed down beneath your cross; remember that your greatest gain may come through greatest loss. Your life is nobler for a sacrifice, and more divine. Acres of blooms are crushed to make a drop of fine perfume. Because of storms that lash the ocean waves, the waters keep purer than if the heavens were always fair. The brightest banner of the skies floats not at warm noonday; the rainbow follows after thunderclouds, and after storm.",
              "simpZh": "鼓起勇气，疲乏受压、被十字架压弯的人啊；要记得，最大的收获可能来自最大的损失。你的生命因着牺牲更高贵，更神圣。大片的花朵被压碎，只为制成一滴细香膏。因为狂风抽打海浪，那里的水比天空永远晴朗时更纯净。天空最亮的旗帜不是在温暖的午间飘扬；彩虹是在雷云之后、风暴之后出现的。"

              "simpZh": "你的黑夜是丧亲之夜吗？专注在神身上常会使祂靠近你悲伤的心，让你确信祂需要那位已逝的人。主会让你确信，祂已呼召你离去的亲人那颗热切的灵魂，去站在那看不见却得释放、活着且光芒四射的广大天军之中。当这意念连同知道你爱的人正从事伟大天上使命的认识进入脑海时，一首歌就在你心里开始了。"

              "simpEn": "What then? Shall we sit idly and say the night has come, no longer day? Yet as evening twilight fades, the sky fills with stars invisible to day. A ship's strength is only fully shown when it faces a hurricane, and the gospel's power is only fully displayed when a Christian undergoes a fiery trial. To give songs in the night, God must first make it night.",

              "en": "Trust in the Lord and do good; dwell in the land and enjoy <span class=\"vocab-trigger\" data-vocab=\"safe pasture\">safe pasture<\/span>. (Psalm 37:3)",
