            {
              "en": "I once met a poor woman who earned a <span class=\"vocab-trigger\" data-vocab=\"meager living\">meager living<\/span> through hard <span class=\"vocab-trigger\" data-vocab=\"domestic labor\">domestic labor<\/span> but was a joyful, triumphant Christian. Another Christian lady, who was quite <span class=\"vocab-trigger\" data-vocab=\"sullen\">sullen<\/span>, said to her one day, \"Nancy, I understand your happiness today, but I would think your future <span class=\"vocab-trigger\" data-vocab=\"prospects\">prospects<\/span> would <span class=\"vocab-trigger\" data-vocab=\"sober\">sober<\/span> you. Suppose, for instance, you experience a time of illness and are unable to work. Or suppose your present employers move away, and you cannot find work elsewhere. Or suppose—\" \"Stop!\" cried Nancy. \"I never 'suppose.' 'The Lord is my shepherd, I shall not be in want' [Ps. 23:1]. And besides,\" she added to her gloomy friend, \"it's all that 'supposing' that's making you so miserable. You'd better give that up and simply trust the Lord.\"",
              "zh": "我曾遇见一位贫苦的妇人，靠着辛苦的家务劳作维持微薄生计，却是一位喜乐、得胜的基督徒。另一位性情相当阴郁的基督徒妇人，一天对她说：「南希，我了解你今天的快乐，但我想你未来的前景会让你清醒。比方说，假设你经历一场疾病，无法工作。或者假设你现在的雇主搬走了，你在别处找不到工作。或者假设——」「停止！」南希喊道。「我从不『假设』。『耶和华是我的牧者，我必不致缺乏』（诗23:1）。此外，」她对那位愁闷的朋友补充说，「正是你这一切的『假设』让你如此可怜。你最好放弃那些，只管倚靠主。」",
              "simpEn": "I once met a poor woman who earned a tiny living through hard housework but was a joyful, victorious Christian. Another gloomy Christian lady said to her, 'Nancy, I see your joy today, but I think your future prospects would sober you. Suppose you get sick and can't work. Suppose your employers move away and you can't find another job. Suppose—' 'Stop!' cried Nancy. 'I never suppose. The Lord is my shepherd, I shall not want. Besides,' she added, 'all your supposing is making you miserable. Give it up and just trust the Lord.'",
              "simpZh": "我曾遇见一个穷妇人，靠辛苦做家务活赚一点微薄的生活，却是个喜乐、得胜的基督徒。另一个很阴郁的基督徒妇人对她说：‘南希，我知道你今天快乐，但我想你将来的前景会让你清醒。比方说，假设你生病不能工作了。或者假设你现在的雇主搬走了，你在别处找不到工作。或者假设——’‘停！’南希喊道。‘我从来不假设。耶和华是我的牧者，我必不致缺乏。再说，’她对那位愁闷的朋友说，‘正是你所有这些假设让你这么可怜。你最好放弃那些，单单信靠主。’"

            {

              "zh": "有一道患难之溪横在我路上；又黑又深又宽。将来渡过那翻腾潮水的时刻真是苦楚。但我微笑着歌唱说：「我要永远盼望和信靠；我要担当明日来临的忧伤，但今天绝不借用。」明天的桥是件危险的东西；我不敢现在就走上去。我能看见它的梁木摇摆晃荡，它的拱门旋转弯下。心哪，你必须永远盼望；你必须歌唱、信靠，并且说：「我要担当明日来临的忧伤，但今天绝不借用。」在高空翱翔的鹰，并不忧虑怎样过河。——选",
              "simpEn": "There's a stream of trouble across my path; it is dark and deep and wide. Bitter the hour when I cross its swelling tide. But I smile and sing and say: 'I will hope and trust always; I'll bear the sorrow that comes tomorrow, but I'll borrow none today.' Tomorrow's bridge is dangerous; I dare not cross it now. I see its timbers sway and its arches reel. O heart, hope always; sing and trust and say: 'I'll bear the sorrow that comes tomorrow, but I'll borrow none today.' The eagle that soars at great heights does not worry about crossing a river.",
              "simpZh": "有一道患难的溪横在我路上；又黑又深又宽。将来渡过那翻腾潮水的时刻真是苦楚。但我微笑歌唱说：‘我要永远盼望和信靠；我要担当明天来的忧伤，但今天绝不借用。’明天的桥是危险的东西；我不敢现在就上去。我看见它的梁木摇晃，拱门转来转去。心哪，要永远盼望；要歌唱信靠并说：‘我要担当明天来的忧伤，但今天绝不借用。’在高空翱翔的鹰，并不忧虑怎么过河。"

            {
              "en": "Have you ever seen people who through some disaster were driven to great times of prayer? And have you noticed that once the disaster was long forgotten, a spiritual sweetness remained that warmed their souls? It reminds me of a severe storm I once saw in late spring—one in which darkness covered the sky, except where the lightning violently split the clouds with its thundering power. The wind blew and the rain fell, as though heaven had opened its windows. What <span class=\"vocab-trigger\" data-vocab=\"devastation\">devastation<\/span> there was! The storm uprooted even the strongest of oaks, and not one spiderweb escaped the wind, despite being hidden from view. But soon, after the lightning was gone, the thunder ceased and was silent, and the rain was over; a western wind arose with a sweet and gentle breath, chasing the dark clouds away. I saw the retreating storm throw a scarf of rainbows over her fair shoulders and her glowing neck. She looked back at me, smiled, and then passed from my sight.",
              "zh": "你有没有见过有些人因着某些灾难而被逼到大量祷告的地步？你有没有留意到，当那灾难早已被遗忘之后，却留下一种属灵的甘甜，温暖了他们的灵魂？这让我想起曾在春末见过的一场猛烈风暴——黑暗笼罩天空，只有闪电以雷霆万钧之势猛劈乌云。风狂吹，雨倾盆，仿佛天上的窗户都敞开了。那是何等的毁坏！风暴连最强壮的橡树都连根拔起，没有一张蜘蛛网能逃脱风力，尽管它们藏在隐密处。但不久，闪电过去之后，雷声止息，静默了，雨也住了；一阵西风带着甜美温柔的气息吹起，将乌云赶散。我看见那退去的风暴，将一条彩虹围巾披在她美丽的肩头和发光的颈项上。她回头看了我一眼，微微一笑，然后从我视线中消失了。",
              "simpEn": "Have you seen people driven to prayer by disaster, and after it was long forgotten, a sweet spiritual warmth remained? I remember a fierce late-spring storm: darkness covered the sky, lightning split the clouds, wind blew and rain fell like heaven's windows opened. The storm uprooted the strongest oaks, no spiderweb escaped. But soon the lightning and thunder stopped, rain ended, and a gentle west wind chased the dark clouds away. The retreating storm threw a rainbow scarf over her shoulders, smiled back at me, and passed from sight.",
              "simpZh": "你有没有见过人因灾难被逼到祷告的地步，灾难早被忘了以后，却留下一种属灵的甜美温暖了他们的灵魂？我想起春末一场大风暴：黑暗罩天，闪电劈云，风狂雨暴，好像天开了窗户。风暴连最强壮的橡树都拔起来，没有一张蜘蛛网能躲过风。但不久雷停雨止，一阵温柔的西风吹起，把乌云赶走。退去的风暴把一条彩虹围巾披在肩上，回头对我微笑，然后消失了。"
            },
            {
              "en": "For many weeks after the storm, the fields raised their hands, full of heavenly, fragrant flowers, toward the sky. And all summer long the grass was greener, the streams were filled, and the trees, because of their <span class=\"vocab-trigger\" data-vocab=\"lush foliage\">lush foliage<\/span>, cast a more restful shade. All this—because the storm had come. All this—even though the rest of the earth had long forgotten the storm, its rainbows, and its rain. —Theodore Parker",
              "zh": "风暴之后的许多个星期，田野向天举起双手，满布属天芬芳的花朵。整个夏天，草更绿了，溪流满了，树木因茂密的叶子投下更安息的荫凉。这一切——都是因为风暴曾经来过。这一切——尽管地上其他万物早已忘记了那场风暴、它的彩虹和它的雨。——西奥多·帕克",
              "simpEn": "For weeks after the storm, the fields lifted their hands full of heavenly fragrant flowers toward the sky. All summer the grass was greener, streams were full, and trees with thick leaves cast a more restful shade. All this because the storm had come—though the rest of the earth had long forgotten the storm, its rainbows, and its rain.",
              "simpZh": "风暴后许多星期，田野向天举起手来，满是属天的芬芳花朵。整个夏天草更绿了，溪流满了，树木因茂密的叶子投下更安息的荫凉。这一切都是因为风暴曾来过——虽然地上其他万物早已忘记了那场风暴、它的彩虹和雨水。"
            },
            {
              "en": "God may not give us an easy journey to the Promised Land, but He will give us a safe one. —Horatius Bonar <br>It was a storm that led to the discovery of the gold mines in India. Have we not seen storms drive people to the discovery of the priceless mines of the love of God in Christ?",
              "zh": "神或许不会给我们一条通往应许之地的轻松旅程，但祂必给我们一条安全的。——赫雷修斯·波纳。是一场风暴导致了印度金矿的发现。我们岂没有见过风暴驱使人发现神在基督里那无价之爱的矿藏吗？",
              "simpEn": "God may not give an easy journey to the Promised Land, but He will give a safe one. —Horatius Bonar. A storm led to the discovery of India's gold mines. Haven't we seen storms drive people to discover the priceless mines of God's love in Christ?",
              "simpZh": "神可能不给我们一条去应许地的容易路，但必给一条安全的路。—波纳。一场风暴导致了印度金矿的发现。我们不是也见过风暴驱使人发现神在基督里那无价之爱的矿藏吗？"
            },
            {
              "en": "Is it raining, little flower? <br>Be glad of rain; <br>Too much sun would wither one; <br>It will shine again. <br>The clouds are very dark, it's true; <br>But just behind them shines the blue. <br>Are you weary, tender heart? <br>Be glad of pain: <br>In sorrow, sweetest virtues grow, <br>As flowers in rain. <br>God watches, and you will have sun, <br>When clouds their perfect work have done. <br>—Lucy Larcom",
              "zh": "下雨了吗，小花儿？要为雨水高兴；太多的阳光会使人枯萎；太阳必再照耀。乌云确实很黑；但就在它们背后，蓝天生辉。温柔的心，你疲倦了吗？要为疼痛高兴：在忧伤中，最甜美的美德成长，如花在雨中。神在察看，当乌云完成它们完美的工作时，你必有阳光。——露西·拉科姆",
              "simpEn": "Is it raining, little flower? Be glad of rain; too much sun would wither you; it will shine again. The clouds are very dark, it's true; but just behind them shines the blue. Are you weary, tender heart? Be glad of pain: in sorrow, sweetest virtues grow, as flowers in rain. God watches, and you will have sun when clouds have done their perfect work.",
              "simpZh": "下雨了吗，小花儿？要为雨水高兴；太多阳光会让你枯萎；太阳会再照耀。云很黑，没错；但云后就是蓝天。温柔的心，你累了吗？要为疼痛高兴：在忧伤中，最甜美的美德成长，像花在雨中。神在看，当云完成了完美的工作，你必有阳光。"
            }

          "sectionId": 4,
          "heading": "June 13",
          "audio": "audio/Streams in the Desert - June 13.m4a",
          "paragraphs": [
            {
              "en": "My peace I give you. (John 14:27)",
              "zh": "我留下平安给你们。（约翰福音14:27）",
              "simpEn": "My peace I give to you.",
              "simpZh": "我把我的平安赐给你们。"
            },
            {
              "en": "Two painters were once asked to paint a picture illustrating his own idea of rest. The first chose for his scene a quiet, lonely lake, nestled among mountains far away. The second, using swift, broad strokes on his canvas, painted a thundering waterfall. Beneath the falls grew a fragile birch tree, bending over the foam. On its branches, nearly wet with the spray from the falls, sat a robin on its nest. The first painting was simply a picture of <span class=\"vocab-trigger\" data-vocab=\"stagnation\">stagnation<\/span> and inactivity. The second, however, <span class=\"vocab-trigger\" data-vocab=\"depicted\">depicted<\/span> rest.",
              "zh": "曾有两名画家被请去各画一幅代表自己心目中安息之意的画。第一位选了一幅远山环抱中静谧孤寂的湖为景。第二位，用迅捷宽阔的笔触在画布上画了一道轰然倾泻的瀑布。瀑布下长着一棵纤弱的桦树，弯向飞沫之上。在它的枝头上，几乎被瀑布水花溅湿之处，坐着一只知更鸟在巢上。第一幅画仅仅是停滞与不活动的景象。而第二幅画则描绘了安息。",
              "simpEn": "Two painters were asked to paint their idea of rest. The first painted a quiet, lonely lake nestled in faraway mountains. The second painted a thundering waterfall. Beneath it, a fragile birch bent over the foam, and on its branches, nearly wet with spray, sat a robin on its nest. The first picture was just stagnation. The second depicted real rest.",
              "simpZh": "两个画家被请去画自己心目中的安息。第一个画了远山环抱中一个安静孤单的湖。第二个画了一道轰隆隆的瀑布。瀑布下有一棵细弱的桦树弯向水花，树枝上，差不多被水花溅湿的地方，坐着一只知更鸟在巢上。第一幅画只是停滞。第二幅画描绘了真正的安息。"
            },
            {
              "en": "Outwardly, Christ endured one of the most troubled lives ever lived. Storms and <span class=\"vocab-trigger\" data-vocab=\"turmoil\">turmoil<\/span>, turmoil and storms—wave after wave broke over Him until His worn body was laid in the tomb. Yet His inner life was as smooth as a sea of glass, and a great calm was always there. Anyone could have gone to Him at any time and found rest. Even as the human bloodhounds were <span class=\"vocab-trigger\" data-vocab=\"dogging\">dogging<\/span> Him in the streets of Jerusalem, He turned to His disciples, offering them a final <span class=\"vocab-trigger\" data-vocab=\"legacy\">legacy<\/span>: \"My peace.\"",
              "zh": "外表上，基督承受了有史以来最受搅扰的生命之一。风暴与混乱，混乱与风暴——一波又一波打在他身上，直到他疲损的身体被安放在坟墓里。然而祂的内在生命却平滑如玻璃海，一种极大的平静始终在那里。任何人都可以在任何时候到祂那里找到安息。甚至当那些属人的猎犬在耶路撒冷街道上紧紧追踪祂时，祂仍转向门徒，将一份最后的遗产赐给他们：「我的平安。」",
              "simpEn": "Outwardly, Christ had one of the most troubled lives ever. Storms and turmoil, wave after wave, broke over Him until His worn body was laid in the tomb. Yet His inner life was as smooth as a sea of glass, with a great calm always present. Anyone could come to Him at any time and find rest. Even as His enemies tracked Him in Jerusalem, He offered His disciples His final gift: 'My peace.'",
              "simpZh": "外表上，基督过的是最艰难的生活之一。风暴混乱一波接一波打在祂身上，直到祂疲累的身体被放进坟墓。然而祂内在的生命平滑如玻璃海，一直有极大的平静。任何人随时到祂那里都能找到安息。甚至当仇敌在耶路撒冷街上紧紧追踪祂时，祂还转身给门徒最后的礼物：‘我的平安。’"
            },
            {
              "en": "Rest is not some holy feeling that comes upon us in church. It is a state of calm rising from a heart deeply and firmly established in God. —Henry Drummond <br>My peace I give in times of deepest grief, <br>Imparting calm and trust and My relief. <br>My peace I give when prayer seems lost, unheard; <br>Know that My promises are ever in My Word. <br>My peace I give when you are left alone— <br>The nightingale at night has sweetest tone. <br>My peace I give in times of utter loss, <br>The way of glory leads right to the cross. <br>My peace I give when enemies will blame, <br>Your fellowship is sweet through cruel shame. <br>My peace I give in agony and sweat, <br>For My own brow with bloody drops was wet. <br>My peace I give when nearest friend betrays— <br>Peace that is merged in love, and for them prays. <br>My peace I give when there's but death for thee— <br>The gateway is the cross to get to Me. <br>—L. S. P.",
              "zh": "安息并不是某种在教堂中临到我们的圣洁感觉。它是一种从深深且坚固扎根在神里面的心中升起的平静状态。——亨利·德拉蒙德。我的平安，在最深的忧伤中赐下，给予平静、信赖和我的释放。我的平安，在祷告似乎失落、未蒙垂听时赐下；要知道我的应许都在我的话中。我的平安，在你被撇下独自一人时赐下——夜莺在夜间有最甜美的音调。我的平安，在全然损失的时候赐下，荣耀的道路直通到十字架。我的平安，在仇敌指责时赐下，你的相交在残酷的羞辱中甘甜。我的平安，在痛苦与汗水中赐下，因我的额头也曾滴下血珠。我的平安，在至近的朋友出卖时赐下——那融在爱中并为他们祷告的平安。我的平安，在你只有一死时赐下——十字架是到我这里来的门。——L. S. P.",
              "simpEn": "Rest is not a holy feeling in church. It is a calm from a heart firmly established in God. —Henry Drummond. My peace I give in deepest grief, giving calm and trust. My peace I give when prayer seems unheard; My promises are ever in My Word. My peace I give when left alone—the nightingale sings sweetest at night. My peace I give in utter loss; the way of glory leads to the cross. My peace I give when enemies blame; your fellowship is sweet through shame. My peace I give in agony and sweat, for My own brow was wet with bloody drops. My peace I give when a nearest friend betrays—peace merged in love, and prays. My peace I give when there's but death for you—the cross is the gateway to Me.",
              "simpZh": "安息不是教里的一种圣洁感觉，乃是从深深坚固在神里面的心中升起的平静。—亨利·德拉蒙德。我的平安，在最深的忧伤中赐下，给予平静和信靠。我的平安，在祷告似乎没被听见时赐下；我的应许都在我的话中。我的平安，在你独自一人时赐下——夜莺在夜间唱得最甜。我的平安，在全然损失时赐下，荣耀之路直通到十字架。我的平安，在仇敌指责时赐下，你的相交在残酷羞辱中甘甜。我的平安，在痛苦汗水中赐下，因我的额头也曾滴下血珠。我的平安，在至近朋友出卖时赐下——那融在爱中并为他们祷告的平安。我的平安，在你只有一死时赐下——十字架是到我这里来的门。"
            }

        {

          "paragraphs": [
            {
              "en": "I have prayed for you ... that your faith may not fail. (Luke 22:32)",
              "zh": "但我已经为你祈求，叫你不至于失了信心。（路加福音22:32）",
              "simpEn": "I have prayed for you that your faith may not fail.",

            },
            {
              "en": "Dear Christian, remember to take good care of your faith, for faith is the only way to obtain God's blessings. Prayer alone cannot bring answers down from His throne, because it is the <span class=\"vocab-trigger\" data-vocab=\"earnest prayer\">earnest prayer<\/span> of one who believes that leads to answers. Faith is the communication link between heaven and earth. It is on this link of faith that God's messages of love travel so quickly that even before we ask, He answers. And while we are still speaking, \"he hears us\" (1 John 5:14). So when the connection of faith is broken, how will we obtain His promises?",
              "zh": "亲爱的基督徒，要记得好好保守你的信心，因为信心是得着神祝福的唯一途径。单靠祷告不能从祂宝座带下答复，因为是那相信之人的恳切祷告带来了答案。信心是天地之间的通信链。正是在这信心之链上，神的慈爱信息传递得如此之快，甚至在我们尚未求之前，祂就已答复。我们还在说话的时候，「祂已听见」（约壹5:14）。所以当信心之链断开时，我们怎能得着祂的应许呢？",
              "simpEn": "Dear Christian, take good care of your faith, for faith is the only way to receive God's blessings. Prayer alone can't bring answers from His throne; it's the earnest prayer of one who believes that leads to answers. Faith is the communication link between heaven and earth. On this link, God's messages of love travel so fast that even before we ask, He answers. While we are still speaking, He hears us (1 John 5:14). If the link is broken, how can we get His promises?",
              "simpZh": "亲爱的基督徒，要好好保守你的信心，因为信心是得着神祝福的唯一方法。单靠祷告不能从宝座带下答案；是那相信之人的恳切祷告带来了答案。信心是天地之间的通信连接。在这信心的连接上，神爱的信息传递得极快，甚至我们还没求祂就回答了。我们还在说话时祂已听见（约壹5:14）。如果连接断了，我们怎能得到祂的应许呢？"
            },
            {
              "en": "Am I in trouble? I can receive help by expressing faith. Am I being <span class=\"vocab-trigger\" data-vocab=\"battered\">battered<\/span> by the Enemy? My soul will find <span class=\"vocab-trigger\" data-vocab=\"refuge\">refuge<\/span> by leaning in faith upon God. But without faith, I call to Him in vain, for faith is the only road between my soul and heaven. If the road is blocked, how can I communicate with the great King? Faith links me to Holy God and clothes me with the power of Jehovah. Faith insures me that each of His attributes will be used in my defense, helping me to <span class=\"vocab-trigger\" data-vocab=\"defy\">defy<\/span> the hosts of hell. It causes me to march <span class=\"vocab-trigger\" data-vocab=\"triumphantly\">triumphantly<\/span> over the necks of my enemies. So without faith, how can I receive anything from the Lord?",
              "zh": "我是否在患难中？我可以借着运用信心得着帮助。我是否被仇敌击打？我的灵魂能借着凭信心倚靠神找到避难所。但若没有信心，我呼求祂也是徒然，因为信心是我的灵魂与天堂之间唯一的路。若道路被堵住，我怎能与那位大君王交通呢？信心将我与圣洁的神连结，并给我穿上耶和华的能力。信心保证我，祂的每一属性都要用来为我辩护，帮助我向地狱的军旅夸胜。它使我得胜地践踏仇敌的颈项。所以没有信心，我怎能从主那里得着什么呢？",
              "simpEn": "Am I in trouble? I can receive help by showing faith. Am I battered by the Enemy? My soul finds refuge by leaning in faith on God. Without faith, I call to Him in vain; faith is the only road between my soul and heaven. If the road is blocked, how can I talk with the great King? Faith links me to God and clothes me with His power. Faith makes sure that all God's attributes defend me, helping me defy the hosts of hell. It makes me march triumphantly over my enemies. So without faith, how can I receive anything from the Lord?",
              "simpZh": "我在患难中吗？我可以借着表现出信心得到帮助。我被仇敌击打吗？我的灵魂借着凭信心倚靠神找到避难所。没有信心，我呼求祂是徒然的，因为信心是我的灵魂与天堂之间唯一的路。路若被堵住，我怎能与那位大君王通信呢？信心把我与圣洁的神连结，给我穿上耶和华的能力。信心确保神的每一属性都为我辩护，帮助我蔑视地狱的军兵。它使我凯旋地践踏仇敌的颈项。所以没有信心，我怎能从主那里得着什么？"
            },
            {
              "en": "Therefore, O Christian, carefully watch your faith. \"Everything is possible for him who believes\" (Mark 9:23). —Charles H. Spurgeon <br>We as a people take such pride in being so practical that we want something more sure than faith. Yet Paul said, \"The promise comes by FAITH, so that it may ... be GUARANTEED\" (Rom. 4:16). —Daniel Crawford <br>Faith honors God, and God honors faith.",
              "zh": "所以，基督徒啊，要小心看顾你的信心。「在信的人，凡事都能」（可9:23）。——查尔斯·哈丁·司布真。我们这群人如此自豪于务实，以至于想要比信心更确实的东西。然而保罗说：「人得为后嗣是本于信，因此就属乎恩，叫应许定然归给一切后裔」（罗4:16）。——但以理·克劳福德。信心荣耀神，神也荣耀信心。",
              "simpEn": "Therefore, Christian, guard your faith carefully. 'Everything is possible for him who believes' (Mark 9:23). —Spurgeon. We pride ourselves on being practical and want something surer than faith. Yet Paul said, 'The promise comes by faith, so that it may be guaranteed' (Rom. 4:16). —Daniel Crawford. Faith honors God, and God honors faith.",
              "simpZh": "所以基督徒，小心看守你的信心。‘在信的人，凡事都能’（可9:23）。—司布真。我们以务实为傲，想要比信心更确定的东西。但保罗说：‘人得为后嗣是本于信，叫应许定然归给后裔。’—但以理·克劳福德。信心荣耀神，神也荣耀信心。"
            }

        {
          "sectionId": 6,

          "audio": "audio/Streams in the Desert - June 15.m4a",
          "paragraphs": [
            {
              "en": "God has made me <span class=\"vocab-trigger\" data-vocab=\"fruitful\">fruitful<\/span> in the land of my suffering. (Genesis 41:52)",
              "zh": "神使我在受苦的地方昌盛。（创世记41:52）",
              "simpEn": "God has made me fruitful in the land of my suffering.",
              "simpZh": "神使我在受苦的地方多结果子。"
            },
            {
              "en": "A poet stands by the window watching a summer shower. It is a fierce <span class=\"vocab-trigger\" data-vocab=\"downpour\">downpour<\/span>, beating and pounding the earth. But the poet, in his mind's eye, sees more than a rain shower falling. He sees a <span class=\"vocab-trigger\" data-vocab=\"myriad\">myriad<\/span> of lovely flowers raining down, soon breaking forth from the freshly watered earth, and filling it with their <span class=\"vocab-trigger\" data-vocab=\"matchless beauty\">matchless beauty<\/span> and <span class=\"vocab-trigger\" data-vocab=\"fragrance\">fragrance<\/span>. And so he sings: <br>It isn't raining rain to me—it's raining daffodils; <br>In every dripping drop I see wildflowers upon the hills. <br>A cloud of gray engulfs the day, and overwhelms the town; <br>It isn't raining rain to me—it's raining roses down.",
              "zh": "一位诗人站在窗边观看夏日阵雨。那是猛烈的倾盆大雨，击打冲撞着大地。但诗人在他的想象中，看见的不只是一场降雨。他看见无数可爱的花朵正降下，即将从新近受洗的大地中破土而出，并以它们无比的美丽和芬芳充满大地。于是他歌唱道：对我来说下的不是雨——下的是水仙花；在每一滴雨珠中我看见山上的野花。灰云吞没了白昼，淹没了城镇；对我来说下的不是雨——下的是玫瑰花。",
              "simpEn": "A poet watches a fierce summer rain beating the earth. But in his mind, he sees not just rain—he sees a myriad of lovely flowers raining down, soon to burst from the watered earth, filling it with matchless beauty and fragrance. He sings: It isn't raining rain to me—it's raining daffodils; in every dripping drop I see wildflowers on the hills. A gray cloud engulfs the day and overwhelms the town; it isn't raining rain to me—it's raining roses down.",
              "simpZh": "一个诗人站在窗边看夏天的大雨，凶猛地击打大地。但在他心里，他看见的不只是雨——他看见无数可爱的花正降下来，很快要从刚被浇灌过的土里破土而出，用无比的美丽和香气充满大地。于是他唱：对我来说下的不是雨——下的是水仙花；在每一滴雨珠里我看见山上的野花。灰云吞没了白天，淹没了城镇；对我来说下的不是雨——下的是玫瑰花。"
            },
            {
              "en": "Perhaps you are undergoing some trial as God's child, and you are saying to Him, \"O God, it is raining very hard on me tonight, and this test seems beyond my power to endure. Disappointments are pouring in, washing away and utterly defeating my chosen plans. My trembling heart is grieved and is <span class=\"vocab-trigger\" data-vocab=\"cowering\">cowering<\/span> at the intensity of my suffering. Surely the rains of <span class=\"vocab-trigger\" data-vocab=\"affliction\">affliction<\/span> are beating down upon my soul.\" Dear friend, you are completely mistaken. God is not raining rain on you—He is raining blessings. If you will only believe your Father's Word, you will realize that springing up beneath the pounding rain are spiritual flowers. And they are more beautiful and fragrant than those that ever grew before in your stormless and suffering-free life.",
              "zh": "或许作为神的儿女，你正经历某些试炼，你对祂说：「神啊，今夜雨打在我身上极为猛烈，这试验似乎超过我所能忍受的。失望正在倾盆而入，冲走并彻底击败了我所选择的计划。我颤抖的心因苦难的强烈而忧戚退缩。苦难的暴雨确然正在击打我的灵魂。」亲爱的朋友，你完全错了。神没有在向你降雨——祂在降福。只要你肯相信父神的话，你就会发现在那猛烈雨点的击打下，正萌发出属灵的花朵。而且它们比你从前那无风暴、无苦难的生命中曾生长过的更加美丽、更加芬芳。",
              "simpEn": "Perhaps as God's child you're going through a trial and you say, 'O God, it's raining very hard on me tonight; this test seems beyond my strength. Disappointments are pouring in, washing away my plans. My trembling heart cowers at the pain. The rains of affliction are beating down on my soul.' Dear friend, you are mistaken. God is not raining rain on you—He is raining blessings. If you believe your Father's Word, you'll realize that beneath the pounding rain, spiritual flowers are springing up, more beautiful and fragrant than any that grew in your stormless, pain-free life.",
              "simpZh": "也许你作为神的儿女正在经历试炼，你对神说：‘神啊，今夜雨打在我身上太猛了，这试验似乎超过我能忍受的。失望正倾盆倒入，冲走了我的计划。我颤抖的心因痛苦而退缩。苦难的雨正击打着我的灵魂。’亲爱的朋友，你错了。神不是在下雨——祂是在降福。你若肯相信父神的话，就会发现猛雨击打下正萌发出属灵的花朵，比你从前无风暴无痛苦的生命中曾开过的花更美丽更香。"
            },
            {
              "en": "Y ou can see the rain, but can you also see the flowers? You are suffering through these tests, but know that God sees sweet flowers of faith springing up in your life beneath these very trials. You try to escape the pain, yet God sees tender compassion for other sufferers finding birth in your soul. Your heart <span class=\"vocab-trigger\" data-vocab=\"winces\">winces<\/span> at the pain of heavy grief, but God sees the sorrow deepening and enriching your life. No, my friend, it is not raining afflictions on you. It is raining tenderness, love, compassion, patience, and a thousand other flowers and fruits of the blessed Holy Spirit. And they are bringing to your life spiritual <span class=\"vocab-trigger\" data-vocab=\"enrichment\">enrichment<\/span> that all the prosperity and ease of this world could never produce in your <span class=\"vocab-trigger\" data-vocab=\"innermost being\">innermost being<\/span>. —J. M. M.",
              "zh": "你能看见雨，但也能看见花吗？你正在这些试验中受苦，但要知道，神看见在你生命中这些试炼之下正萌发出信心的甜美花朵。你试图逃避疼痛，但神看见对其他受苦者的温柔怜恤正在你灵魂中诞生。你的心因沉重的忧伤而畏缩，但神看见这忧伤正在加深和丰富你的生命。不，我的朋友，神没有降下患难之雨。祂正在降下温柔、爱、怜恤、忍耐，以及蒙福圣灵的千百种其他花朵和果实。它们正带给你生命属灵的丰盛，是这个世界一切的昌盛与安逸永远无法在你最深处产生的。——J. M. M.",
              "simpEn": "You can see the rain, but can you see the flowers? You are suffering, but know that God sees sweet flowers of faith springing up under these very trials. You try to escape pain, but God sees tender compassion for other sufferers being born in your soul. Your heart winces at heavy grief, but God sees the sorrow deepening and enriching your life. No, it is not raining afflictions on you. It is raining tenderness, love, compassion, patience, and a thousand other flowers and fruits of the blessed Holy Spirit, bringing spiritual enrichment that all the prosperity and ease of this world could never produce in your innermost being.",
              "simpZh": "你看见雨，但你也看见花吗？你在受苦，但要知道神看见在这些试炼下正萌发出信心的甜美花朵。你逃避疼痛，但神看见对其他受苦者的温柔怜恤正在你灵魂中诞生。你的心因重忧而畏缩，但神看见忧伤正在加深并丰富你的生命。不，神没有降患难之雨给你。祂在降下温柔、爱、怜恤、忍耐，以及圣灵千百种其他的花朵和果实，带给你属灵的丰盛，是这世界一切昌盛安逸永不能在你内心最深处产生的。"
            },
            {
              "en": "Songs across the Storm <br>A harp stood in the calm, still air, <br>Where showers of sunshine washed a thousand fragrant blooms; <br>A traveler bowed with loads of care <br>Struggled from morning till the dusk of evening glooms <br>To strum sweet sounds from the songless strings; <br>The pilgrim strives in vain with each <span class=\"vocab-trigger\" data-vocab=\"unanswering chord\">unanswering chord<\/span>, <br>Until the tempest's thunder sings, <br>And, moving on the storm, the fingers of the Lord <br>A wondrous melody awakes; <br>And though the battling winds their soldier deeds perform, <br>Their <span class=\"vocab-trigger\" data-vocab=\"trumpet-sound\">trumpet-sound<\/span> brave music makes <br>While God's assuring voice sings love across the storm.",
              "zh": "风暴中的歌。一架琴立在平静的空气中，那里阵雨般的阳光浇洗着千万朵芬芳的花朵；一位压着重担的旅人，从清晨挣扎到暮色阴沉，想要从无歌的弦上弹出甜美的乐音；天路客徒然弹着每一根不响的弦，直到暴风的雷轰唱起，而主的指头行在风暴之上，唤醒一曲奇妙的旋律；虽然争战的狂风行使它们战士的作为，它们的号角之声奏出勇敢的音乐，同时神那保证的声音越过风暴唱着爱。",
              "simpEn": "Songs across the Storm. A harp stood in the calm air where sunshine showers washed a thousand fragrant blooms; a traveler bowed with loads of care struggled from morning till evening gloom to play sweet sounds from the songless strings. The pilgrim strives in vain with each unanswering chord, until the tempest's thunder sings, and, moving on the storm, the fingers of the Lord awake a wondrous melody. And though the battling winds perform their soldier deeds, their trumpet-sound makes brave music while God's assuring voice sings love across the storm.",
              "simpZh": "风暴中的歌。一架琴立在平静的空气中，那里太阳光的阵雨浇洗千万朵香花；一个被重担压弯的旅人从早挣扎到晚，想从无歌的弦上弹出甜美的声音；天路客徒然弹着每一根不响的弦，直到暴风的雷轰唱起来，而主的手指在风暴上运行，唤醒奇妙的旋律。虽然争战的狂风作它们战士的工，它们的号角声奏出勇敢的音乐，同时神保证的声音越过风暴唱着爱。"
            }

            {
              "en": "So often we simply neglect to look for the answers to what we have asked, which shows the lack of <span class=\"vocab-trigger\" data-vocab=\"earnestness\">earnestness<\/span> in our <span class=\"vocab-trigger\" data-vocab=\"petitions\">petitions<\/span>. A farmer is never content until he reaps a harvest; a <span class=\"vocab-trigger\" data-vocab=\"marksman\">marksman<\/span> observes whether or not his bullet has hit the target; and a physician examines the effect of the medicine he prescribes. Should a Christian be any less careful regarding the effect of his labor in prayer?",
              "zh": "我们常常忽略去查看我们所求之事的答复，这表明我们的祈求缺乏恳切之心。农夫收割了庄稼才会满足；射手会观察子弹是否命中靶子；医生会检查他所开药方的效果。基督徒对于他在祷告上劳苦的功效，岂可不比这些更留心呢？",
              "simpEn": "We often neglect to look for answers to our prayers, which shows a lack of earnestness. A farmer isn't content until he reaps a harvest; a marksman watches to see if his bullet hits the target; a doctor checks the effect of his medicine. Should a Christian be any less careful about the effect of his prayer?",
              "simpZh": "我们常常忽略了去查看祷告的答复，这表明我们的祈求不够恳切。农夫收了庄稼才满意；射手要看子弹是否中靶；医生要检查药效。基督徒岂可对他祷告劳苦的效果更不在乎呢？"

            {
              "en": "Every prayer of the Christian, whether for <span class=\"vocab-trigger\" data-vocab=\"temporal\">temporal<\/span> or spiritual blessings, will be fully answered if it meets certain biblical requirements. It must be prayed in faith and in accordance with God's will. It must rely on God's promise, be offered up in the name of Jesus Christ, and be prayed under the influence of the Holy Spirit.",
              "zh": "基督徒的每一个祷告，无论是为今生的还是属灵的祝福，只要符合某些圣经的条件，就必完全得着答复。它必须凭着信心，并照着神的旨意祈求。它必须倚靠神的应许，奉耶稣基督的名献上，并在圣灵的影响中祈祷。",
              "simpEn": "Every Christian prayer, whether for material or spiritual blessings, will be fully answered if it meets certain biblical requirements. It must be prayed in faith and according to God's will. It must rely on God's promise, be offered in Jesus' name, and be prayed under the Spirit's influence.",
              "simpZh": "基督徒的每一个祷告，不管是为今生还是属灵的祝福，只要符合圣经的条件，就必全然蒙应允。必须凭信心、按神的旨意求，必须倚靠神的应许，奉耶稣的名献上，在圣灵的影响下祷告。"
            },
            {
              "en": "God always answers the general intent of His people's prayers. He does so not only to reveal His own glory but also to provide for the Christian's spiritual and eternal <span class=\"vocab-trigger\" data-vocab=\"welfare\">welfare<\/span>. Since we see in Scripture that Jesus Christ never rejected even a single <span class=\"vocab-trigger\" data-vocab=\"petitioner\">petitioner<\/span> who came to Him, we can believe that no prayer made in His name will be in vain.",
              "zh": "神总是垂听祂百姓祷告的总意。祂这样做，不仅是为彰显祂自己的荣耀，也是为供应基督徒属灵和永远的福祉。既然我们在圣经中看到耶稣基督从不拒绝任何一个到祂面前来的祈求者，我们就可以相信，凡奉祂名所作的祷告，没有一个是徒然的。",
              "simpEn": "God always answers the general intent of His people's prayers. He does this to reveal His glory and to provide for our spiritual and eternal welfare. Since Jesus never rejected a single person who came to Him, we can believe that no prayer made in His name will be in vain.",
              "simpZh": "神总是应允祂百姓祷告的总意。祂这样做，是为彰显自己的荣耀，也是为供应基督徒属灵和永远的福祉。既然圣经里耶稣从未拒绝任何一个到祂面前来的人，我们就可以相信，凡奉祂名求的，没有一个是徒然的。"
            },
            {
              "en": "The answer to our prayer may be coming, although we may not <span class=\"vocab-trigger\" data-vocab=\"discern\">discern<\/span> its approach. A seed that is underground during winter, although hidden and seemingly dead and lost, is nevertheless taking root for a later spring and harvest. —Bickersteth <br>Delayed answers to prayer are not only trials of faith; they also give us opportunities to honor God through our <span class=\"vocab-trigger\" data-vocab=\"steadfast\">steadfast<\/span> confidence in Him even when facing the apparent denial of our request. —Charles H. Spurgeon",
              "zh": "我们祷告的答复可能正在来临，虽然我们可能察觉不到它的接近。一粒冬天的种子虽在地底下，隐藏不见，似乎死了、失落了，却正在扎根，为后来的春天和收成作准备。——比克斯泰斯。延迟的答复不仅是信心的试炼；也给我们机会，在面对似乎被拒绝之时，仍以对祂坚定不移的信靠来荣耀神。——查尔斯·哈丁·司布真",
              "simpEn": "The answer may be coming, though we may not see it. A seed underground in winter, hidden and seemingly dead, is taking root for a later spring and harvest. —Bickersteth. Delayed answers are trials of faith but also chances to honor God by steadfast confidence even when facing apparent denial. —Spurgeon",

    {
      "id": 25,
      "title": "June 17–23",
      "sections": [
        {
          "sectionId": 1,
          "heading": "June 17",
          "audio": "audio/Streams in the Desert - June 17.m4a",
          "paragraphs": [
            {
              "en": "Then there came a voice from above the <span class=\"vocab-trigger\" data-vocab=\"expanse\">expanse<\/span> over their heads as they stood with <span class=\"vocab-trigger\" data-vocab=\"lowered wings\">lowered wings<\/span>. (Ezekiel 1:25)",
              "zh": "在他们头以上的穹苍之上有声音。他们站住的时候，便将翅膀垂下。（以西结书1:25）",
              "simpEn": "A voice came from above the space over their heads as they stood with their wings lowered.",
              "simpZh": "从他们头顶上的穹苍有声音传来，那时他们站着把翅膀放下来。"
            },
            {
              "en": "What is the significance of these words: \"They stood with lowered wings\"? People often ask, \"How can I hear the voice of the Lord?\" This is the secret: these \"living creatures\" (v. 5) heard the voice when \"they stood with lowered wings.\" We have all seen a bird <span class=\"vocab-trigger\" data-vocab=\"flutter\">flutter<\/span> its wings while standing in place. But in this verse, we are told that \"there came a voice ... as they stood with lowered wings.\" Do you ever sit, or even kneel, before the Lord and yet are conscious of a <span class=\"vocab-trigger\" data-vocab=\"fluttering in your spirit\">fluttering in your spirit<\/span>? If so, you are not exhibiting a sense of genuine <span class=\"vocab-trigger\" data-vocab=\"stillness\">stillness<\/span> while in His presence.",
              "zh": "「他们站住的时候，便将翅膀垂下」这句话有什么意义？人们常问：「我怎能听见主的声音？」这就是秘诀：这些「活物」（5节）是在「站住且垂下翅膀」时听见声音的。我们都见过一只鸟原地站着时扑腾翅膀。但这节经文告诉我们「有声音……当他们垂下翅膀站着的时候」。你是否曾在主面前坐着，甚至跪着，却意识到灵里有一种扑腾？如果是这样，你并没有在祂同在中表现出真正安静的样子。",
              "simpEn": "What does 'they stood with lowered wings' mean? People ask how to hear God's voice. The secret: these living creatures heard the voice when their wings were lowered. A bird flutters while standing; but here the voice came when the wings were still. Do you feel a fluttering inside while praying? Then you are not truly still in God's presence.",
              "simpZh": "‘他们垂下翅膀站着’是什么意思？人们常问怎样才能听见神的声音。秘密就在这：那些活物垂下翅膀站着的时候听见了声音。鸟站着的时候会扑腾翅膀，但这里说声音是在翅膀垂下时来的。你祷告时心里是不是也扑腾不停？那样你就没有在神面前真正安静。"
            },
            {
              "en": "A dear person told me of this very thing a few days ago. \"I prayed about a certain thing,\" she said, \"but I did not wait for the answer to come.\" She did not get still enough to hear God speak but instead went away and followed her own thinking in the matter. The result proved disastrous, and she was forced to <span class=\"vocab-trigger\" data-vocab=\"retrace her steps\">retrace her steps<\/span>. Oh, how much energy we waste! How much time we lose by refusing to lower the wings of our spirit and become totally quiet before Him! Imagine the calm, the rest, and the peace that will come as we wait in His presence until we hear from Him! Then, and only then, we too may speed \"back and forth like flashes of lightning\" (v. 14), going directly to \"wherever the spirit would go\" (v. 20).",
              "zh": "几天前一位亲爱的朋友告诉了我恰恰这件事。「我为某件事祷告，」她说，「但我没有等候答复来到。」她没有足够安静去听见神说话，反而走开，在这事上跟随自己的思想。结果证明是灾难性的，她不得不重新回头走。哦，我们浪费了多少精力！因着不肯垂下灵里的翅膀在祂面前完全安静，我们丧失了多少时间！想象一下，当我们在祂同在中等候直到听见祂的声音时，那将要临到的安宁、安息和平安！然后，也只有在那时，我们才能「往来好像电光一闪」（14节），直往「灵往哪里去，他们就往哪里去」（20节）。",
              "simpEn": "A friend told me she prayed about something but didn't wait for the answer. She wasn't still enough to hear God and followed her own thinking. The result was a disaster and she had to go back. How much energy we waste by refusing to lower our spirit's wings and be quiet before God! Imagine the calm, rest, and peace that will come when we wait in His presence until we hear from Him. Only then can we move as fast as lightning, going wherever the Spirit leads.",
              "simpZh": "一位朋友告诉我她为某件事祷告了，但没有等候答复。她没有安静下来听神说话，反而按自己的想法去做了。结果很糟糕，她不得不回头。我们因不肯垂下灵里的翅膀在神面前安静，浪费了多少精力和时间！想想看，我们若在神面前等候直到听见祂的声音，那会带来何等的安宁、安息和平安！只有到那时，我们才能像闪电一样迅速往来，灵往哪里去就往哪里去。"
            },
            {
              "en": "Be still! Just now be still! <br>Something your soul has never heard, <br>Something unknown to any song of bird, <br>Something unknown to any wind, or wave, or star, <br>A message from the Father's land afar, <br>That with sweet joy the <span class=\"vocab-trigger\" data-vocab=\"homesick soul\">homesick soul<\/span> will thrill, <br>And comes to you only when you're still. <br>Be still! Just now be still! <br>There comes a presence very mild and sweet; <br>White are the sandals of His <span class=\"vocab-trigger\" data-vocab=\"noiseless feet\">noiseless feet<\/span>. <br>It is the <span class=\"vocab-trigger\" data-vocab=\"Comforter\">Comforter<\/span> whom Jesus sent <br>To teach you what the words He uttered meant. <br>The willing, waiting spirit, He does fill. <br>If you would hear His message, <br>Dear soul, be still!",
              "zh": "安静吧！此刻就安静吧！有些事你的灵魂从未听过，有些事是任何鸟儿的歌声、任何风、浪、星辰所不知晓的——那是从遥远父家来的信息，使思家的灵魂以甜美的喜乐颤动，而且只有在你安静时才临到你。安静吧！此刻就安静吧！有一位极其温柔甘甜的到来；祂无声的脚步穿着洁白的鞋。这就是耶稣差来的保惠师，要将祂所说之话的意义教导你。那愿意等候的灵，祂必充满。你若想听见祂的信息，亲爱的灵魂，安静吧！",
              "simpEn": "Be still! Just now be still! Something your soul has never heard, unknown to any bird, wind, wave, or star—a message from the Father's faraway land that will thrill your homesick soul with sweet joy, and it comes only when you're still. Be still! A mild, sweet presence comes, with white sandals on His silent feet. It is the Comforter Jesus sent to teach you what His words meant. The willing, waiting spirit He will fill. If you would hear His message, dear soul, be still!",
              "simpZh": "安静吧！此刻就安静！有些事你的灵魂从没听过，鸟的歌、风、浪、星星都不知道——那是从遥远父家来的信息，会使想家的灵魂充满甜美的喜乐，而且只有在你安静时才来到。安静吧！有一位温柔甜美的来，祂无声的脚穿着洁白的鞋。这就是耶稣差来的保惠师，要教导你祂所说的话是什么意思。那愿意等候的灵，祂必要充满。如果你想听见祂的信息，亲爱的灵魂，安静吧！"
            }

        {
          "sectionId": 2,
          "heading": "June 18",
          "audio": "audio/Streams in the Desert - June 18.m4a",
          "paragraphs": [
            {
              "en": "Lift up the hands which hang down, and the <span class=\"vocab-trigger\" data-vocab=\"feeble knees\">feeble knees<\/span>; And make straight paths for your feet, lest that which is <span class=\"vocab-trigger\" data-vocab=\"lame\">lame<\/span> be turned out of the way; but let it rather be healed. (Hebrews 12:12–13 KJV)",
              "zh": "所以，你们要把下垂的手、发酸的腿挺起来；也要为自己的脚，把道路修直了，使瘸子不至歪脚，反得痊愈。（希伯来书12:12-13）",
              "simpEn": "Lift up your tired hands and weak knees. Make straight paths for your feet, so that what is lame may not be put out of joint but rather healed.",
              "simpZh": "把你下垂的手和发软的膝盖举起来。为你的脚修直道路，好让瘸腿的不至于扭伤，反而得到痊愈。"
            },
            {
              "en": "This verse is God's word of encouragement to us to lift the hands of faith and to <span class=\"vocab-trigger\" data-vocab=\"fortify\">fortify<\/span> the knees of prayer. All too often our faith becomes tired, weak, and <span class=\"vocab-trigger\" data-vocab=\"listless\">listless<\/span>, and our prayers lose their power and effectiveness. The Lord's illustration here is quite <span class=\"vocab-trigger\" data-vocab=\"compelling\">compelling<\/span>. He is pointing out to us that when we become so discouraged and fearful that even one little obstacle depresses and frightens us, we are tempted to walk around it. We would rather take the easy way than face it. Perhaps there is some physical <span class=\"vocab-trigger\" data-vocab=\"ailment\">ailment<\/span> that God is ready to heal, but it requires <span class=\"vocab-trigger\" data-vocab=\"exertion\">exertion<\/span> on our part. The temptation is to find help from someone else or to walk around the obstacle in some other way.",
              "zh": "这节经文是神鼓励我们的话，要我们举起信心之手，加固祷告之膝。我们常常信心变得疲倦、软弱、无精打采，祷告也失去了能力和果效。主的比喻非常有力。祂向我们指出，当我们变得如此灰心惧怕，甚至一个小小的障碍都使我们消沉惊恐时，我们就被引诱去绕过它。我们宁可走容易的路，也不愿面对它。或许有一些身体上的疾病神正准备医治，但这需要我们的努力。试探就是去从别人那里找帮助，或用别的方法绕过障碍。",
              "simpEn": "This verse encourages us to lift up our faith and strengthen our prayer life. Often our faith becomes tired and weak, and our prayers lose power. The Lord shows us that when we get discouraged by even small obstacles, we are tempted to go around them instead of facing them. Maybe God is ready to heal something, but it requires effort from us. The temptation is to find help elsewhere or avoid the obstacle.",
              "simpZh": "这节经文鼓励我们举起信心的手，坚固祷告的膝盖。我们的信心常常变得疲倦软弱，祷告也失去了力量。主告诉我们，当我们灰心害怕，连一点小障碍都让我们消沉时，我们就会想绕过去，而不愿面对。也许神正准备医治某件事，但这需要我们努力。试探就是去找别人帮忙，或用别的方法绕过去。"
            },
            {
              "en": "We tend to find many ways of walking around emergencies instead of walking straight through them. So often we are faced with something that frightens or overwhelms us and seek to <span class=\"vocab-trigger\" data-vocab=\"evade\">evade<\/span> the problem with the excuse: \"I'm not quite ready for that now.\" It may require some sacrifice, or demand our obedience in some area. Perhaps there is some Jericho we are facing, or we are lacking the courage to help someone else and to pray through his concern with him. Perhaps we have a prayer that awaits completion, or a physical problem that is partially healed and we continue to walk around it. God says, \"Lift up the hands that hang down.\" March straight through the flood, and behold! The waters will divide, the Red Sea will open, the Jordan will part, and the Lord will lead you through to victory.",
              "zh": "我们总是找许多方法绕过紧急情况，而不直接穿过去。我们常面对一些使我们惊恐或压倒我们的事，就用借口逃避：「我现在还没完全预备好。」这可能要求一些牺牲，或在某些方面要求我们顺服。也许我们正面对某个耶利哥，或者我们缺乏勇气去帮助别人并与那人一同祷告度过。也许我们有一个等候完成的祷告，或有一个部分得医治的身体问题，而我们继续绕着走。神说：「把下垂的手举起来。」直接踏进洪水中，看哪！水必分开，红海必敞，约旦河必裂，主必领你胜利而过。",
              "simpEn": "We often find ways to walk around problems instead of going through them. We face something scary and say, 'I'm not ready for that now.' It may require sacrifice or obedience. Maybe we face a Jericho or lack courage to help someone. Maybe a prayer is unfinished, or a healing is partial and we avoid it. God says, 'Lift up your tired hands.' March straight through the flood, and the waters will part—the Red Sea will open, the Jordan will divide, and the Lord will lead you to victory.",
              "simpZh": "我们常常找各种办法绕过困难，而不直接穿过去。面对可怕的事我们就说‘我还没准备好’。这可能需要牺牲或顺服。也许我们正面对一个耶利哥，或缺乏勇气去帮助别人。也许有个祷告还没完成，或身体的医治还没完全，我们就继续绕开。神说：‘把下垂的手举起来。’直接踏进水里，看哪！水会分开，红海会开，约旦河会分，主必领你走向胜利。"
            },
            {
              "en": "Do not allow your feet to \"be turned out of the way,\" but let your body \"be healed,\" and your faith strengthened. Go straight ahead, leaving no Jericho <span class=\"vocab-trigger\" data-vocab=\"unconquered\">unconquered<\/span> behind you, and no place where Satan can boast of having <span class=\"vocab-trigger\" data-vocab=\"overwhelmed\">overwhelmed<\/span> you. This is a valuable lesson and is extremely practical. How often we find ourselves in this very situation! Perhaps this is where you find yourself today. —A. B. Simpson <br>Pay as little attention to discouragement as possible. Plow ahead like a steamship, which moves forward whether facing rough or smooth seas, and in rain or shine. Remember, the goal is simply to carry the cargo and to make it to port. —Maltbie D. Babcock",
              "zh": "不要让你的脚「歪脚」，反要让你「得痊愈」，让你的信心被坚固。一直往前走，不在身后留下任何未被征服的耶利哥，也不留下任何撒但能吹嘘胜过你的地方。这是一个宝贵的功课，而且极其实际。我们何等经常发现自己恰恰处于这种境况！或许今天你就正处在这个地步。——宣信。尽可能少注意灰心。像一艘轮船一样向前推进，无论面对的是波涛汹涌还是风平浪静，无论下雨还是天晴。要记住，目标只是运载货物，抵达港口。——马尔特比·D. 巴布科克",
              "simpEn": "Don't let your feet be turned aside, but let them be healed and your faith strengthened. Go straight ahead, leaving no Jericho unconquered, no place where Satan can boast of overwhelming you. This is a valuable, practical lesson. Perhaps you are in this very situation today. —A. B. Simpson. Pay as little attention to discouragement as possible. Plow ahead like a steamship, in rough or smooth seas, rain or shine. The goal is to carry the cargo and make it to port.",
              "simpZh": "不要让你的脚走歪了，反要得痊愈，信心得坚固。一直往前走，不在身后留下任何未征服的耶利哥，也不留下任何撒但能夸胜的地方。这是个宝贵又实际的功课。也许你今天就在这种境况里。—宣信。尽量不要注意灰心。像轮船一样往前开，不管风浪大小、晴天雨天。记住，目标只是运货并抵达港口。—巴布科克"
            }
          ],

        {
          "sectionId": 3,
          "heading": "June 19",
          "audio": "audio/Streams in the Desert - June 19.m4a",
          "paragraphs": [
            {
              "en": "Grain must be <span class=\"vocab-trigger\" data-vocab=\"ground\">ground<\/span> to make bread. (Isaiah 28:28)",
              "zh": "作饼的粮食是用磨磨碎。（以赛亚书28:28）",
              "simpEn": "Grain must be crushed to make bread.",
              "simpZh": "做饼的谷物必须被磨碎。"
            },
            {
              "en": "Many of us cannot be used as food for the world's hunger, because we have yet to be broken in Christ's hands. \"Grain must be ground to make bread,\" and being a blessing of His often requires sorrow on our part. Yet even sorrow is not too high a price to pay for the privilege of touching other lives with Christ's blessings. The things that are most precious to us today have come to us through tears and pain. —J. R. Miller <br>God has made me as bread for His chosen ones, and if it is necessary for me to \"be ground\" in the teeth of lions in order to feed His children, then blessed be the name of the Lord. —Ignatius",
              "zh": "我们许多人不能被用作解决世界饥荒的食物，因为我们尚未在基督手中被破碎。「作饼的粮食是用磨磨碎」，成为祂的祝福常需要我们这一面经历忧伤。然而，即使忧伤，为着得着以基督的祝福去触摸其他生命的特权，也非太高的代价。今天对我们最宝贵的事物，都是借着眼泪和痛苦临到我们的。——J. R. 米勒。神已使我成为祂选民之粮，如果需要我「在狮子牙齿间被磨碎」才能喂养祂的儿女，那么耶和华的名是应当称颂的。——伊格纳丢",
              "simpEn": "Many of us can't feed the world's hunger because we haven't been broken in Christ's hands. 'Grain must be ground to make bread.' Being a blessing often requires sorrow, but even sorrow is not too high a price for the privilege of touching other lives with Christ's blessings. The most precious things come through tears and pain. —J. R. Miller. God has made me as bread for His chosen ones, and if I must be ground in the teeth of lions to feed His children, blessed be the name of the Lord. —Ignatius",
              "simpZh": "我们许多人不能喂饱世界的饥饿，因为我们还没在基督手里被破碎。‘谷物必须磨碎才能做饼。’成为祝福常需要我们经历忧伤，但即使忧伤，为了用基督的祝福去触摸别的生命，也值了。今天最宝贵的东西都是借着眼泪和痛苦来的。—米勒。神已使我成为祂选民的粮食，如果我必须在狮子牙齿间被磨碎才能喂养祂的儿女，那么主的名是应当称颂的。—伊格纳丢"
            },
            {
              "en": "To burn brightly our lives must first experience the flame. In other words, we cease to bless others when we cease to bleed. Poverty, hardship, and misfortune have propelled many a life to moral heroism and spiritual greatness. Difficulties challenge our energy and our <span class=\"vocab-trigger\" data-vocab=\"perseverance\">perseverance<\/span> but bring the strongest qualities of the soul to life. It is the weights on the old grandfather clock that keep it running. And many a sailor has faced a strong head wind yet used it to make it to port. God has chosen opposition as a <span class=\"vocab-trigger\" data-vocab=\"catalyst\">catalyst<\/span> to our faith and holy service.",
              "zh": "若要烧得明亮，我们的生命必须首先经历火焰。换句话说，我们一旦停止流血，就停止祝福他人。贫穷、艰难和不幸曾驱动许多生命达到道德英雄主义和属灵伟大。困难挑战我们的能量和毅力，却将灵魂最刚强的品质激发出来。老式大座钟正是靠着重锤才得以运行。许多水手曾面对强劲的逆风，却用它驶抵港口。神已选择逆境作为催化我们信心和圣洁服事的媒介。",
              "simpEn": "To burn brightly, our lives must first experience the flame. We cease to bless when we cease to bleed. Poverty, hardship, and misfortune have propelled many to moral heroism and spiritual greatness. Difficulties challenge our energy and perseverance but bring the strongest qualities to life. Weights keep the old grandfather clock running. Sailors have used head winds to reach port. God has chosen opposition as a catalyst to our faith and holy service.",
              "simpZh": "要烧得明亮，必须先经历火焰。我们不流血就不再祝福别人。贫穷、艰难和不幸曾把许多生命推向道德英雄和属灵伟人。困难挑战我们的精力和毅力，但把灵魂最刚强的品质激发出来。旧式大座钟靠重锤才走。水手用过逆风来进港。神已选择逆境来催化我们的信心和圣洁服事。"
            },
            {
              "en": "The most prominent characters of the Bible were broken, <span class=\"vocab-trigger\" data-vocab=\"threshed\">threshed<\/span>, and ground into bread for the hungry. Because he stood at the head of the class, enduring affliction while remaining obedient, Abraham's diploma is now inscribed with these words: \"The Father of Faith.\" Jacob, like wheat, suffered severe threshing and grinding. Joseph was beaten and bruised, and was forced to endure Potiphar's kitchen and Egypt's prison before coming to his throne. David, hunted like an animal of prey through the mountains, was bruised, weary, and footsore, and thereby ground into bread for a kingdom. Paul could never have been bread for Caesar's household if he had not endured the bruising of being whipped and stoned. He was ground into fine flour for the Roman royal family. Combat comes before victory. If God has chosen special trials for you to endure, be assured He has kept a very special place in His heart just for you. A badly bruised soul is one who is chosen.",
              "zh": "圣经中最杰出的人物都曾被破碎、被辗打，并磨成供养饥饿者的饼。亚伯拉罕因为站在了班级的首位，忍受苦难同时保持顺服，他毕业证书上如今刻着这几个字：「信心之父」。雅各像麦子一样经历了重重的辗打和磨碎。约瑟被打被伤，被迫忍受了波提乏的厨房和埃及的监牢，才登上他的宝座。大卫像猎物一样在群山间被追赶，青肿、疲倦、脚痛，因而被磨成了一个国度的饼。保罗若不忍受鞭打和石击的淤伤，就永不能成为凯撒家的饼。他被磨成了细面，供罗马皇室之用。战斗先于胜利。如果神拣选了你承受特别的试炼，你可以放心，祂在祂心中为你存留了一个非常特别的位置。一个严重淤伤的灵魂，乃是被拣选的。",
              "simpEn": "The greatest Bible characters were broken, threshed, and ground into bread for the hungry. Abraham, through suffering and obedience, became the Father of Faith. Jacob was severely threshed like wheat. Joseph was bruised and imprisoned before his throne. David was hunted, weary, and footsore, ground into bread for a kingdom. Paul, whipped and stoned, became bread for Caesar's household. Combat comes before victory. If God has chosen special trials for you, be assured He holds a special place in His heart for you. A badly bruised soul is one who is chosen.",
              "simpZh": "圣经最伟大的人物都被破碎、辗打、磨成喂饱饥饿者的饼。亚伯拉罕因忍受苦难并顺服，成了信心之父。雅各像麦子被狠狠辗打。约瑟被伤被囚，然后才登上宝座。大卫被追赶，又累又脚痛，被磨成一个国度的饼。保罗被打被石头打，才成了凯撒家的饼。战斗在胜利之前。如果神拣选你承受特别试炼，你可以确信祂心里为你存有特别的位置。一个被深深打伤的灵魂，乃是被拣选的。"
            }

        {
          "sectionId": 4,
          "heading": "June 20",
          "audio": "audio/Streams in the Desert - June 20.m4a",
          "paragraphs": [
            {
              "en": "Whether you turn to the right or to the left, your ears will hear a voice behind you, saying, \"This is the way; walk in it.\" (Isaiah 30:21)",
              "zh": "你或向左或向右，你必听见后边有声音说：「这是正路，要行在其间。」（以赛亚书30:21）",
              "simpEn": "Whether you turn to the right or left, you will hear a voice behind you saying, 'This is the way; walk in it.'",
              "simpZh": "你无论向左向右，都会听见后面有声音说：‘这是正路，要走在上面。’"
            },
            {
              "en": "When we have doubts or are facing difficulties, when others suggest courses of action that are conflicting, when caution dictates one approach but faith another, we should be still. We should quiet each <span class=\"vocab-trigger\" data-vocab=\"intruding person\">intruding person<\/span>, calm ourselves in the sacred stillness of God's presence, study His Word for guidance, and with true <span class=\"vocab-trigger\" data-vocab=\"devotion\">devotion<\/span> focus our attention on Him. We should lift our nature into the pure light radiating from His face, having an eagerness to know only what God our Lord will determine for us. Soon He will reveal by His secret counsel a distinct and unmistakable sense of His direction.",
              "zh": "当我们有疑惑或面对困难时，当别人建议相互冲突的行动方针时，当谨慎指示一种方法而信心指示另一种时，我们应当安静。我们应当使每一个闯入者安静，在神圣洁同在的神圣安静中平静自己，研读祂的话语寻求引导，并以真诚的敬虔专注在祂身上。我们应当将自己的本性提升到从祂面孔放射出的纯净光芒中，只渴望知道主神要为我们定规什么。不久祂就会借着祂隐密的训诲，将那清晰无误的方向感启示我们。",
              "simpEn": "When we have doubts or face difficulties, when others suggest conflicting courses, when caution says one thing but faith another, we should be still. Quiet every intruding voice, calm yourself in God's sacred stillness, study His Word, and focus on Him with true devotion. Lift yourself into the pure light of His face, eager to know only what He decides. Soon He will reveal a clear, unmistakable sense of His direction.",
              "simpZh": "当我们有疑惑或遇到困难，别人建议冲突的方向，谨慎说一套信心说另一套时，我们应当安静。让每一个闯入的声音静下来，在神同在的圣洁安静中平静自己，读祂的话寻求引导，真心专注在祂身上。把自己提升到从祂脸上发出的纯净光芒中，只渴望知道神要定规什么。不久祂就会用秘密的指引给你清楚、不会错的方向感。"
            },
            {
              "en": "It is unwise for a new believer to depend on this approach alone. He should wait for circumstances to also confirm what God is revealing. Yet Christians who have had many experiences in their walk with Him know the great value of secret fellowship with the Lord as a means of <span class=\"vocab-trigger\" data-vocab=\"discerning\">discerning<\/span> His will. Are you uncertain about which direction you should go? Take your question to God and receive guidance from either the light of His smile or the cloud of His refusal. You must get alone with Him, where the lights and the darknesses of this world cannot interfere and where the opinions of others cannot reach you. You must also have the courage to wait in silent expectation, even when everyone around you is insisting on an immediate decision or action. If you will do these things, the will of God will become clear to you. And you will have a deeper concept of who He is, having more insight into His nature and His heart of love.",
              "zh": "初信者单单倚赖这一方法是不智的。他应当等候环境也印证神所启示的。然而在行程中多有经历的基督徒，知道与主密交作为分辨祂旨意之途径的极大价值。你是否不确定当走哪个方向？把你的问题带到神面前，从祂笑脸的光或祂拒绝的密云中领受引导。你必须与祂独处，在那里这世界的光暗无法干涉，别人的意见也不能达到你。你还必须有勇气在静默的期待中等候，即使周围所有人都在要求立刻决定或行动。你若肯行这些事，神的旨意就必向你显明。并且你要对祂是谁有更深的概念，对祂的性情和慈爱的心有更多的洞见。",
              "simpEn": "It's unwise for a new believer to depend only on this. He should wait for circumstances to also confirm. Yet experienced Christians know the great value of secret fellowship with the Lord as a way to discern His will. Are you uncertain about which way to go? Take your question to God; receive guidance from either the light of His smile or the cloud of His refusal. Get alone with Him, away from the world's interference and others' opinions. Have the courage to wait in silent expectation, even when everyone insists on an immediate decision. If you do these things, God's will will become clear. And you will know Him more deeply, with more insight into His nature and love.",
              "simpZh": "新信徒单靠这个方法是不智的，应该等候环境也印证。但经验丰富的基督徒知道与主密交是分辨祂旨意的极宝贵方法。你不确定该走哪条路吗？把你的问题带到神面前，从祂笑脸的光或拒绝的云中领受引导。你必须与祂独处，远离世界的光暗和别人意见的干扰。你必须有勇气在静默期待中等候，即使周围人都在催你立刻做决定。你如果这样做，神的旨意就会清楚。而且你会更深认识祂，更多洞见祂的性情和爱。"
            },
            {
              "en": "All this will be your <span class=\"vocab-trigger\" data-vocab=\"unsurpassed gift\">unsurpassed gift<\/span>. It will be a heavenly experience, a precious eternal privilege, and the rich reward for the long hours of waiting. —David <br>\"STAND STILL,\" my soul, for so your Lord commands: <br>E'en when your way seems blocked, leave it in His wise hands; <br>His arm is mighty to divide the wave. <br>\"Stand still,\" my soul, \"stand still\" and you will see <br>How God can work the \"impossible\" for thee, <br>For with a great deliverance He does save. <br>Be not impatient, but in stillness stand, <br>Even when surrounded on every hand, <br>In ways your spirit does not comprehend. <br>God cannot clear your way till you are still, <br>That He may work in you His blessed will, <br>And all your heart and will to Him do bend. <br>\"BE STILL,\" my soul, for just when you are still, <br>Can God reveal Himself to you; until <br>Through you His love and light and life can freely flow; <br>In stillness God can work through you and reach <br>The souls around you. He then through you can teach <br>His lessons, and His power in weakness show. <br>\"BE STILL\"—a deeper step in faith and rest. <br>\"Be still and know\" your Father does know best <br>The way to lead His child to that fair land, <br>A \"summer\" land, where quiet waters flow; <br>Where longing souls are satisfied, and \"know <br>Their God,\" and praise for all that He has planned. <br>—selected",
              "zh": "这一切都将是你的无上恩赐。它将是一次属天的经历，一项宝贵的永恒特权，也是漫长等候时刻的丰盛赏赐。——大卫。「站住，」我的灵魂，因你的主如此吩咐：即使你的道路似乎被堵，把它交在祂智慧手中；祂的膀臂大有能力分开波浪。「站住，」我的灵魂，「站住」你就必看见神怎样为你成就「不可能的事」，因祂以大拯救施行拯救。不要不耐烦，乃在安静中站立，即使四面被困，处于你的灵所不能明白的境遇中。直到你安静，神不能为你开路，好让祂在你里面成全祂有福的旨意，让你全心和意志向祂降服。「要安静，」我的灵魂，因为就在你安静时，神才能向你启示祂自己；直到祂的爱、光和生命能借你自由涌流；在安静中神能借你作工，触及你周围的灵魂。祂能借你教导祂的功课，在软弱中显出祂的能力。「要安静」——更深一步在信心与安息里。「要安静，要知道」你的父最知道引领祂孩子到那佳美之地的路，那「夏日」之地，宁静之水涌流；在那里渴慕的灵魂得着满足，并「认识他们的神」，为祂所计划的一切赞美。——选",
              "simpEn": "All this will be your unsurpassed gift—a heavenly experience, an eternal privilege, the rich reward for long hours of waiting. 'Stand still,' my soul, for so your Lord commands: even when the way seems blocked, leave it in His wise hands; His arm is mighty to divide the wave. 'Stand still' and you will see how God can work the impossible for you. Be not impatient, but in stillness stand, even when surrounded on every hand. God cannot clear your way till you are still, that He may work in you His blessed will. 'Be still,' my soul, for just when you are still, can God reveal Himself to you; until through you His love, light, and life can freely flow. In stillness God can work through you and reach the souls around you. 'Be still'—a deeper step in faith and rest. 'Be still and know' your Father knows best the way to lead His child to that fair land, a 'summer' land where quiet waters flow, where longing souls are satisfied and know their God, and praise for all He has planned.",
              "simpZh": "这一切都将是你的无上恩赐——一次属天经历，一个永远的福分，漫长等候的丰厚奖赏。‘站住，’我的灵魂，你的主如此吩咐：即使路似乎被堵，把它交在祂智慧手中；祂的膀臂能分开波浪。‘站住’你就要看见神怎样为你成就不可能的事。不要不耐烦，在安静中站立，即使四面被困，不明白。直到你安静，神不能为你开路，好让祂在你里面成全祂有福的旨意。‘要安静，’我的灵魂，因为就在你安静时，神才能向你启示祂自己；直到祂的爱、光、生命能借你自由流出去。在安静中神能借你作工，触及周围灵魂。‘要安静’——更深一步的信心和安息。‘要安静，要知道’你的父最知道怎样领祂孩子到那佳美之地，那宁静水流的夏地，在那里渴慕的灵魂得到满足，认识他们的神，为祂计划的一切赞美。"
            }

        {
          "sectionId": 5,
          "heading": "June 21",
          "audio": "audio/Streams in the Desert - June 21.m4a",
          "paragraphs": [
            {
              "en": "The people heard that he had come home. (Mark 2:1)",
              "zh": "人听见祂在房子里。（马可福音2:1）",
              "simpEn": "The people heard that He had come home.",
              "simpZh": "人们听说祂回到了家。"
            },
            {
              "en": "The adult coral <span class=\"vocab-trigger\" data-vocab=\"polyps\">polyps<\/span> work underwater constructing coral reefs. They do so never even imagining they are building the foundation of a new island, which will someday support plants and animals and will be a home where the children of God will be born and equipped for eternal glory as \"<span class=\"vocab-trigger\" data-vocab=\"co-heirs with Christ\">co-heirs with Christ<\/span>\" (Rom. 8:17). Beloved, if your place in God's army is hidden and <span class=\"vocab-trigger\" data-vocab=\"secluded\">secluded<\/span>, do not grumble and complain. Do not seek to run from His will and the circumstances in which He has placed you. Remember, without the polyps, the coral reefs would never be built, and God calls some people to be spiritual polyps. He is looking for those who are willing to serve in places hidden from the sight of others, yet in full view of heaven, and who are sustained by the Holy Spirit.",
              "zh": "成年的珊瑚虫在水下工作建造珊瑚礁。它们这样做的时候，从未想到自己正在建造一座新岛屿的根基，有一天这岛要支持植物和动物，并成为一个家，让神的儿女在那里出生，并为永远的荣耀被预备为「与基督同作后嗣」（罗8:17）。亲爱的，如果你在神军队中的位置是隐藏和偏僻的，不要发怨言和抱怨。不要设法逃避祂的旨意和祂所安置你的环境。要记住，没有珊瑚虫，珊瑚礁就永不会建成；而神呼召一些人去作属灵的珊瑚虫。祂正在寻找那些愿意在人眼看不见、却全然被天注视的地方服事、并由圣灵扶持的人。",
              "simpEn": "Coral polyps work underwater building reefs, never imagining they are building the foundation of a new island that will one day support life and be a home for God's children to be born and equipped for eternal glory as co-heirs with Christ. Beloved, if your place in God's army is hidden and secluded, don't grumble. Don't run from His will and circumstances. Without polyps, reefs would not be built. God calls some to be spiritual polyps—willing to serve in hidden places, in full view of heaven, sustained by the Holy Spirit.",
              "simpZh": "珊瑚虫在水下工作建造珊瑚礁，从没想到它们正在建造一座新岛的根基，有一天那岛要支持动植物，并成为神儿女出生并被预备得永远荣耀的家，就是与基督同作后嗣。亲爱的，如果你在神军队中的位置是隐藏偏僻的，不要发怨言。不要逃避祂的旨意和环境。没有珊瑚虫，礁就建不成。神呼召一些人作属灵的珊瑚虫——愿意在人看不见、天却完全看见的地方服事，由圣灵扶持。"
            },
            {
              "en": "A day is coming when Jesus will <span class=\"vocab-trigger\" data-vocab=\"bestow\">bestow<\/span> His rewards. On that day some people may wonder how you came to <span class=\"vocab-trigger\" data-vocab=\"merit\">merit<\/span> a certain reward, since they have never heard of you. But remember, He makes no mistakes. —selected",
              "zh": "有一天耶稣要赐下祂的奖赏。在那一天，有些人可能会希奇你是怎样得到某个奖赏的，因为他们从未听说过你。但请记住，祂绝不犯错。——选",
              "simpEn": "A day is coming when Jesus will give out rewards. Some may wonder how you earned a certain reward since they never heard of you. But remember, He makes no mistakes.",
              "simpZh": "有一天耶稣要赐下奖赏。那天有人可能会奇怪你怎么配得某个奖赏，因为他们从没听说过你。但请记住，祂绝不犯错。"
            },
            {
              "en": "Just where you stand in the conflict, <br>There is your place. <br>Just where you think you are useless, <br>Hide not your face. <br>God placed you there for a purpose, <br>Whate'er it be; <br>Think He has chosen you for it; <br>Work loyally. <br>Put on your armor! Be faithful <br>At toil or rest! <br>Whate'er it be, never doubting <br>God's way is best. <br>Out in the fight or on lookout, <br>Stand firm and true; <br>This is the work that your Master <br>Gives you to do. <br>—selected",
              "zh": "就在你战阵中所站之处，就是你的位置。就在你认为自己无用的地方，不要躲藏你的脸。神把你放在那里是有目的的，无论那是什么；要想到祂已拣选你为此；要忠心做工。穿上你的军装！无论劳苦或休息，都要忠心！无论何事，永不要怀疑，神的道路最好。在战斗或守望中，要坚定而真实；这就是你的主人所交托你作的工。——选",
              "simpEn": "Just where you stand in the conflict, there is your place. Where you think you are useless, don't hide. God placed you there for a purpose, whatever it is; think He chose you for it; work loyally. Put on your armor! Be faithful at toil or rest! Whatever it is, never doubt God's way is best. Out in the fight or on lookout, stand firm and true; this is the work your Master gives you to do.",
              "simpZh": "就在你争战中站的地方，那就是你的位置。就在你觉得没用的地方，别躲藏。神把你放在那里是有目的的，不管是什么；要想到祂拣选了你为此；忠心做工。穿上军装！无论劳苦或休息都忠心！不论何事，永不要怀疑神的道路最好。在战斗或守望中，要站稳真实；这就是你的主交给你做的工。"
            },
            {
              "en": "With freedom from danger, we can leave a crowded meeting of believers, an inspiring <span class=\"vocab-trigger\" data-vocab=\"mountaintop experience\">mountaintop experience<\/span>, or a helpful fellowship with \"<span class=\"vocab-trigger\" data-vocab=\"righteous men made perfect\">righteous men made perfect<\/span>\" (Heb. 12:23), in order to return to our modest and simple Emmaus, to the dreaded home of the Colossians, or even to the mission field of distant Macedonia. We can do so with the calm assurance that wherever God has placed us, and in every detail of our daily lives, He has <span class=\"vocab-trigger\" data-vocab=\"ordained\">ordained<\/span> the land we are to possess to its very borders and has ordained the victory to be won. —Northcote Deck",
              "zh": "带着脱离危险的自由，我们可以离开拥挤的信徒聚会、一次鼓舞人心的山顶经历、或与「被成全之义人」（来12:23）的有益交通，回到我们朴素简单的以马忤斯，回到所惧怕的歌罗西人的家，甚至回到远方马其顿的宣教工场。我们可以带着平静的保证如此行，知道无论神把我们放在哪里，在我们日常生活的每一细节中，祂都已命定了我们要得为业之地的四境，也命定了那要赢得的胜利。——诺斯科特·戴克",
              "simpEn": "With freedom from danger, we can leave a crowded meeting, a mountaintop experience, or fellowship with righteous men made perfect, to return to our simple Emmaus, the dreaded home of the Colossians, or even the mission field of distant Macedonia. We can do so with calm assurance that wherever God has placed us, in every detail of daily life, He has ordained the land we are to possess to its very borders, and has ordained the victory to be won.",
              "simpZh": "我们可以脱离危险，离开拥挤的聚会、山顶经历、与完全义人的交通，回到我们简单朴素的以马忤斯，回到所怕的歌罗西人的家，甚至回到远方马其顿的宣教工场。我们可以带着平静的保证这样做，知道无论神把我们放在哪里，在日常生活的每一细节中，祂都已命定了我们要得为业之地的四境，也命定了那要赢得的胜利。"

        {
          "sectionId": 6,
          "heading": "June 22",
          "audio": "audio/Streams in the Desert - June 22.m4a",
          "paragraphs": [
            {
              "en": "Love covers over all wrongs. (Proverbs 10:12) <br>Follow the way of love. (1 Corinthians 14:1 [also see 1 Corinthians 13:7–13])",
              "zh": "爱能遮掩一切过错。（箴言10:12）你们要追求爱。（哥林多前书14:1，另见林前13:7-13）",
              "simpEn": "Love covers over all wrongs. Follow the way of love.",
              "simpZh": "爱能遮盖一切过错。要追求爱。"
            },
            {
              "en": "When you are troubled, share your problems with God alone. Recently I read the personal experience of a precious child of God. It made such an impression on me that I would like to relate it to you here. \"At midnight I found myself completely unable to sleep,\" she wrote. \"Waves of cruel injustice were sweeping over me, and the covering of love seemed to have been unknowingly removed from my heart. In great agony I cried to God for the power to obey His <span class=\"vocab-trigger\" data-vocab=\"admonition\">admonition<\/span>, 'Love covers over all wrongs.' Immediately His Spirit began to work the power into me that ultimately brought about forgetfulness. I mentally dug a grave, deliberately throwing the dirt out until the hole was very deep. With sorrow, I lowered the offense that had wounded me into the grave and quickly shoveled the soil over it. Then I carefully covered the hole with green <span class=\"vocab-trigger\" data-vocab=\"sod\">sod<\/span>, planted beautiful white roses and <span class=\"vocab-trigger\" data-vocab=\"forget-me-nots\">forget-me-nots<\/span> on top, and briskly walked away. Suddenly restful sleep came to me. And the wound that had seemed so deadly was healed without a scar. God's love has covered so completely that today I cannot remember what caused my grief.\"",
              "zh": "当你烦恼时，把你的问题单单与神分享。最近我读到神一个宝贵孩子的个人经历。它给我留下了极深刻的印象，所以我愿意在此转述。「午夜时，我发现自己完全无法入睡，」她写道。「残酷不公的波浪正漫过我身，而那爱的遮盖似乎已不知不觉地从我心里被挪去。在极大的痛苦中，我向神呼喊，求神赐我力量去遵行祂的告诫：『爱能遮掩一切过错。』祂的灵立刻开始将那力量作在我里面，最终带来了遗忘。我在心思里挖了一个坟墓，刻意把土扔出来，直到坑很深。我忧伤地，将那伤害了我的过犯放进坟墓里，并迅速铲土盖住。然后我小心地用绿草皮盖住坑，在上面种上美丽的白玫瑰和毋忘我，然后轻快地走开。忽然安舒的睡眠临到了我。那看似致命的伤口，竟没有疤痕就痊愈了。神的爱遮盖得如此完全，以致今天我已记不起那引起我忧伤的事。」",
              "simpEn": "When troubled, share your problems with God alone. I read a precious experience: 'At midnight I couldn't sleep. Waves of cruel injustice swept over me, and the covering of love seemed removed from my heart. In agony I cried to God for power to obey the command, \"Love covers over all wrongs.\" His Spirit worked in me until forgetfulness came. I mentally dug a deep grave, lowered the offense into it, shoveled soil over it, covered it with green sod, planted white roses and forget-me-nots on top, and walked away. Suddenly restful sleep came. The deadly wound was healed without a scar. God's love covered so completely that today I can't remember what caused my grief.'",
              "simpZh": "烦恼时把你的问题单单跟神分享。我读到一个宝贵的经历：‘半夜我睡不着，不公平的波浪漫过我，爱的遮盖好像从我心里被拿走了。我痛苦地向神呼喊，求祂给我力量遵行“爱能遮掩一切过错”。祂的灵开始在我里面作工，最终带来遗忘。我在心里挖了一个深坑，把那伤害我的过犯放进去，铲土盖住，铺上绿草皮，在上面种了白玫瑰和毋忘我，然后轻快地走开。突然安稳的睡眠来了。那看似致命的伤口无疤痊愈了。神的爱遮盖得如此完全，今天我已记不起那引起我忧伤的事了。’"
            },
            {
              "en": "There was a scar on yonder mountainside, <br>Gashed out where once the cruel storm had trod; <br>A barren, <span class=\"vocab-trigger\" data-vocab=\"desolate chasm\">desolate chasm<\/span>, reaching wide <br>Across the soft green sod. <br>But years crept by beneath the purple pines, <br>And veiled the scar with grass and moss once more, <br>And left it fairer now with flowers and vines <br>Than it had been before. <br>There was a wound once in a gentle heart, <br>From which life's sweetness seemed to <span class=\"vocab-trigger\" data-vocab=\"ebb and die\">ebb and die<\/span>; <br>And love's confiding changed to bitter smart, <br>While slow, sad years went by. <br>Yet as they passed, unseen an angel stole <br>And laid a <span class=\"vocab-trigger\" data-vocab=\"balm\">balm<\/span> of healing on the pain, <br>Till love grew purer in the heart made whole, <br>And peace came back again.",
              "zh": "那边山坡上曾有一道伤痕，是残酷风暴践踏时刻出来的；一道荒凉凄寂的裂口，横跨在柔软的青草地上。但岁月在紫松之下悄悄流逝，再用青草和苔藓将那伤痕遮掩，如今留下它比从前更美，布满了花朵与藤蔓。在温柔的心中曾有一道伤口，生命的甜美似乎从那渐渐衰退消亡；爱中的信赖变成了苦楚，忧伤缓慢的岁月流逝而过。然而随着岁月逝去，一位看不见的天使悄悄来临，将医病的香膏敷在疼痛上，直到爱在那复原的心里变得更加纯净，平安又再次回来。",

              "simpZh": "那边山坡上曾有一道伤疤，是残酷风暴刻出来的——一道荒凉凄寂的裂口，横跨在柔软的青草地上。但岁月在松树下悄悄流过，青草和苔藓再次遮住伤疤，留下它比从前更美，满是花朵和藤蔓。在温柔的心中曾有一道伤口，生命的甜美似乎从那渐渐流失消亡；爱的信赖变成苦楚，忧伤缓慢的岁月流逝。然而随着岁月过去，一位看不见的天使把医病的香膏敷在疼痛上，直到爱在那复原的心里变得更加纯净，平安又再回来。"

              "simpZh": "约翰·班扬说彼得即使在疑惑中也有点信心。他虽然害怕呼喊，却是借着下船行走才到了耶稣那里。彼得的眼睛实际上拦阻了他；一旦离开船，波浪就不关他的事了。他只应该关注基督自己从黑暗中照出来的光路。就算比古埃及亮十倍的光也不该引开他的眼。当主呼召你从水上过来时，要带着信心和喜乐踏出去。一刻也不要转眼离开祂。你量波浪不会得胜，测风力也不会变强。察看危险反会叫你跌倒。在困难前停步，会让波浪漫过你头顶。向山举目，向前走。没有别的路。"

          "paragraphs": [
            {
              "en": "Concerning the work of my hands <span class=\"vocab-trigger\" data-vocab=\"command ye me\">command ye me<\/span>. (Isaiah 45:11 KJV)",
              "zh": "至于我手的工作，你们可以吩咐我。（以赛亚书45:11 钦定本）",
              "simpEn": "About the work of My hands, you may command Me.",
              "simpZh": "关于我手所做的工，你们可以吩咐我。"
            },
            {
              "en": "The Lord Jesus took this very approach with God when He said, \"Father, I want those you have given me to be with me\" (John 17:24). Joshua used it during the moment of his greatest victory, when he lifted his spear toward the setting sun and cried aloud, \"O sun, stand still\" (Josh. 10:12). Elijah employed it when he stopped the rain from heaven and started it again after three and a half years. Martin Luther followed it when, kneeling by his dying colleague, Philipp Melanchthon, he <span class=\"vocab-trigger\" data-vocab=\"forbid\">forbid<\/span> death to take its victim.",
              "zh": "主耶稣正是以这样的方式向神祷告：「父啊，我在哪里，愿祢所赐给我的人也同我在那里」（约17:24）。约书亚在他最大胜利的时刻也这样使用——他向落日的方向举起枪，大声呼喊：「日头啊，你要停在基遍」（书10:12）。以利亚也如此使用，他使天闭塞不下雨，三年半后又使天降雨。马丁·路德也效法了这一点，他跪在垂死的同工菲利普·墨兰顿身旁，禁止死亡夺去它的猎物。",
              "simpEn": "Jesus used this approach with God: 'Father, I want those You have given Me to be with Me.' Joshua used it when he commanded the sun to stand still. Elijah used it to stop and start the rain. Martin Luther, kneeling by his dying friend Melanchthon, forbade death to take him.",
              "simpZh": "耶稣对神就是这样：'父啊，我要你赐给我的人和我在一起。' 约书亚在最大的胜利时刻命令太阳停住。以利亚用它来停止和开始下雨。马丁·路德跪在垂死的朋友旁边，禁止死亡夺走他。"
            },
            {
              "en": "This is a wonderful relationship that God invites us to enter. We are certainly familiar with passages of Scripture like the one that follows the above verse: \"My own hands stretched out the heavens; I <span class=\"vocab-trigger\" data-vocab=\"marshaled\">marshaled<\/span> their starry hosts\" (Isa. 45:12). But knowing that God invites us to command Him to act reveals a surprising change in our normal relationship! What a distinction there is between this attitude and the <span class=\"vocab-trigger\" data-vocab=\"hesitancy\">hesitancy<\/span> and uncertainty of our prayers of unbelief, to which we have become so accustomed! The constant repetition of our prayers has also caused them to lose their sharp cutting edge.",
              "zh": "这是神邀请我们进入的一个奇妙关系。我们当然熟悉紧接着这节经文的圣经话语：「我手铺张诸天，天上万象也是我所命定的」（赛45:12）。但知道神邀请我们吩咐祂行动，显明我们惯常关系发生了一个惊人的改变！这种态度，与我们习以为常的不信祷告中的迟疑和不确定之间，是何等的不同！我们祷告的不断重复，也使其失去了锋利的刃。",
              "simpEn": "God invites us into this amazing relationship. We know the next verse: 'My own hands stretched out the heavens; I marshaled their starry hosts.' But God's invitation to command Him changes everything! What a difference from our usual hesitant, uncertain prayers of unbelief! Constant repetition has dulled our prayers' edge.",
              "simpZh": "神邀请我们进入这种奇妙的关系。我们知道下一节说：'我亲手铺张诸天，万象都是我所命定的。' 但神邀请我们吩咐祂，这完全改变了关系！这跟我们习惯的那种犹豫、不信的祷告多么不同！不断重复的祷告也失去了锋利。"
            },
            {
              "en": "Think how often Jesus, during His earthly ministry, put others in a position to command Him. \"As Jesus and his disciples were leaving Jericho,\" Jesus stopped and responded to two blind men who had called out to Him. \"What do you want me to do for you?\" (Matt. 20:29, 32). It was as though He said, \"I am yours to command.\" Could we ever forget how Jesus yielded the key to His resources to the Greek woman from Syrian Phoenicia because of her reply to Him? In effect, He told her to help herself to all that she needed. (See Mark 7:24–30.)",
              "zh": "想想耶稣在地上服事时，多少次将别人放在吩咐祂的地位上。「他们出耶利哥的时候，」耶稣停下来，回应那两个呼叫祂的瞎子。「要我为你们做什么？」（太20:29,32）。祂仿佛在说：「我任凭你们吩咐。」我们怎能忘记耶稣如何因着那位叙利亚腓尼基族希腊妇人的回答，而将她所需要的一切资源的钥匙交给她呢？实际上，祂告诉她自己取用她所需的一切（见可7:24-30）。",
              "simpEn": "Think how often Jesus put others in a position to command Him. He asked the two blind men near Jericho, 'What do you want Me to do for you?' As if saying, 'I am yours to command.' And He gave the key to His resources to the Greek woman from Syrian Phoenicia, telling her to help herself to all she needed.",
              "simpZh": "想想耶稣多次把人放在可以吩咐祂的位置上。祂在耶利哥附近问两个瞎子：'要我为你们做什么？' 好像在说：'我任凭你们吩咐。' 祂还把资源的钥匙交给那位叙腓尼基族的希腊妇人，告诉她尽管取用她所需要的一切。"

              "zh": "谁能完全领悟神慈爱地将祂幼小的儿女提升到何等崇高的地位？祂似乎是在说：「我所有的资源都任凭你吩咐。」「你们奉我的名，无论求什么，我必成就」（约14:13）。——F. B.迈尔",

            },
            {
              "en": "Say to this mountain, \"Go, <br>Be cast into the sea\"; <br>And doubt not in your heart <br>That it will be to thee. <br>It will be done, doubt not His Word, <br>Challenge your mountain in the Lord! <br>Claim your <span class=\"vocab-trigger\" data-vocab=\"redemption right\">redemption right<\/span>, <br>Purchased by precious blood; <br>The Trinity unite <br>To make it true and good. <br>It will be done, obey the Word, <br>Challenge your mountain in the Lord! <br>Self, sickness, sorrow, sin, <br>The Lord did meet that day <br>On His beloved One, <br>And you are freed away. <br>It has been done, rest on His Word, <br>Challenge your mountain in the Lord! <br>Surround the rival's wall <br>With silent prayer, then raise— <br>Before its <span class=\"vocab-trigger\" data-vocab=\"ramparts\">ramparts<\/span> fall— <br>The victor's shout of praise. <br>It will be done, faith rests assured, <br>Challenge your mountain in the Lord! <br>The massive gates of brass, <br>The bars of iron yield, <br>To let the faithful pass, <br>Conquerors in every field. <br>It will be done, the foe ignored, <br>Challenge your mountain in the Lord! <br>Take then the faith of God, <br>Free from the <span class=\"vocab-trigger\" data-vocab=\"taint\">taint<\/span> of doubt; <br>The miracle-working rod <br>That casts all reasoning out. <br>It will be done, stand on the Word, <br>Challenge your mountain in the Lord!",
              "zh": "对这座山说：「去，投在海里！」心里不要疑惑，这事必为你成就。必成就，不要怀疑祂的话，要在主里挑战你的山！认领你救赎的权利，是借着宝血买来的；三一神联合使它真实且美好。必成就，要顺服这话，要在主里挑战你的山！自我、疾病、忧伤、罪恶，主在那天都在祂爱子身上对付了，而你已经得释放。已经成就了，安息在祂的话上，要在主里挑战你的山！用静默的祷告围住那敌人的墙，然后在它堡垒倒塌之前，扬起得胜者的赞美欢呼。必成就，信心安然笃定，要在主里挑战你的山！巨大的铜门，铁闩也屈服，容让忠心的人经过，在每一战场作得胜者。必成就，不要理会仇敌，要在主里挑战你的山！要拿起神的信心，毫无疑惑的玷污；那赶出一切理性的行神迹之杖。必成就，要站在神话语上，要在主里挑战你的山！",
              "simpEn": "Say to this mountain, 'Go, throw yourself into the sea,' and don't doubt in your heart. It will be done—doubt not His Word, challenge your mountain in the Lord! Claim your right of redemption, bought by precious blood; the Trinity unites to make it true. It will be done—obey the Word, challenge your mountain in the Lord! Self, sickness, sorrow, sin, the Lord met on His beloved One, and you are freed. It has been done—rest on His Word, challenge your mountain! Surround the enemy's wall with silent prayer, then raise the shout of praise before its ramparts fall. It will be done—faith is assured, challenge your mountain! Massive brass gates and iron bars yield to let the faithful pass as conquerors. It will be done—ignore the foe, challenge your mountain! Take the faith of God, free from doubt; the miracle-working rod casts out all reasoning. It will be done—stand on the Word, challenge your mountain!",
              "simpZh": "对这座山说：'去吧，投进海里！' 心里不要疑惑。必成就——不要怀疑祂的话，在主里挑战你的山！认领你被宝血买来的救赎权利；三一神联合使它真实。必成就——顺服这话，挑战你的山！自我、疾病、忧伤、罪恶，主都在祂爱子身上对付了，你已经得释放。已经成就了——安息在祂的话上，挑战你的山！用静默的祷告围住敌人的墙，在堡垒倒塌前扬起赞美欢呼。必成就——信心笃定，挑战你的山！巨大的铜门和铁闩都屈服，让忠心的人以得胜者身份经过。必成就——不要理会仇敌，挑战你的山！拿起毫无疑惑的信心，那赶走理性的行神迹之杖。必成就——站在神的话语上，挑战你的山！"

              "en": "The Lord said to Moses, \" . . . Tell the Israelites to <span class=\"vocab-trigger\" data-vocab=\"move on\">move on<\/span>. Raise your staff and stretch out your hand over the sea.\" (Exodus 14:15–16)",
