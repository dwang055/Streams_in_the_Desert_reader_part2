          "audio": "audio/Streams in the Desert - April 18.m4a",
          "paragraphs": [
            {
              "en": "He will do this. (Psalm 37:5)",
              "zh": "祂必成全。（诗篇37:5）",
              "simpEn": "He will do this.",
              "simpZh": "祂必成全这事。"
            },
            {
              "en": "I once believed that after I prayed, it was my responsibility to do everything in my power to bring about the answer. Yet God taught me a better way and showed me that <span class=\"vocab-trigger\" data-vocab=\"self-effort\">self-effort<\/span> always hinders His work. He also revealed that when I prayed and had <span class=\"vocab-trigger\" data-vocab=\"confident trust\">confident trust<\/span> in Him for something, He simply wanted me to wait in an attitude of praise and do only what He told me. Sitting still, doing nothing except trusting in the Lord, causes a feeling of uncertainty, and there is often a tremendous temptation to take the battle into our own hands.",
              "zh": "我曾以为，祷告之后，我就有责任尽我所能去促成答复。然而神教导我一个更好的方式，并让我看见，自己的努力总是阻碍祂的工作。祂也启示我，当我祷告并为某事坚定信靠祂时，祂只愿我以赞美态度等候，并只做祂所吩咐的事。安静坐着，除信靠主外什么也不做，会带来一种不确定感，并且常有巨大的试探，想要自己接手战斗。",
              "simpEn": "I used to believe that after praying, I must do everything possible to bring the answer. But God showed me a better way: self-effort always hinders His work. He showed me that when I pray and trust Him confidently, He wants me to wait in praise and do only what He says. Sitting still, doing nothing but trusting God, feels uncertain, and there is a huge temptation to take matters into our own hands.",
              "simpZh": "我以前以为祷告之后，我有责任尽一切力量去让祷告成就。但神教我一个更好的方法，让我看见自己的努力总是拦阻祂的工作。祂也启示我，当我祷告并为某件事坚定信靠祂时，祂只要我用赞美的心态等候，只做祂吩咐我做的事。安静坐着什么都不做，只信靠主，会让人觉得不确定，而且常常有极大的试探想自己接手去争战。"
            },
            {
              "en": "We all know how difficult it is to rescue a drowning person who tries to help his rescuer, and it is equally difficult for the Lord to fight our battles for us when we insist upon trying to fight them ourselves. It is not that God will not but that He cannot, for our <span class=\"vocab-trigger\" data-vocab=\"interference\">interference<\/span> hinders His work. —C. H. P.",
              "zh": "我们都知道，要救一个试图帮救援者忙的溺水之人有多难；同样，当我们坚持要自己打仗时，主要为我们争战也同样困难。并非神不肯，乃是祂不能，因为我们的干涉阻碍了祂的作为。——C. H. P.",
              "simpEn": "We all know how hard it is to rescue a drowning person who tries to help the rescuer. It's just as hard for the Lord to fight our battles when we insist on fighting them ourselves. Not that God won't, but He can't, because our interference blocks His work.",
              "simpZh": "我们都知道，要救一个拼命想帮救人者忙的溺水者有多难。同样，当我们坚持要自己打仗时，主为我们争战也很难。不是神不肯，乃是祂不能，因为我们的干涉拦阻了祂的工作。"
            },
            {
              "en": "Spiritual forces cannot work while we are trusting earthly forces. Often we fail to give God an opportunity to work, not realizing that it takes time for Him to answer prayer. It takes time for God to color a rose or to grow a great oak tree. And it takes time for Him to make bread from wheat fields. He takes the soil, then <span class=\"vocab-trigger\" data-vocab=\"grinds\">grinds<\/span> and softens it. He <span class=\"vocab-trigger\" data-vocab=\"enriches\">enriches<\/span> it and wets it with rain showers and with dew. Then He brings the warmth of life to the small blade of grass, later grows the <span class=\"vocab-trigger\" data-vocab=\"stalk\">stalk<\/span> and the <span class=\"vocab-trigger\" data-vocab=\"amber grain\">amber grain<\/span>, and finally provides bread for the hungry. All this takes time. Therefore we sow the seed, till the ground, and then wait and trust until God's purpose has been fulfilled. We understand this principle when it comes to planting a field, and we need to learn the same lesson regarding our prayer life. It takes time for God to answer prayer. —J. H. M.",
              "zh": "当我们倚靠地上的力量时，属灵的力量就不能作工。我们常不给神机会作工，没有意识到祂回答祷告是需要时间的。神染一朵玫瑰或长成一棵大橡树都需要时间。祂从麦田造出面包也需要时间。祂取来土壤，然后磨碎并松化它。祂使它肥沃，用阵雨和露水湿润它。然后祂带来生命的温暖给小草叶，后来长出茎和金黄的谷粒，最终为饥饿的人提供面包。这一切都需要时间。因此我们撒种，耕耘土地，然后等候并信靠，直到神的旨意成就。我们在耕种田地时明白这个原则，而在祷告生活上也需要学会同样的功课。神回答祷告是需要时间的。——J. H. M.",
              "simpEn": "Spiritual forces can't work while we trust earthly forces. We often fail to give God a chance to work, not realizing it takes time for Him to answer prayer. It takes time to color a rose or grow an oak. It takes time to make bread from wheat—the soil is ground, softened, enriched, wetted with rain and dew, then warmed for the blade, then the stalk and golden grain grow, and finally bread comes. All this takes time. We sow, till, wait, and trust until God's purpose is fulfilled. We understand this with farming; we need to learn it for prayer. God's answers take time.",
              "simpZh": "当我们依靠地上的力量时，属灵力量就无法工作。我们常常不给神机会作工，没意识到祂回答祷告需要时间。神给一朵玫瑰花上色，或让一棵大橡树长大都需要时间。祂用麦田做出面包也需要时间。祂取来土壤，磨碎，弄松，使它肥沃，用雨水和露水滋润，然后带来生命的热气让小叶片长出来，后来长出茎和金黄的谷粒，最后才给饥饿的人提供面包。这一切都需要时间。所以我们撒种，耕地，然后等候信靠，直到神的旨意成就。在种田的事上我们明白这个道理，在祷告生活上我们也需要学会同样的功课。神回应祷告需要时间。"
            }
          ],

        {
          "sectionId": 5,
          "heading": "April 19",
          "audio": "audio/Streams in the Desert - April 19.m4a",
          "paragraphs": [
            {
              "en": "Stand firm and you will see the <span class=\"vocab-trigger\" data-vocab=\"deliverance\">deliverance<\/span> the Lord will bring you today. (Exodus 14:13)",
              "zh": "只管站住！看耶和华今天向你们所要施行的救恩。（出埃及记14:13）",
              "simpEn": "Stand firm and you will see the rescue the Lord will bring you today.",
              "simpZh": "站住不要动，看耶和华今天要为你施行的拯救。"
            },
            {
              "en": "This verse contains God's command to me as a believer for those times when I am confronted with <span class=\"vocab-trigger\" data-vocab=\"dire circumstances\">dire circumstances<\/span> and <span class=\"vocab-trigger\" data-vocab=\"extraordinary difficulties\">extraordinary difficulties<\/span>. What am I to do when I cannot retreat or go forward and my way is blocked to the right and to the left? The Master's word to me is, \"Stand firm.\" And the best thing I can do at these times is to listen only to my Master's word, for others will come to me with their suggestions and evil advice. <span class=\"vocab-trigger\" data-vocab=\"Despair\">Despair<\/span> will come, whispering, \"Give up—lie down and die.\" But even in the worst of times, God would have me be cheerful and courageous, rejoicing in His love and faithfulness.",
              "zh": "这节经文包含了当我面临可怕环境和异常困难时，神对我这信徒的命令。当我不能退后，不能前进，左右的路都被封住时，我当做什么？主人对我说的话是：「只管站住。」而我在这些时候最该做的事，就是只听我主人的话，因为其他人会带着他们的建议和恶意的劝告来。绝望会来，低语说：「放弃吧——躺下等死。」但即使在最坏的时候，神也要我欢欣鼓舞，因祂的爱和信实喜乐。",
              "simpEn": "This verse gives God's command for times of terrible trouble. When I can't retreat or advance and both sides are blocked, what do I do? The Master says, 'Stand firm.' The best thing I can do is listen only to my Master, because others will bring their suggestions and bad advice. Despair will whisper, 'Give up—lie down and die.' But even in the worst times, God wants me cheerful and brave, rejoicing in His love and faithfulness.",
              "simpZh": "这节经文是当我面临可怕的环境和极大的困难时，神给我的命令。当我不能退后，不能前进，左右的路都被堵住时，我该做什么？主人对我说的话是：‘只管站住。’这时候我最好就是只听主人的话，因为别人会带着他们的建议和坏主意来。绝望会来，轻声说：‘放弃吧——躺下死掉算了。’但即使在最坏的时候，神也要我欢喜勇敢，因祂的爱和信实快乐。"
            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Cowardice\">Cowardice<\/span> will come and say, \"You must retreat to the world's ways of acting. It is too difficult for you to continue living the part of a Christian. <span class=\"vocab-trigger\" data-vocab=\"Abandon\">Abandon<\/span> your principles.\" Yet no matter how much Satan may pressure me to follow his course, I cannot, for I am a child of God. The Lord's <span class=\"vocab-trigger\" data-vocab=\"divine decree\">divine decree<\/span> has commanded me to go from \"strength to strength\" (Ps. 84:7). Therefore I will, and neither death nor hell will turn me from my course. And if for a season He calls me to \"stand firm,\" I will acknowledge it as time to renew my strength for greater <span class=\"vocab-trigger\" data-vocab=\"strides\">strides<\/span> in the future.",
              "zh": "胆怯会来，说：「你必须退回到世界的行事方式去。继续活出基督徒的身分对你来说太难了。放弃你的原则吧。」然而，无论撒但如何催逼我去走它的路，我也不能，因为我是神的孩子。主那神圣的命令已经命我从「力上加力」（诗84:7）。因此我必要如此，死亡和地狱也不能使我偏离我的道路。如果祂有段时间呼召我「站住」，我就要承认这段时间是为将来的更大步伐重新得力的时候。",
              "simpEn": "Cowardice will say, 'Go back to the world's ways. Living as a Christian is too hard. Give up your principles.' But no matter how much Satan pushes me, I can't, because I am God's child. God's decree has ordered me to go from 'strength to strength' (Ps. 84:7). So I will, and neither death nor hell will change my course. If He calls me to 'stand firm' for a season, I'll see it as time to renew my strength for greater steps ahead.",
              "simpZh": "胆怯会来，说：‘你得退回到世界的做事方式去。继续像个基督徒那样生活太难了。放弃你的原则吧。’但是，无论撒但怎样逼我走它的路，我也不能，因为我是神的孩子。主那神圣的命令已经命我从‘力上加力’。所以我要这样走，死亡和地狱都不能使我偏离我的道路。如果祂有一段时间叫我‘站住’，我就要认为这是为将来迈更大步子重新得力的时间。"
            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Impatience\">Impatience<\/span> will come, crying, \"Get up and do something! To 'stand firm' and wait is sheer <span class=\"vocab-trigger\" data-vocab=\"idleness\">idleness<\/span>.\" Why is it I think I must be doing something right now instead of looking to the Lord? He will not only do something—He will do everything. <span class=\"vocab-trigger\" data-vocab=\"Arrogance\">Arrogance<\/span> will come, boasting, \"If the sea is blocking your way, march right into it and expect a miracle.\" Yet true faith never listens to arrogance, impatience, cowardice, or despair but only hears God saying, \"Stand firm.\" And then it stands as <span class=\"vocab-trigger\" data-vocab=\"immovable\">immovable<\/span> as a rock. —Charles H. Spurgeon.",
              "zh": "不耐烦会来，喊着说：「起来做点什么！『站住』和等候完全是懒惰。」为什么我会觉得自己必须现在就做些什么，而不仰望主呢？祂不单要做一些事——祂要做一切事。傲慢会来，夸口说：「如果海挡了路，直接走进海里去，期待神迹。」然而真正的信心从不听从傲慢、不耐烦、胆怯或绝望，只听见神说：「只管站住。」然后它就如磐石般不可摇动。——查尔斯·哈丁·司布真",
              "simpEn": "Impatience will cry, 'Get up and do something! Standing firm is pure laziness.' Why do I think I must do something now instead of looking to the Lord? He will not just do something—He will do everything. Arrogance will boast, 'If the sea blocks your way, march right into it and expect a miracle.' But true faith never listens to arrogance, impatience, cowardice, or despair. It only hears God saying, 'Stand firm.' And then it stands as solid as a rock. —Spurgeon",
              "simpZh": "不耐烦会喊：‘起来做点什么！站住不动和等候就是懒散。’为什么我会觉得自己现在必须做点什么而不仰望主呢？祂不但要做一些事——祂要做一切事。骄傲会夸口说：‘如果海挡住了路，直接走进去，等着看神迹。’但真正的信心从不去听骄傲、不耐烦、胆怯或绝望，只听神说：‘只管站住。’然后就像磐石一样不可动摇。—司布真"
            },
            {
              "en": "Be quiet! Why this anxious heed <br>About your tangled ways? <br>God knows them all. He gives you speed <br>And He allows delays. <br>It's good for you to walk by faith <br>And not by sight. <br>Take it on trust a little while. <br>Soon will you read the mystery aright <br>In the full sunshine of His smile. <br>In times of uncertainty—wait. If you have any doubt—wait, never forcing yourself into action. If you sense any restraint in your spirit, do not go against it—wait until the way is clear.",
              "zh": "安静吧！何必为你纠缠的道路如此焦虑？神全都知道。祂赐你速度，也容许耽延。凭信心不凭眼见行走，对你有益。再稍许多信靠片时。不久你就要在祂笑脸的充足阳光下，正确地解读那奥秘。在不确定的时候——等待。你若有任何疑惑——等待，绝不要强迫自己行动。若你在灵里感觉到任何约束，不要违逆它——等待直到道路清晰。",
              "simpEn": "Be quiet! Why worry about your tangled ways? God knows them all. He gives speed and allows delays. It's good to walk by faith, not sight. Trust a little longer. Soon you'll understand the mystery in the full sunshine of His smile. In times of uncertainty—wait. If you have any doubt—wait, never force action. If you feel any inner check, don't go against it—wait until the way is clear.",
              "simpZh": "安静吧！为什么要为你那些纠缠不清的路这么担心？神全知道。祂给你速度，也允许延迟。凭信心走不凭眼见走，对你有好处。再稍微多信靠一会儿。很快你就要在祂笑脸满满的光中，正确地看清那奥秘。不确定的时候——等。如果有任何疑惑——等，不要强迫自己行动。如果你灵里感觉有任何约束，不要违背——等到路清楚为止。"
            }

        {
          "sectionId": 6,
          "heading": "April 20",
          "audio": "audio/Streams in the Desert - April 20.m4a",
          "paragraphs": [
            {
              "en": "\"Not by might nor by power, but by my Spirit,\" says the Lord Almighty. (Zechariah 4:6)",
              "zh": "万军之耶和华说：不是倚靠势力，不是倚靠才能，乃是倚靠我的灵方能成事。（撒迦利亚书4:6）",
              "simpEn": "'Not by might nor by power, but by My Spirit,' says the Lord Almighty.",
              "simpZh": "‘不靠势力，不靠才能，乃是靠我的灵，’全能的主说。"
            },
            {
              "en": "Once as I walked along the road on a steep hill, I caught sight of a boy on a bicycle near the bottom. He was <span class=\"vocab-trigger\" data-vocab=\"pedaling\">pedaling<\/span> uphill against the wind and was obviously working tremendously hard. Just as he was <span class=\"vocab-trigger\" data-vocab=\"exerting\">exerting<\/span> the greatest effort and painfully doing the best he could do, a streetcar, also going up the hill, approached him. It was not traveling too fast for the boy to grab hold of a rail at the rear, and I am sure you can guess the result. He went up the hill as effortlessly as a bird gliding through the sky.",
              "zh": "有一次我沿着一条陡峭的山路行走，看见山脚附近有一个男孩骑着自行车。他正顶着风向上踩，显然费了极大的力气。就在他付出最大努力、痛苦地尽力而为时，一辆同样上山的电车驶近他。车速并不太快，男孩可以抓住车尾的一根扶手，我相信你能猜到结果。他上山就像鸟儿滑翔过天际一般毫不费力。",
              "simpEn": "Walking up a steep hill, I saw a boy on a bicycle near the bottom. He was pedaling uphill against the wind, working very hard. Just as he was struggling with his greatest effort, a streetcar going uphill came near. It was slow enough for him to grab a rail at the back. He went up the hill as easily as a bird gliding through the sky.",
              "simpZh": "我走在一条陡坡路上，看见山脚附近有个男孩骑着自行车。他正迎着风用力踩上山，显然费了极大的力气。就在他付出最大努力、很辛苦地尽力往上时，一辆也往山上开的电车经过他旁边，速度不快，男孩可以抓住车后的一根扶手。你一定能猜到结果。他上山就像鸟滑过天空一样毫不费力。"
            },
            {
              "en": "This thought then flashed through my mind: \"I am like that boy on the bicycle in my weariness and weakness. I am pedaling uphill against all kinds of opposition and am almost worn out with the task. But nearby there is great power available—the strength of the Lord Jesus. All I must do is get in touch with Him and maintain communication with Him. And even if I grab hold with only one little finger of faith, it will be enough to make His power mine to accomplish the act of service that now <span class=\"vocab-trigger\" data-vocab=\"overwhelms\">overwhelms<\/span> me.\" —from The Life of Fuller Purpose",
              "zh": "随即一个念头闪过我的脑海：「我在疲惫软弱中就像那骑自行车的男孩。我正顶着各种反对向上踩，几乎因这任务筋疲力尽。但近旁有大能可用——就是主耶稣的力量。我所要做的只是与祂接触，并与祂保持联络。即使我仅用信心的一根小指头抓住，也足能使祂的能力成为我的，去完成那现在正压垮我的服事。」——摘自《丰盛目标的人生》",
              "simpEn": "Then a thought flashed through my mind: 'I am like that boy on the bicycle—weary and weak, pedaling uphill against all opposition, almost worn out. But nearby is great power—the strength of the Lord Jesus. All I need is to get in touch with Him and stay connected. Even if I only grab hold with one little finger of faith, it will be enough to make His power mine to accomplish what now overwhelms me.'",
              "simpZh": "接着我脑海里闪过一个念头：‘我就像那个骑车的男孩，又累又弱，正顶着各种反对往上踩，几乎筋疲力尽了。但旁边就有大能可用——主耶稣的力量。我所要做的就是与祂接触，保持和祂的连接。即使我只用信心的一根小指头抓住，也足以使祂的能力成为我的，去完成那现在正压垮我的服事。’"
            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Utterly abandoned\">Utterly abandoned<\/span> to the Holy Ghost! <br>Seeking all His fullness, whatever the cost; <br>Cutting all the <span class=\"vocab-trigger\" data-vocab=\"moorings\">moorings<\/span>, launching in the deep <br>Of His mighty power—strong to save and keep. <br>Utterly abandoned to the Holy Ghost! <br>Oh! The sinking, sinking, until self is lost! <br>Until the emptied vessel lies broken at His feet; <br>Waiting till His filling shall make the work complete. <br>Utterly abandoned to the will of God; <br>Seeking for no other path than my Master trod; <br>Leaving ease and pleasure, making Him my choice, <br>Waiting for His guidance, listening for His voice. <br>Utterly abandoned! No will of my own; <br>For time and for eternity, His, and His alone; <br>All my plans and purposes lost in His sweet will, <br>Having nothing, yet in Him all things possessing still. <br>Utterly abandoned! It's so sweet to be <br>Captive in His bonds of love, yet <span class=\"vocab-trigger\" data-vocab=\"wondrously\">wondrously<\/span> free; <br>Free from sin's <span class=\"vocab-trigger\" data-vocab=\"entanglements\">entanglements<\/span>, free from doubt and fear, <br>Free from every worry, burden, grief, or care. <br>—author unknown",
              "zh": "全然弃绝给圣灵！寻求祂一切的丰盛，不计代价；砍断所有缆绳，开航到祂大能的深处——有力拯救，有力保守。全然弃绝给圣灵！哦！沉下，沉下，直到自我消失！直到那倒空的器皿破碎在祂脚前；等候直到祂的充满使工作完全。全然弃绝给神的旨意；只寻求我主走过的道路；离开安逸和享乐，拣选祂；等候祂的引导，倾听祂的声音。全然弃绝！没有我自己的意思；为今时也为永世，是祂的，单单是祂的；我所有的计划和目的都消失在祂甘甜的旨意中，一无所有，却在祂里面拥有一切。全然弃绝！作祂爱索中的俘虏，却有奇妙的自由，何等甘甜；脱开罪的缠累，脱开疑惑和恐惧，脱开各样忧虑、重担、忧伤和挂虑。——佚名",
              "simpEn": "Completely given up to the Holy Spirit! Seeking all His fullness, whatever it costs. Cutting all ties, launching into the deep of His mighty power. Letting self sink until the empty vessel lies broken at His feet, waiting for His filling. Given up to God's will, wanting no path but my Master's. Leaving ease and pleasure, choosing Him, waiting for His voice. No will of my own—His alone. All my plans lost in His sweet will. Having nothing, yet possessing all in Him. Sweet to be captive in His love, yet wonderfully free from sin, doubt, fear, and every worry.",
              "simpZh": "完全放弃给圣灵！付任何代价寻求祂一切的丰盛。砍断所有缆绳，开进祂大能的深处。让自我沉下去，直到空了的器皿碎在祂脚前，等祂来充满。完全放弃给神的旨意，不走别的路，只走我主走过的路。放下安逸和享乐，选择祂，等祂引导，听祂声音。没有自己的意思——全是祂的。所有计划和目的消失在祂甘甜的旨意里，什么都没有了，却在祂里面拥有一切。作祂爱中的俘虏，却奇妙地自由，脱离罪、疑惑、恐惧和各样忧虑。"
            }

              "en": "He did not waver . . . regarding the promise . . . , being <span class=\"vocab-trigger\" data-vocab=\"fully persuaded\">fully persuaded<\/span> that God had power to do what he had promised. (Romans 4:20–21)",
              "zh": "他……对于神的应许总没有因不信而动摇……且满心相信神所应许的必能做成。（罗马书4:20-21）",
              "simpEn": "He did not waver regarding the promise, being completely sure that God had power to do what He had promised.",

            {
              "en": "Scripture tells us that Abraham, \"without weakening in his faith, . . . faced the fact that his body was as good as dead\" (v. 19). He was not discouraged, because he was not looking at himself but at almighty God. \"He did not waver . . . regarding the promise\" but stood straight, not bending beneath the <span class=\"vocab-trigger\" data-vocab=\"staggering load\">staggering load<\/span> of God's blessing. Instead of growing weak, his faith grew stronger, exhibiting more power, even as more difficulties became apparent. Abraham glorified God for His complete <span class=\"vocab-trigger\" data-vocab=\"sufficiency\">sufficiency<\/span> and was \"fully persuaded that God had power to do what he had promised.\"",
              "zh": "圣经告诉我们，亚伯拉罕「虽然想到自己的身体如同已死……他的信心还是不软弱」（19节）。他不灰心，因为他不是看自己，而是仰望全能的神。「他对……应许总没有因不信而动摇」，反而站得笔直，不因神祝福那令人震惊的重担而弯腰。他的信心不但没有变弱，反而更加坚固，显出更大的能力，即便困难变得更加明显。亚伯拉罕因神的全然充足而荣耀祂，并「满心相信神所应许的必能做成」。",
              "simpEn": "Scripture says Abraham, without weakening in faith, faced the fact that his body was as good as dead. He wasn't discouraged, because he looked not at himself but at almighty God. He didn't waver at the promise but stood straight under the staggering weight of God's blessing. Instead of growing weak, his faith grew stronger, showing more power as difficulties increased. He glorified God for His complete sufficiency and was fully sure God had power to do what He promised.",
              "simpZh": "圣经告诉我们，亚伯拉罕虽然知道自己身体如同已死，信心却没有软弱。他不灰心，因为他不是看自己而是仰望全能的神。他对神的应许没有动摇，在神祝福那压人的重担下仍站得笔直。他没有变弱，反而信心更坚固，显出更大的能力，虽然困难变得更明显。亚伯拉罕因神完全的充足而荣耀祂，并且满心相信神有力量做到祂所应许的事。"

            {
              "en": "The literal translation of this passage from the Greek expresses the thought in this way: God is not merely able but <span class=\"vocab-trigger\" data-vocab=\"abundantly able\">abundantly able<\/span>, <span class=\"vocab-trigger\" data-vocab=\"bountifully\">bountifully<\/span> and generously able, with an <span class=\"vocab-trigger\" data-vocab=\"infinite surplus\">infinite surplus<\/span> of resources, and eternally able \"to do what he had promised.\" He is the God of <span class=\"vocab-trigger\" data-vocab=\"limitless resources\">limitless resources<\/span>—the only limit comes from us. Our requests, our thoughts, and our prayers are too small, and our expectations are too low. God is trying to raise our vision to a higher level, call us to have greater expectations, and thereby bring us to greater <span class=\"vocab-trigger\" data-vocab=\"appropriation\">appropriation<\/span>. Shall we continue living in a way that <span class=\"vocab-trigger\" data-vocab=\"mocks\">mocks<\/span> His will and denies His Word?",
              "zh": "这段经文希腊文的直译表达了这样的意思：神不仅是能，而且是丰丰足足地能，慷慨大度地能，拥有无限过剩的资源，并且永远地能「做成祂所应许的」。祂是无限资源的神——唯一的限制来自我们。我们的请求、思想和祷告都太小，我们的期望太低。神正试图将我们的眼光提升到更高层次，呼召我们有更大的期望，从而带我们进入更大的支取。我们还要继续以一种嘲笑祂的旨意、否认祂话语的方式生活吗？",
              "simpEn": "The literal Greek says God is not just able, but abundantly able, bountifully and generously able, with an infinite surplus of resources, and eternally able to do what He promised. He is the God of limitless resources—the only limits come from us. Our requests, thoughts, and prayers are too small, our expectations too low. God wants to raise our vision higher, call us to greater expectations, and bring us to take more. Will we keep living in a way that mocks His will and denies His Word?",
              "simpZh": "这段经文的希腊文直译说，神不单能，而且是丰丰富富地能，慷慨大方地能，拥有无限多余的资源，并且永远能做成祂所应许的事。祂是资源无限的神——唯一的限制来自我们。我们的请求、思想和祷告都太小，我们的期望太低。神正试图把我们的眼光提升到更高，呼召我们有更大的期望，从而让我们更多地支取。我们还要继续过着那种嘲笑祂的旨意、否认祂话语的生活吗？"

              "zh": "我们向荣耀的全能者——我们的全能之神——所能求、所能期望的，没有限量。我们也无法量度祂的祝福，因为祂「能照着运行在我们心里的大力充充足足地成就一切，超过我们所求所想的」（弗3:20）。——宣信",

              "simpZh": "我们能向荣耀的全能神求什么、期待什么，是没有限量的。我们无法量度祂的祝福，因为祂‘能照着运行在我们心里的大力，充充足足地成就一切，超过我们所求所想的’（弗3:20）。"

          "paragraphs": [
            {
              "en": "He knows the way that I take. (Job 23:10)",
              "zh": "祂知道我所行的路。（约伯记23:10）",

            {
              "en": "O believer, what a glorious <span class=\"vocab-trigger\" data-vocab=\"assurance\">assurance<\/span> this verse is! What confidence I have because \"the way that I take\"—this way of trials and tears, however <span class=\"vocab-trigger\" data-vocab=\"winding\">winding<\/span>, hidden, or tangled—\"He knows\"! When the \"furnace [is] heated seven times hotter than usual\" (Dan. 3:19), I can know He still lights my way. There is an almighty Guide who knows and directs my steps, whether they lead to the bitter water at the well of <span class=\"vocab-trigger\" data-vocab=\"Marah\">Marah<\/span> or to the joy and <span class=\"vocab-trigger\" data-vocab=\"refreshment\">refreshment<\/span> of the <span class=\"vocab-trigger\" data-vocab=\"oasis\">oasis<\/span> at <span class=\"vocab-trigger\" data-vocab=\"Elim\">Elim<\/span> (see Ex. 15:23, 27).",
              "zh": "哦，信徒，这节经文是何等荣耀的保证！我因「我所行的路」——这条充满试炼和眼泪的路，无论多么蜿蜒、隐藏或纠缠——「祂知道」，而有怎样的信心！当火窑「比寻常更加七倍」（但3:19）时，我仍知道祂照亮我的道路。有一位全能的向导知道并指引我的脚步，无论是引到玛拉苦水的井边，还是到以琳绿洲的喜乐与畅快之中（见出15:23,27）。",
              "simpEn": "Believer, what a glorious promise this is! I have confidence because the way I take—this path of trials and tears, no matter how winding or hidden—He knows it. When the furnace is seven times hotter, He still lights my way. An almighty Guide directs my steps, whether to bitter water or to the refreshing oasis.",
              "simpZh": "信徒啊，这节经文是多么荣耀的保证！我有信心，因为我所走的路——这条充满试炼和眼泪的路，不管多曲折、隐藏或乱成一团——祂都知道！当火窑比平常热七倍时，祂仍然照亮我的路。有一位全能的向导指引我的脚步，无论是去苦水的井边还是去欢畅的绿洲。"
            },
            {
              "en": "The way is dark to the Egyptians yet has its own <span class=\"vocab-trigger\" data-vocab=\"pillar of cloud and fire\">pillar of cloud and fire<\/span> for God's Israel. The furnace may be hot, but not only can I trust the hand that lights the fire, I can also have the assurance the fire will not consume but only <span class=\"vocab-trigger\" data-vocab=\"refine\">refine<\/span>. And when the refining process is complete, not a moment too soon or too late, \"<span class=\"vocab-trigger\" data-vocab=\"I will come forth as gold\">I will come forth as gold<\/span>\" (Job 23:10).",
              "zh": "这条路对埃及人是黑暗的，对神的以色列却有它自己的云柱火柱。火窑可能很热，但我不仅能信靠那点火的手，我还可以有把握这火不会烧毁，只会炼净。当炼净的过程完成时，不早也不迟，「我必如精金」（约伯记23:10）。",
              "simpEn": "The way is dark for Egyptians but has its pillar of cloud and fire for Israel. The furnace is hot, but I trust the hand that lights it and know the fire will not consume, only refine. When the process is done, I will come out as gold.",
              "simpZh": "这条路对埃及人是黑暗的，但对神的以色列却有云柱火柱。火窑很热，但我不仅信靠那点火的手，也确信火不会烧灭我，只会炼净我。当炼净的过程完成时，我必如精金。"

              "en": "When I feel God is the farthest away, He is often the nearest to me. \"When my spirit grows faint within me, it is you who know my way\" (Ps. 142:3). Do we know of another who shines brighter than the most <span class=\"vocab-trigger\" data-vocab=\"radiant\">radiant<\/span> sunlight, who meets us in our room with the first waking light, who has an infinitely tender and compassionate watchfulness over us throughout our day, and who \"knows the way that [we] take\"?",

              "simpZh": "当我感觉神离我最远时，祂常常是最近。‘我的灵在我里面发昏时，你知道我的路’（诗142:3）。我们还能认识另一位比最亮的阳光更亮、在天初亮时就迎见我们、全天以无限的温柔和怜悯看顾我们、并且知道我走的路的吗？"

            {
              "en": "The world, during a time of adversity, speaks of \"<span class=\"vocab-trigger\" data-vocab=\"providence\">providence<\/span>\" with a total lack of understanding. They <span class=\"vocab-trigger\" data-vocab=\"dethrone\">dethrone<\/span> God, who is the living, guiding <span class=\"vocab-trigger\" data-vocab=\"Sovereign\">Sovereign<\/span> of the universe, to some <span class=\"vocab-trigger\" data-vocab=\"inanimate\">inanimate<\/span>, dead <span class=\"vocab-trigger\" data-vocab=\"abstraction\">abstraction<\/span>. What they call \"providence\" they see as occurrences of fate, reducing God from His position as our acting, powerful, and personal Jehovah.",
              "zh": "世人在逆境中说「天意」，却完全不明白。他们将那位活的、引导宇宙的主权之神贬为某种无生命的、死寂的抽象概念。他们所谓「天意」不过是命运的遭际，把神从祂那行动、大能、有位格的耶和华的地位上拉下来。",
              "simpEn": "During adversity, the world talks of 'providence' without understanding. They dethrone the living, guiding God to a dead abstraction. They see fate instead of our powerful, personal Jehovah.",
              "simpZh": "世人在逆境中谈论‘天意’，却完全不懂。他们把那位活的、引导宇宙的主权神贬成一种无生命的空洞概念。他们把‘天意’看成命运，把神从祂那行动、大能、有位格的耶和华的地位上拉下来。"
            },
            {
              "en": "The pain would be removed from many an <span class=\"vocab-trigger\" data-vocab=\"agonizing trial\">agonizing trial<\/span> if only I could see what Job saw during his time of severe <span class=\"vocab-trigger\" data-vocab=\"affliction\">affliction<\/span>, when all earthly hope lay <span class=\"vocab-trigger\" data-vocab=\"dashed\">dashed<\/span> at his feet. He saw nothing but the hand of God—God's hand behind the swords of the Sabeans who attacked his servants and cattle, and behind the devastating lightning; God's hand giving wings to the mighty desert winds, which swept away his children; and God's hand in the dreadful silence of his shattered home. Thus, seeing God in everything, Job could say, \"The Lord gave and the Lord has taken away; may the name of the Lord be praised\" (Job 1:21). Yet his faith reached its <span class=\"vocab-trigger\" data-vocab=\"zenith\">zenith<\/span> when this once-powerful prince of the desert \"sat among the ashes\" (Job 2:8) and still could say, \"Though he slay me, yet will I hope in him\" (Job 13:15). —J. R. Macduff.",
              "zh": "如果在极度痛苦的试炼中，我能看见约伯在严重患难时所看见的，当一切属地盼望都粉碎在他脚前时，痛苦就会从许多磨难中除去。约伯只看见神的手——在攻击他仆人和牲畜的示巴人刀剑背后是神的手，在毁坏性的闪电背后是神的手；神的手给大力的沙漠之风翅膀，卷走了他的儿女；在他破碎家庭的可怕寂静中，也是神的手。因此，约伯在万事中看见神，就能说：「赏赐的是耶和华，收取的也是耶和华；耶和华的名是应当称颂的」（伯1:21）。而当他这位昔日大有权势的沙漠之主「坐在炉灰中」（伯2:8），仍能说：「祂虽杀我，我仍要仰望祂」（伯13:15）时，他的信心达到了巅峰。——J. R. 麦克达夫",
              "simpEn": "Pain would be removed from many trials if we saw what Job saw when all earthly hope lay shattered at his feet. He saw nothing but God's hand—behind the swords, lightning, desert winds, and the silence of his broken home. Seeing God in everything, he praised Him. His faith reached its peak when sitting in ashes, still trusting God even if He slay him.",
              "simpZh": "如果我能像约伯那样，在一切地上的盼望都粉碎在脚前时，看见他所看见的，许多痛苦试炼中的疼痛就会被拿掉。他只见神的手——在刀剑、闪电、沙漠大风背后，在破碎家庭的死寂中。在万事中看见神，约伯就能赞美。当他坐在灰中仍说‘祂虽杀我，我却要仰望祂’时，他的信心达到了顶峰。"

            },
            {
              "en": "The Hebrew of this verse literally means to \"go on in the center of trouble.\" What descriptive words! And once we have called on God during our time of trouble, <span class=\"vocab-trigger\" data-vocab=\"pleaded\">pleaded<\/span> His promise of deliverance but not received it, and continued to be <span class=\"vocab-trigger\" data-vocab=\"oppressed\">oppressed<\/span> by the Enemy until we are in the very <span class=\"vocab-trigger\" data-vocab=\"thick of the battle\">thick of the battle<\/span>—or the \"center of trouble\"—others may tell us, \"Don't bother the teacher any more\" (Luke 8:49).",
              "zh": "这节经文希伯来原文直译是「在患难的正当中行走」。多么形象的描述！当我们在患难中呼求神，恳求祂拯救的应许却未得着，继续受仇敌压迫，直到我们身处战斗的最激烈处——也就是「患难的正中心」——别人可能对我们说：「不要再麻烦先生了」（路8:49）。",
              "simpEn": "The Hebrew literally means 'go on in the center of trouble.' When we pray, plead the promise, but still face oppression until we're in the thick of the battle, others may say, 'Don't bother the teacher anymore' (Luke 8:49).",
              "simpZh": "希伯来原文的意思是‘在患难的正中央行走’。我们祷告、恳求应许，却仍受压直到身陷战斗最激烈处，别人可能说：‘不要再麻烦先生了’（路8:49）。"
            },
            {
              "en": "When Martha said, \"Lord, ... if you had been here, my brother would not have died\" (John 11:21), Jesus <span class=\"vocab-trigger\" data-vocab=\"countered\">countered<\/span> her lack of hope with His greater promise, \"Your brother will rise again\" (John 11:23). And when we walk \"in the center of trouble\" and are tempted to think, like Martha, that we are past the point of ever being delivered, our Lord also answers us with a promise from His Word: \"Though I walk in the midst of trouble, you preserve my life.\"",
              "zh": "当马大说：「主啊，祢若早在这里，我兄弟必不死」（约11:21）时，耶稣以更大的应许回应了她缺欠的盼望：「你兄弟必然复活」（约11:23）。当我们走在「患难的正中心」，并像马大一样受试探，以为我们已过了蒙拯救的时刻，我们的主也用祂话语中的应许回答我们：「我虽行在患难中，祢必将我救活。」",
              "simpEn": "When Martha said, 'Lord, if You had been here, my brother would not have died' (John 11:21), Jesus countered with a greater promise. When we walk 'in the center of trouble,' thinking we're past deliverance, God answers: 'Though I walk in the midst of trouble, You preserve my life.'",
              "simpZh": "当马大说‘主啊，你若早在这里，我兄弟必不死’时，耶稣用更大的应许回答她。当我们走在‘患难的正中央’，像马大一样以为已经没救了，神也用应许回答：‘我虽行在患难中，你必将我救活。’"
            },
            {
              "en": "Although His answer seems so long in coming and we continue to \"walk in the midst of trouble,\" \"the center of trouble\" is the place where He <span class=\"vocab-trigger\" data-vocab=\"preserves\">preserves<\/span> us, not the place where He fails us. The times we continue to walk in seemingly <span class=\"vocab-trigger\" data-vocab=\"utter hopelessness\">utter hopelessness<\/span> are the very times He will \"stretch out [His] hand against the anger of [our] foes\" (Ps. 138:7). He will bring our trouble to completion, causing the Enemy's attack to cease and to fail. In light of this, what reason would there ever be for despair? —Aphra White",
              "zh": "虽然祂的答复似乎来得极慢，我们继续「行在患难中」，但「患难的中心」正是祂保守我们的地方，而不是祂使我们失望的地方。我们看似行在完全无望中的时候，正是祂「伸手抵挡我们仇敌的怒气」（诗138:7）的时候。祂必将我们的患难带到终结，使仇敌的攻击停止并失败。既然如此，还有任何理由绝望吗？——阿夫拉·怀特",
              "simpEn": "Though the answer seems long in coming, 'the center of trouble' is where He preserves us, not fails us. When we walk in apparent total hopelessness, He will stretch out His hand against our foes. He will complete our trouble, stopping the Enemy's attack. So why despair?",
              "simpZh": "虽然回应似乎很久才来，我们继续‘行在患难中’，但‘患难的中心’正是祂保守我们的地方，不是祂叫我们失望的地方。我们看似在完全绝望中行走时，正是祂伸手抵挡仇敌的时候。祂会使患难终结，让仇敌攻击停止。既然如此，还有什么理由绝望呢？"
            },
            {
              "en": "The Eye of the Storm <br>Fear not that the <span class=\"vocab-trigger\" data-vocab=\"whirlwind\">whirlwind<\/span> will carry you hence, <br>Nor wait for its <span class=\"vocab-trigger\" data-vocab=\"onslaught\">onslaught<\/span> in breathless suspense, <br>Nor shrink from the <span class=\"vocab-trigger\" data-vocab=\"blight\">blight<\/span> of the terrible hail, <br>But pass through the edge to the heart of the tale, <br>For there is a shelter, <span class=\"vocab-trigger\" data-vocab=\"sunlighted\">sunlighted<\/span> and warm, <br>And Faith sees her God through the eye of the storm. <br>... <br>Let hope be not <span class=\"vocab-trigger\" data-vocab=\"quenched\">quenched<\/span> in the blackness of night, <br>Though the <span class=\"vocab-trigger\" data-vocab=\"cyclone\">cyclone<\/span> awhile may have blotted the light, <br>For behind the great darkness the stars ever shine, <br>And the light of God's heavens, His love will make thine, <br>Let no gloom dim your eyes, but uplift them on high <br>To the face of your God and the blue of His sky. <br>The storm is your shelter from danger and sin, <br>And God Himself takes you for safety within; <br>The tempest with Him passes into deep calm, <br>And the roar of the winds is the sound of a psalm. <br>Be glad and <span class=\"vocab-trigger\" data-vocab=\"serene\">serene<\/span> when the tempest clouds form; <br>God smiles on His child in the eye of the storm.",
              "zh": "暴风之眼。不要怕旋风将你带走，也不要屏息等候它的冲击，不要因可怕的冰雹而退缩，乃要穿过边缘进入故事的心怀，因为那里有光照着的温暖庇护所，信心透过暴风之眼看见她的神。……不要在黑夜中失去盼望，尽管旋风一时遮住了光，因为在极大的黑暗背后，星星仍在闪耀，神天上的光、祂的爱必成为你的光。不要让幽暗模糊你的眼睛，要向高处举目，仰望你的神和祂蔚蓝的天空。风暴是你远离危险与罪的避难所，神亲自将你纳入安全之中；暴风与祂同逝，转入深深的平静，狂风的怒吼成了诗歌的乐声。当暴风乌云聚集时，要欢喜而安宁；神在暴风之眼中向祂的孩子微笑。",
              "simpEn": "The Eye of the Storm. Don't fear the whirlwind, don't shrink from the hail. Pass through the edge to the heart of the storm, for there is a shelter, warm and sunlit, and Faith sees God in the eye of the storm. Don't let hope die in the black night; behind the darkness stars still shine. God's light will be yours. Look up to the face of God. The storm is your shelter; God takes you inside. The tempest becomes deep calm, and the wind's roar becomes a psalm. Be glad and serene when storm clouds form; God smiles on His child in the eye of the storm.",
              "simpZh": "暴风之眼。不要怕旋风把你带走，不要因冰雹退缩。穿过边缘进入风暴的中心，那里有一个温暖明亮的避难所，信心在暴风之眼中看见神。不要在黑夜中失去盼望；黑暗背后星星还在闪耀，神天上的光必成为你的光。向高处看神的脸。风暴是你的避难所，神把你带进安全里。暴风变成深深的平静，狂风的怒吼成了诗歌的声音。乌云聚集时要欢喜安宁；神在暴风之眼里向祂的孩子微笑。"
            }

        {
          "sectionId": 3,
          "heading": "April 24",
          "audio": "audio/Streams in the Desert - April 24.m4a",
          "paragraphs": [
            {
              "en": "Faith is being ... certain of what we do not see. (Hebrews 11:1)",
              "zh": "信就是……未见之事的确据。（希伯来书11:1）",
              "simpEn": "Faith is being sure of what we do not see.",
              "simpZh": "信心就是对我们没看见的事有把握。"

            {
              "en": "Genuine faith puts its letter in the mailbox and lets go. <span class=\"vocab-trigger\" data-vocab=\"Distrust\">Distrust<\/span>, however, holds on to a corner of the envelope and then wonders why the answer never arrives. There are some letters on my desk that I wrote weeks ago, but I have yet to mail them because of my uncertainty over the address or the contents. Those letters have not done any good for me or anyone else at this point. And they never will accomplish anything until I let go of them, trusting them to the postal service.",
              "zh": "真实的信心把信放进邮筒，然后放手。然而，疑惑却抓住信封的一个角不放，然后又奇怪为什么答复永不到来。我桌上有几封几周前写的信，但由于我对地址或内容不确定，至今仍未寄出。到目前为止，这些信对我或对其他任何人都毫无益处。除非我放手把它们交托给邮政系统，它们就永远不会成就任何事情。",
              "simpEn": "Real faith puts its letter in the mailbox and lets go. Distrust holds on to a corner and wonders why no answer comes. Some letters on my desk were written weeks ago but never mailed because of my uncertainty. They've done no good. They won't until I let go and trust the postal service.",
              "simpZh": "真的信心把信放进邮箱就放手了。疑惑却抓住信封一角不放，然后奇怪为什么回信总不来。我桌上有几封信几周前写的，但因为不确定地址或内容，一直没有寄出去。这些信到现在对我对别人都没有好处。除非我放手把它们交给邮局，否则永远不会有结果。"
            },
            {
              "en": "It is the same with genuine faith. It hands its circumstance over to God, allowing Him to work. Psalm 37:5 is a great confirmation of this: \"<span class=\"vocab-trigger\" data-vocab=\"Commit your way to the Lord\">Commit your way to the Lord<\/span>; trust in him and he will do this.\" He will never work until we <span class=\"vocab-trigger\" data-vocab=\"commit\">commit<\/span>. Faith is receiving—or even more, actually <span class=\"vocab-trigger\" data-vocab=\"appropriating\">appropriating<\/span>—the gifts God offers us. We may believe in Him, come to Him, commit to Him, and rest in Him, but we will never fully realize all our blessings until we begin to receive from Him and come to Him having the spirit of <span class=\"vocab-trigger\" data-vocab=\"abiding\">abiding<\/span> and appropriating. —from Days of Heaven upon Earth",
              "zh": "真实的信心也是如此。它将处境交在神手中，让祂作工。诗篇37:5是对此的极佳证实：「当将你的事交托耶和华，并倚靠祂，祂就必成全。」直到我们交托，祂绝不工作。信心就是接受——更确切地说，是实实在在地支取——神所赐给我们的恩赐。我们可能信祂，来到祂面前，向祂委身，在祂里面安息，但只有当我们开始从祂领受，并以常居和支取的心来到祂面前时，我们才完全认识我们所有的福分。——摘自《在地如天》",
              "simpEn": "Faith hands the circumstance to God. Psalm 37:5: 'Commit your way to the Lord; trust in Him and He will do this.' God won't work until we commit. Faith is receiving and appropriating God's gifts. We may believe, come to Him, and rest in Him, but we only fully realize blessings when we receive with a spirit of abiding.",
              "simpZh": "信心把环境交给神，让祂工作。诗篇37:5：‘当将你的事交托耶和华，倚靠祂，祂就必成全。’我们不交托，神就不作工。信心是接受并支取神所给的恩赐。我们可能信祂，来到祂面前，安息在祂里面，但只有开始领受并以常住和支取的心来就近祂时，才真正认识到所有的祝福。"
            },
            {
              "en": "Dr. Payson, while still a young man, once wrote to an elderly mother who was extremely worried and <span class=\"vocab-trigger\" data-vocab=\"burdened\">burdened<\/span> over the condition of her son. He wrote, \"You are worrying too much about him. Once you have prayed for him, as you have done, and committed him to God, you should not continue to be anxious. God's command, '<span class=\"vocab-trigger\" data-vocab=\"Do not be anxious about anything\">Do not be anxious about anything<\/span>' (Phil. 4:6), is unlimited, and so is the verse, '<span class=\"vocab-trigger\" data-vocab=\"Cast all your anxiety on him\">Cast all your anxiety on him<\/span>' (1 Peter 5:7). If we truly have cast our burdens upon another, can they continue to pressure us? If we carry them with us from the throne of grace, it is obvious we have not left them there. In my own life I test my prayers in this way: after committing something to God, if I can come away, like Hannah did, with no more sadness, pain, or anxiety in my heart, I see it as proof that I have prayed the prayer of faith. But if I pray and then still carry my burden, I conclude my faith was not exercised.\"",
              "zh": "裴森博士年轻时曾写信给一位为儿子的状况极其担忧、重负难当的年老母亲。他写道：「你为他太过忧虑了。一旦你为他祷告过，就像你所做的，把他交托给神之后，就不应继续挂虑了。神的命令『应当一无挂虑』（腓4:6）是没有限制的，而经节『你们要将一切的忧虑卸给神』（彼前5:7）也是如此。如果我们果真把重担交给了另一位，它们还能继续压制我们吗？如果我们把它们从施恩宝座那里带回来，显然我们并没有把它们留在那里。在我自己的生活中，我是这样检验我的祷告的：将事情交托给神之后，如果我能像哈拿一样，心中不再有忧愁、痛苦和焦虑地离开，我就视之为我已作了信心祷告的证明。但如果我祷告之后仍然背着我的担子，我就断定我的信心并未运用。」",
              "simpEn": "Dr. Payson wrote to a worried mother: 'You worry too much. Once you've prayed and committed your son to God, don't keep being anxious. God's command not to be anxious is unlimited, and so is casting all anxiety on Him. If we truly cast our burden on another, can it still weigh on us? If we carry it from the throne, we haven't left it there. I test my prayers like this: if, like Hannah, I can leave with no sadness or pain, I prayed in faith. If I still carry the burden, my faith wasn't exercised.'",
              "simpZh": "裴森博士写信给一位为儿子极度担忧的母亲：‘你太忧虑了。一旦你为他祷告，把他交托给神，就不应继续挂虑了。神命令不要为任何事忧虑，把一切忧虑卸给神，这两节经文没有限制。如果我们真把重担交给别人，它们还能压着我们吗？如果我们从施恩宝座把担子带回来，就是没把它留在那里。我这样检验我的祷告：交托给神后，如果我能像哈拿一样心中不再有忧愁痛苦地离开，我就知道这是信心的祷告；如果还背着担子，就是信心没有运用。’"

        {

          "paragraphs": [
            {
              "en": "Mary Magdalene and the other Mary were sitting there opposite the <span class=\"vocab-trigger\" data-vocab=\"tomb\">tomb<\/span>. (Matthew 27:61)",
              "zh": "抹大拉的马利亚和那个马利亚在那里，对着坟墓坐着。（马太福音27:61）",
              "simpEn": "Mary Magdalene and the other Mary sat opposite the tomb.",
              "simpZh": "抹大拉的马利亚和另一个马利亚对着坟墓坐着。"
            },
            {
              "en": "Oh, how slow grief is to come to understanding! Grief is <span class=\"vocab-trigger\" data-vocab=\"ignorant\">ignorant<\/span> and does not even care to learn. When the grieving women \"were sitting there opposite the tomb,\" did they see the triumph of the next two thousand years? Did they see anything except that Christ was gone? The Christ you and I know today came from their loss. Countless mourning hearts have since seen resurrection in the midst of their grief, and yet these sorrowing women watched at the beginning of this result and saw nothing. What they regarded as the end of life was actually the preparation for <span class=\"vocab-trigger\" data-vocab=\"coronation\">coronation<\/span>, for Christ remained silent that He might live again with <span class=\"vocab-trigger\" data-vocab=\"tenfold power\">tenfold power<\/span>.",
              "zh": "哦，忧伤是何等地迟于领会！忧伤是无知的，甚至无心学习。当哀恸的妇女「对着坟墓坐着」时，她们看见此后两千年的胜利了吗？除了基督已离去之外，她们还看见什么吗？你和今日所认识的基督，是从她们的损失中出来的。自那以后无数哀伤的心都在忧伤中看见了复活，然而这些忧伤的妇女却在这结果的开端守望着，一无所见。她们认为是生命的终结，其实是加冕的预备，因为基督保持沉默，为要以十倍的能力复活。",
              "simpEn": "Grief is slow to understand. When the women sat opposite the tomb, did they see the triumph of two thousand years? They only saw that Christ was gone. The Christ we know came from their loss. Many have since seen resurrection in grief, but these women saw nothing. What they thought was the end was preparation for crowning; Christ was silent so He could rise with tenfold power.",
              "simpZh": "忧伤真难明白。当妇女们对着坟墓坐着时，她们看见两千年后的胜利了吗？她们只看见基督走了。我们今天认识的基督是从她们的损失中出来的。后来无数忧伤的心在忧伤中看见了复活，但那些忧伤的妇女起初却什么都没看见。她们以为是终结的，其实是加冕的预备；基督保持沉默，是为了以十倍的能力复活。"
            },
            {
              "en": "They did not see it. They mourned, wept, went away, and then came again to the <span class=\"vocab-trigger\" data-vocab=\"sepulcher\">sepulcher<\/span>, driven by their broken hearts. And still it was only a tomb—<span class=\"vocab-trigger\" data-vocab=\"unprophetic\">unprophetic<\/span>, voiceless, and <span class=\"vocab-trigger\" data-vocab=\"drab\">drab<\/span>. It is the same with us. Each of us sits \"opposite the tomb\" in our own garden and initially says, \"This tragedy is <span class=\"vocab-trigger\" data-vocab=\"irreparable\">irreparable<\/span>. I see no benefit in it and will take no comfort in it.\" And yet right in the midst of our deepest and worst adversities, our Christ is often just lying there, waiting to be resurrected.",
              "zh": "她们没有看见。她们哀哭、流泪、离开，然后被破碎的心驱使，再次来到坟墓那里。那仍只是一个坟墓——无预言、无声息、灰暗。我们也是一样。我们各人都在自己的园子里「对着坟墓」坐着，起初说：「这场悲剧无法弥补。我看不出其中有什么益处，也不从中取任何安慰。」然而，就在我们最深沉、最糟糕的逆境正中，我们的基督往往就躺卧在那里，等候复活。",
              "simpEn": "They didn't see it. They mourned, wept, went away, and returned, driven by broken hearts. It was still just a tomb—silent, dull. So with us. We each sit 'opposite the tomb' and say, 'This tragedy can't be fixed. I see no good in it.' Yet in our deepest adversity, Christ is lying there, waiting to be resurrected.",
              "simpZh": "她们没看见。她们哀哭、流泪、离开，又被破碎的心带回来。那还只是一个坟墓——没有预言，没有声音，灰暗。我们也是这样。每个人都坐在自己园子里的‘坟墓对面’，起初说：‘这个悲剧无法弥补，我看不见任何益处，也不从中得安慰。’然而就在我们最深的逆境中，基督往往就躺在那里，等着复活。"
            },
            {
              "en": "Our Savior is where our death seems to be. At the end of our hope, we find the brightest beginning of fulfillment. Where darkness seems the deepest, the most <span class=\"vocab-trigger\" data-vocab=\"radiant light\">radiant light<\/span> is set to emerge. And once the experience is complete, we find our garden is not <span class=\"vocab-trigger\" data-vocab=\"disfigured\">disfigured<\/span> by the tomb. Our joys are made better when sorrow is in the midst of them. And our sorrows become bright through the joys God has planted around them. At first the flowers of the garden may not appear to be our favorites, but we will learn that they are the flowers of the heart. The flowers planted at the grave deep within the Christian heart are love, hope, faith, joy, and peace.",
              "zh": "我们的救主就在我们似乎死亡之处。在我们盼望的尽头，我们找到了最光明圆满的起点。在黑暗似乎最深之处，最灿烂的光芒正待射出。经历完毕之时，我们发现园子并未被坟墓所毁损。当忧伤在其中时，我们的喜乐就变得更美。而我们的忧伤借着神栽种在其周围的喜乐，也变得光亮。起初园中的花可能并非我们最喜爱的，但我们将学到那些是心灵之花。栽种在基督徒心灵深处的坟墓旁的花朵，就是仁爱、盼望、信心、喜乐、和平安。",
              "simpEn": "Our Savior is where our death seems to be. At the end of hope is the brightest beginning of fulfillment. Where darkness is deepest, the most radiant light is ready to shine. After the experience, the garden is not ruined by the tomb. Sorrows brighten through the joys God plants around them. The flowers at the grave in the Christian heart are love, hope, faith, joy, and peace.",
              "simpZh": "我们的救主就在我们以为死亡的地方。在盼望的尽头，我们找到最光明圆满的开始。在黑暗最深的地方，最灿烂的光正要射出。经历完后，我们发现园子并没有被坟墓毁坏。忧伤中的喜乐变得更美，忧伤也被神栽种在周围的喜乐照亮。起初那些花可能不是我们最喜欢的，但我们会发现它们是心灵之花。基督徒心灵深处坟墓旁的花是仁爱、盼望、信心、喜乐和平安。"
            }

          "sectionId": 5,
          "heading": "April 26",
          "audio": "audio/Streams in the Desert - April 26.m4a",
          "paragraphs": [
            {
              "en": "I consider everything a loss compared to the <span class=\"vocab-trigger\" data-vocab=\"surpassing greatness\">surpassing greatness<\/span> of knowing Christ Jesus my Lord. (Philippians 3:8)",
              "zh": "我也将万事当作有损的，因我以认识我主基督耶稣为至宝。（腓立比书3:8）",
              "simpEn": "I consider everything a loss compared to the greatest thing: knowing Christ Jesus my Lord.",
              "simpZh": "我把万事都看作损失，因为认识我主基督耶稣是最宝贵的事。"
            },
            {
              "en": "Light is always costly and comes at the expense of that which produces it. An unlit candle does not shine, for burning must come before the light. And we can be of little use to others without a cost to ourselves. Burning suggests suffering, and we try to avoid pain. We tend to feel we are doing the greatest good in the world when we are strong and fit for active duty and when our hearts and hands are busy with kind acts of service. Therefore when we are set aside to suffer, when we are sick, when we are <span class=\"vocab-trigger\" data-vocab=\"consumed with pain\">consumed with pain<\/span>, and when all our activities have been stopped, we feel we are no longer of any use and are accomplishing nothing.",
              "zh": "光总是昂贵的，是以产生它的东西为代价的。未点燃的蜡烛不会发光，因为燃烧必须在光照之前。而我们若不对自己付出代价，就几乎不能造就他人。燃烧意味着受苦，而我们试图逃避疼痛。我们常觉得，当我们强壮、适合活动，当我们的心和手忙着从事善工服事时，我们正对世界做出最大的贡献。因此，当我们被搁置一边去受苦，当我们生病，当我们被疼痛吞噬，当一切活动都被停息时，我们觉得自己不再有任何用处，什么也没有成就。",
              "simpEn": "Light is costly; it comes at the expense of what makes it. An unlit candle doesn't shine; burning comes before light. We are of little use without cost. Burning means suffering, and we avoid pain. We think we do the most good when strong and active. So when we are set aside to suffer, sick, consumed with pain, all activities stopped, we feel useless.",
              "simpZh": "光总是昂贵的，要付上产生它的代价。没点着的蜡烛不发光，燃烧必须在光照之前。我们不付代价就不能对别人有用。燃烧就是受苦，我们却想逃避痛苦。我们总以为强壮、忙着行善时最有用。所以当我们被放在一边受苦、生病、被疼痛吞噬、所有活动都停止时，就觉得自己没用了，什么也没做成。"
            },
            {
              "en": "Yet if we will be patient and <span class=\"vocab-trigger\" data-vocab=\"submissive\">submissive<\/span>, it is almost certain we will be a greater blessing to the world around us during our time of suffering and pain than we were when we thought we were doing our greatest work. Then we are burning, and shining brightly as a result of the fire. —from Evening Thoughts",
              "zh": "然而，如果我们肯忍耐顺服，几乎可以确定，我们在痛苦患难期间，对周围世界的祝福，要比我们自以为做最大工作时更大。那时我们是在燃烧，并因这火而灿烂发光。——摘自《晚间默想》",
              "simpEn": "But if we are patient and submissive, we will likely be a greater blessing during suffering than when we thought we did our greatest work. Then we are burning, shining brightly from the fire.",
              "simpZh": "如果我们能忍耐顺服，几乎可以肯定，我们在受苦时对周围世界的祝福，比我们自以为最有用时更大。那时我们在燃烧，因着火而发光。"
            },
            {
              "en": "The glory of tomorrow is rooted in the <span class=\"vocab-trigger\" data-vocab=\"drudgery\">drudgery<\/span> of today. Many people want the glory without the cross, and the shining light without the burning fire, but <span class=\"vocab-trigger\" data-vocab=\"crucifixion\">crucifixion<\/span> comes before coronation. Have you heard the tale of the <span class=\"vocab-trigger\" data-vocab=\"aloe plant\">aloe plant<\/span>, away in the sunny <span class=\"vocab-trigger\" data-vocab=\"clime\">clime<\/span>? By humble growth of a hundred years it reaches its blooming time; and then a wondrous bud at its crown breaks into a thousand flowers; this floral queen, in its blooming seen, is the pride of the tropical <span class=\"vocab-trigger\" data-vocab=\"bowers\">bowers<\/span>, but the flower to the plant is sacrifice, for it blooms but once, and it dies. ... Have you heard the tale of the <span class=\"vocab-trigger\" data-vocab=\"pelican\">pelican<\/span>, the Arabs' Gimel el Bahr, that lives in the African <span class=\"vocab-trigger\" data-vocab=\"solitudes\">solitudes<\/span>? ... In famine it feeds them—what love can devise! The blood of its <span class=\"vocab-trigger\" data-vocab=\"bosom\">bosom<\/span>—and, feeding them, dies. ... Have you heard this tale—the best of them all—the tale of the Holy and True, He dies, but His life, in untold souls lives on in the world anew; His seed prevails, and is filling the earth, as the stars fill the sky above. He taught us to yield up the love of life, for the sake of the life of love. His death is our life, His loss is our gain; the joy for the tear, the peace for the pain.",
              "zh": "明日的荣耀根植于今日的劳苦。许多人想要荣耀却没有十字架，想要发光却没有燃烧的火，但钉死是在加冕之先。你听说过那生在远方阳光地带的芦荟吗？借着百年的谦卑生长，它达到了花期；然后冠顶上一个奇妙的花苞绽放成千朵花；这花中之后，盛开之时，成为热带亭园的骄傲，但这花对植株却是牺牲，因它只开一次便死去了。……你听说过阿拉伯人称为Gimel el Bahr的鹈鹕鸟，那住在非洲荒野中的吗？……在饥荒中它喂养幼雏——何等慈爱能想得出的！用自己胸膛的血——喂养它们，然后死去。……你听过最美好的故事——那位圣洁真实者的故事吗？祂死了，但祂的生命在无数灵魂中活在这世上，重新又活；祂的后裔得胜，遍满地面，如同天上众星。祂教导我们为了爱的生命的缘故，舍弃肉身的生命。祂的死是我们的生，祂的损失是我们的益处；欢欣代替眼泪，平安代替疼痛。",
              "simpEn": "Tomorrow's glory is rooted in today's hard work. Many want glory without the cross, light without fire, but crucifixion comes before crowning. The aloe plant grows a hundred years, then blooms once, sacrifices itself, and dies. The pelican feeds its young with its own blood and dies. Best of all, the Holy and True One died, but His life lives on in countless souls. His seed fills the earth. He taught us to give up life for love. His death is our life; joy for tears, peace for pain.",
              "simpZh": "明天的荣耀根植于今天的苦工。许多人想要荣耀却没有十字架，想要光却没有火，但钉十字架在加冕之前。芦荟生长一百年才开花一次，开完就死了。鹈鹕用自己的血喂养幼雏，然后死去。最美好的故事：那位圣洁真实的主死了，但祂的生命活在无数灵魂里，遍满地面。祂教我们为了爱放弃生命。祂的死是我们的生；眼泪换成喜乐，痛苦换成平安。"
            }

        {
          "sectionId": 6,

          "paragraphs": [
            {
              "en": "I am the Living One; I was dead, and behold I am alive for ever and ever! (Revelation 1:18)",
              "zh": "我是那存活的；我曾死过，现在又活了，直活到永永远远！（启示录1:18）",
              "simpEn": "I am the Living One; I was dead, and look—I am alive forever and ever!",

            },
            {
              "en": "Flowers! Easter lilies! Speak to me this morning the same sweet lesson of <span class=\"vocab-trigger\" data-vocab=\"immortality\">immortality<\/span> you have been speaking to so many sorrowing souls for years. Wise old Book! Let me read again in your pages the steady assurance that \"to die is gain\" (Phil. 1:21). Poets! <span class=\"vocab-trigger\" data-vocab=\"Recite\">Recite<\/span> for me your verses that <span class=\"vocab-trigger\" data-vocab=\"resound\">resound<\/span> the gospel of eternal life in every line. Singers! Break forth once more into hymns of joy—let me hear again my favorite resurrection songs.",
              "zh": "花儿！复活节的百合花！今天早晨请再向我说那同样甜美的永生功课，就是你们多年来向众多忧伤心灵所说的。智慧的古书！容我再次在你扉页中读到「离世与基督同在……是好得无比的」（腓1:23）那稳固的保证。诗人们！请为我朗诵你们每一行都回荡着永生的福音的诗句。歌手们！再次唱出喜乐的圣诗——容我再次听见我最喜爱的复活之歌。",
              "simpEn": "Flowers! Easter lilies! Speak to me the sweet lesson of immortality you've spoken to sorrowing souls for years. Wise Book! Let me read again the sure promise that 'to die is gain.' Poets! Recite your verses of eternal life. Singers! Break out in joyful hymns—let me hear again the songs of resurrection.",
              "simpZh": "花朵！复活节百合！再向我述说你们多年来对忧伤灵魂所说的甜美永生功课吧。智慧的古书！让我再读到你里面‘离世是益处’的坚定保证。诗人！为我朗诵每一行都响彻永生福音的诗句。歌手！再次唱出喜乐的圣诗——让我再听我最喜欢的复活之歌。"
            },
            {
              "en": "Trees, blossoms, and birds; and seas, skies, and winds—whisper it, sound it anew, sing it, echo it, let it beat and <span class=\"vocab-trigger\" data-vocab=\"resonate\">resonate<\/span> through every <span class=\"vocab-trigger\" data-vocab=\"atom and particle\">atom and particle<\/span> on earth, and let the air be filled with it. Let it be told and retold again and again, until hope rises to become <span class=\"vocab-trigger\" data-vocab=\"conviction\">conviction<\/span>, and conviction becomes the certainty of knowing. Let it be told until, like Paul, even when we face our death, we will go <span class=\"vocab-trigger\" data-vocab=\"triumphantly\">triumphantly<\/span>, with our faith secure and a peaceful and <span class=\"vocab-trigger\" data-vocab=\"radiant\">radiant<\/span> expression on our face.",
              "zh": "树木、花朵和飞鸟；海洋、天空和风——低语吧，重新发声吧，歌唱吧，回响吧，让这信息在全地每一原子每一微粒中搏动回荡，让空气也充满了它。让它被一再述说，直到盼望升起成为确信，确信成为确知。让它被述说，直到像保罗一样，即使面对死亡，我们也要以安稳的信心和平静光明的面容凯旋而去。",
              "simpEn": "Trees, blossoms, birds, seas, skies, and winds—whisper it, sing it, echo it, let it beat through every atom on earth, fill the air with it. Tell it again and again until hope becomes conviction, and conviction becomes certainty. Until, like Paul, even facing death, we go triumphantly with secure faith and a radiant face.",
              "simpZh": "树木、花朵、飞鸟、海洋、天空、风——低语、发声、歌唱、回响，让这信息在地球上每一个原子中搏动，让空气充满它。一再述说，直到盼望变成确信，确信变成确知。直到像保罗一样，即使面对死亡，我们也能带着安稳的信心和光明的面容凯旋而去。"
            },
            {
              "en": "O sad-faced mourners, who each day are <span class=\"vocab-trigger\" data-vocab=\"wending\">wending<\/span> <br>Through churchyard paths of cypress and of yew, <br>Leave for today the low graves you are tending, <br>And lift your eyes to God's eternal blue! <br>It is no time for bitterness or sadness; <br>Choose Easter lilies, not pale <span class=\"vocab-trigger\" data-vocab=\"asphodels\">asphodels<\/span>; <br>Let your souls thrill to the caress of gladness, <br>And answer the sweet <span class=\"vocab-trigger\" data-vocab=\"chime\">chime<\/span> of Easter bells. <br>If Christ were still within the grave's low prison, <br>A captive of the Enemy we dread; <br>If from that rotting cell He had not risen, <br>Who then could dry the gloomy tears you shed? <br>If Christ were dead there would be need to sorrow, <br>But He has risen and <span class=\"vocab-trigger\" data-vocab=\"vanquished\">vanquished<\/span> death today; <br>Hush, then your sighs, if only till tomorrow, <br>At Easter give your grief a holiday. <br>—May Riley Smith",
              "zh": "哦，满面愁容的哀悼者，每日穿行在柏树紫杉的教堂墓地小径，今天就离开你正照料着的低矮坟墓，抬起你的眼望向神那永恒的蔚蓝吧！此刻不是苦毒与悲伤的时候；要挑选复活百合，而非灰白的常春花；让你的灵魂在喜乐的轻抚中颤动，回应复活钟声甜美的鸣响。如果基督仍卧在坟墓低沉的牢狱中，作我们所惧怕之仇敌的俘虏；如果祂没有从那朽坏的囚室中复活，谁能擦干你所流的阴暗眼泪呢？如果基督已死，则确有忧伤的必要，但祂今日已经复活，战胜了死亡；那么就止息你的叹息吧，即使只停到明天，在复活节，放你的忧伤一天假。——梅·莱利·史密斯",
              "simpEn": "Sad-faced mourners, walking through churchyard paths, leave the low graves you tend and lift your eyes to God's eternal blue! It's no time for sadness. Choose Easter lilies, not pale asphodels. Let your souls thrill to gladness and answer the Easter bells. If Christ were still in the grave, a captive of the Enemy, who could dry your tears? If Christ were dead, there would be reason to sorrow, but He has risen and vanquished death. Hush your sighs, give your grief a holiday at Easter.",
              "simpZh": "满面愁容的哀悼者啊，每天穿行在教堂墓地小径上，今天离开你照料的低矮坟墓，抬起眼睛看神永恒的蔚蓝吧！现在不是苦毒和悲伤的时候。挑选复活百合，不是苍白的常春花。让你的灵魂在喜乐中颤抖，回应复活钟声甜美的响声。如果基督还在坟墓里，作仇敌的俘虏，谁能擦干你的眼泪？如果基督死了，真有理由悲伤，但祂已经复活，战胜了死亡。止住叹息，哪怕只到明天，在复活节放你的忧伤一天假吧。"
            },
            {
              "en": "A well-known preacher was once in his study writing an Easter sermon when this thought gripped him: \"My Lord is living!\" With excitement he jumped up, paced the floor, and began repeating to himself, \"Christ is alive. His body is warm. He is not the great 'I was' but the great '<span class=\"vocab-trigger\" data-vocab=\"I am\">I am<\/span>.'\" Christ is not only a fact but a living fact. He is the glorious truth of Easter Day! Because of that truth, an Easter lily blooms and an angel sits at every believer's grave. We believe in a risen Lord, so do not look to the past to worship only at His tomb. Look above and within to worship the Christ who lives. Because He lives, we live. —Abbott Benjamin Vaughan",
              "zh": "一位著名的传道人有一次在书房写复活节讲章时，这个思想抓住了他：「我的主是活着的！」他兴奋地跳起来，在房间里踱步，开始对自己重复说：「基督是活着的。祂的身体是温暖的。祂不是伟大的『我曾是』，而是伟大的『我是』。」基督不仅是一个事实，更是一个活的事实。祂是复活节荣耀的真理！因着这个真理，复活百合绽放，天使坐在每一个信徒的墓旁。我们相信一位复活的主，所以不要回望过去，只在祂的坟前敬拜。要向高处和内心瞻望，敬拜那位活着的基督。因祂活着，我们也活着。——阿博特·本杰明·沃恩",
              "simpEn": "A well-known preacher, writing an Easter sermon, was gripped by the thought: 'My Lord is living!' He paced the floor, repeating, 'Christ is alive. His body is warm. He is not the great I was, but the great I am.' Christ is a living fact, the glorious truth of Easter. Because of this, Easter lilies bloom and angels sit at every believer's grave. Worship the living Christ, not just His tomb. Because He lives, we live.",
              "simpZh": "一位著名传道人写复活节讲章时，被一个念头抓住：‘我的主是活着的！’他激动地踱步，反复说：‘基督是活的，祂的身体是温暖的。祂不是伟大的我曾是，而是伟大的我是。’基督不只是一个事实，更是活着的事实，是复活节荣耀的真理！因此复活百合绽放，天使坐在每个信徒的墓旁。要敬拜活着的基督，而不是只对着坟墓。因为祂活着，我们也活着。"

        {
          "sectionId": 7,

          "audio": "audio/Streams in the Desert - April 28.m4a",
          "paragraphs": [
            {
              "en": "When they cried out to the Lord, he raised up for them a <span class=\"vocab-trigger\" data-vocab=\"deliverer\">deliverer<\/span>, Othniel ... , Caleb's younger brother, who saved them. The Spirit of the Lord came upon him. (Judges 3:9–10)",

            {
              "en": "God is continually preparing His heroes, and when the opportunity is right, He puts them into position in an instant. He works so fast, the world wonders where they came from. Dear friend, let the Holy Spirit prepare you, through the <span class=\"vocab-trigger\" data-vocab=\"discipline of life\">discipline of life<\/span>. And when the <span class=\"vocab-trigger\" data-vocab=\"finishing touch\">finishing touch<\/span> has been made on the sculpture, it will be easy for God to put you on display in the perfect place.",
              "zh": "神不断地预备祂的英雄，当时机成熟时，祂瞬息之间就将他们安置到位。祂工作如此迅速，世人惊讶他们从何处来。亲爱的朋友，让圣灵借着生活的操练预备你。当雕塑的最后一笔完成之后，神就会很容易把你摆列在完美的位置上展示。",
              "simpEn": "God continually prepares His heroes. When the time is right, He places them instantly. He works so fast the world wonders where they came from. Let the Holy Spirit prepare you through life's discipline. When the sculpture is finished, God will easily display you in the perfect place.",
              "simpZh": "神不断预备祂的英雄。时机一到，祂瞬间就把他们安置到位。祂工作太快，世人惊讶他们从哪来的。让圣灵借着生活的操练预备你。当雕塑最后的一笔完成，神就能轻易把你放在完美的位置上展示。"
            },
            {
              "en": "The day is coming when, like Othniel, we will also judge the nations and will rule and reign with Christ on earth during His <span class=\"vocab-trigger\" data-vocab=\"millennial kingdom\">millennial kingdom<\/span>. But before that glorious day, we must allow God to prepare us, as He did Othniel at Kiriath Sepher (see Judg. 1:11–13). We must allow God to work amid our present trials and in the little victories, the future significance of which we can only imagine. Yet we can be sure that if the Holy Spirit has His way with us, the Lord of heaven and earth has also prepared for us a <span class=\"vocab-trigger\" data-vocab=\"throne\">throne<\/span>. —A. B. Simpson.",
              "zh": "日子将到，那时我们像俄陀聂一样，也要审判列国，并在基督的千年国度中与祂一同在地上执掌王权。但在那荣耀的日子之前，我们必须让神预备我们，如同祂在基列西弗预备俄陀聂一样（见士1:11-13）。我们必须让神在我们当前的试炼和微小的胜利中作工，这些胜利将来的意义我们现在只能想象。然而我们可以确信，如果圣灵在我们身上通行祂的旨意，天地的主也已经为我们预备了宝座。——宣信",
              "simpEn": "A day is coming when, like Othniel, we will rule with Christ in His millennial kingdom. But before that, we must let God prepare us through trials and little victories whose future importance we can only imagine. If the Holy Spirit has His way, the Lord has also prepared a throne for us.",
              "simpZh": "有一天我们也要像俄陀聂一样，在基督的千年国度里与祂一同掌权。但在那荣耀的日子之前，我们必须让神借着试炼和微小胜利预备我们，这些胜利将来的意义我们只能想象。如果圣灵在我们身上自由运行，天地的主也已经为我们预备了宝座。"
            },
            {
              "en": "Human strength and human greatness <br>Spring not from life's sunny side, <br>Heroes must be more than <span class=\"vocab-trigger\" data-vocab=\"driftwood\">driftwood<\/span> <br>Floating on a <span class=\"vocab-trigger\" data-vocab=\"waveless tide\">waveless tide<\/span>. <br>Every highway of life <span class=\"vocab-trigger\" data-vocab=\"descends\">descends<\/span> into the valley now and then. And everyone must go through the tunnel of <span class=\"vocab-trigger\" data-vocab=\"tribulation\">tribulation<\/span> before they can travel on the high road of triumph.",
              "zh": "人的力量和人的伟大，并非出自人生阳光的一面，英雄必须不只是随波逐流的浮木。人生的每条大道都会不时降入低谷。每个人都必须经过患难的隧道，才能行在凯旋的大道上。",
              "simpEn": "Human strength and greatness don't come from life's sunny side. Heroes must be more than driftwood on a still tide. Every highway of life goes down into the valley now and then. Everyone must go through the tunnel of tribulation before traveling the high road of triumph.",
              "simpZh": "人的力量和伟大不来自人生的阳光面。英雄不能只是随波逐流的浮木。人生的每条大路都会不时下到低谷。每个人都必须经过患难的隧道，才能走上凯旋的大道。"
            }

              "en": "Elijah was a man <span class=\"vocab-trigger\" data-vocab=\"just like us\">just like us<\/span>. He prayed <span class=\"vocab-trigger\" data-vocab=\"earnestly\">earnestly<\/span>. (James 5:17)",

            {
              "en": "Thank God Elijah was \"just like us\"! He sat under a tree, complained to God, and expressed his <span class=\"vocab-trigger\" data-vocab=\"unbelief\">unbelief<\/span>—just as we have often done. Yet this was not the case at all when he was truly in touch with God. \"Elijah was a man just like us,\" yet \"he prayed earnestly.\" The literal meaning of this in the Greek is magnificent: instead of saying, \"earnestly,\" it says, \"He prayed in prayer.\" In other words, \"He kept on praying.\" The lesson here is that you must <span class=\"vocab-trigger\" data-vocab=\"keep praying\">keep praying<\/span>.",

              "simpEn": "Thank God Elijah was just like us! He sat under a tree, complained to God, and showed unbelief—just as we often do. But not when he was truly in touch with God. He prayed earnestly. The Greek literally says he prayed in prayer—he kept on praying. The lesson: you must keep praying.",

              "simpEn": "Go to the top of Mount Carmel and see that great story of faith and sight. After Elijah called fire from heaven to defeat Baal's prophets, rain was needed to fulfill God's word. The man who commanded fire could bring rain the same way. He bent down and put his face between his knees, shutting out all sights and sounds. He made himself neither see nor hear what was happening.",

              "simpZh": "以利亚叫仆人去看海。仆人回来说：‘什么都没有。’你能想象我们会怎么做吗？我们会说：‘我就知道！’然后停止祷告。但以利亚没放弃。他六次叫仆人再去看。每次仆人都说‘什么都没有’。第七次，仆人说看见一小片云像人手那么大。在雨水来之前，正有一双手在向神祷告。雨来得又快又猛，以利亚叫亚哈快下山免得被挡住。"

              "zh": "这是一个信心与眼见的故事——信心将自己与神以外的一切隔绝，而眼见虽然观看，却什么也看不见。是的，尽管从眼见收到了全然绝望的报告，这仍是一个继续「在祷告中祷告」的信心故事。你知道如何这样祷告——如何得胜的祷告吗？让你的眼见带给你尽量令人沮丧的报告，却不要理会它们。我们的天父是活着的，连祂迟延回答我们的祷告，也是祂良善的一部分。——亚瑟·塔潘·皮尔逊",

          "paragraphs": [

              "en": "God, who does not lie, promised. (Titus 1:2)",
              "zh": "那无谎言的神……所应许的。（提多书1:2）",
              "simpEn": "God, who never lies, promised.",

            {
              "en": "Faith is not <span class=\"vocab-trigger\" data-vocab=\"conjuring up\">conjuring up<\/span>, through an act of your will, a sense of certainty that something is going to happen. No, it is recognizing God's promise as an actual fact, believing it is true, rejoicing in the knowledge of that truth, and then simply resting because God said it. Faith turns a promise into a prophecy. A promise is <span class=\"vocab-trigger\" data-vocab=\"contingent\">contingent<\/span> upon our cooperation, but when we exercise genuine faith in it, it becomes a prophecy. Then we can move ahead with certainty that it will come to pass, because \"God . . . does not lie.\" —from Days of Heaven upon Earth",
              "zh": "信心不是借着意志的努力，硬是变出某事将要发生的确定感。不，信心是承认神的应许是一个实际的事实，相信它是真实的，因知道这真理而欢喜，然后因神如此说了就单单安息。信心将应许变成预言。应许有赖于我们的配合，但当我们运用真实的信心在它上面时，它就变成了预言。然后我们就可以带着它必成就的确信向前迈步，因为「神……绝不说谎」。——摘自《在地如天》",
              "simpEn": "Faith isn't forcing a feeling of certainty that something will happen. It's recognizing God's promise as fact, believing it's true, rejoicing in that truth, and resting because God said it. Faith turns a promise into a prophecy. A promise depends on our cooperation, but when we truly believe it, it becomes a prophecy. Then we move ahead sure it will happen, because God does not lie.",
              "simpZh": "信心不是用自己的意志勉强制造一种事情会发生的确定感。信心是承认神的应许是事实，相信它是真的，为这个真理欢喜，然后因为神说了就安息。信心把应许变成预言。应许需要我们的配合，但当我们真心相信时，它就成了预言。然后我们可以确定它会成就，因为神从不说谎。"
            },
            {
              "en": "I often hear people praying for more faith, but when I listen carefully to them and get to the <span class=\"vocab-trigger\" data-vocab=\"essence\">essence<\/span> of their prayer, I realize it is not more faith they are wanting at all. What they are wanting is their faith to be changed to sight. Faith does not say, \"I see this is good for me; therefore God must have sent it.\" Instead, faith declares, \"God sent it; therefore it must be good for me.\" Faith, when walking through the dark with God, only asks Him to hold his hand more tightly. —Phillips Brooks",
              "zh": "我常听人祷告求更多的信心，但当我仔细聆听他们祷告的要旨时，我发现他们根本不是想要更多信心。他们想要的是把信心变成眼见。信心不说：「我看见这对我有好处，所以一定是神送来的。」相反，信心宣称：「神送来的，所以这一定对我有好处。」信心，在黑暗中与神同行时，只求祂更紧地握住它的手。——菲利普斯·布鲁克斯",
              "simpEn": "People often pray for more faith, but really they want faith to become sight. Faith doesn't say, 'I see this is good, so God must have sent it.' Faith says, 'God sent it, so it must be good for me.' Faith, walking in the dark with God, only asks Him to hold his hand tighter.",
              "simpZh": "人们常求更多的信心，但其实他们是想把信心变成眼见。信心不是说‘我看见这对我好，所以一定是神给的’。信心是说‘神给的，所以一定对我好’。信心在黑暗中和神行走时，只求神把他的手抓得更紧。"
            },
            {
              "en": "The Shepherd does not ask of thee <br>Faith in your faith, but only faith in Him; <br>And this He meant in saying, \"Come to me.\" <br>In light or darkness seek to do His will, <br>And leave the work of faith to Jesus still.",
              "zh": "牧人不要求你信靠你的信心，只要求你信靠祂；这就是祂说「到我这里来」的意思。在光明或黑暗中都要寻求遵行祂的旨意，将信心的工作仍旧交托给耶稣。",
              "simpEn": "The Shepherd doesn't ask you to trust your faith, only to trust Him. That's what He meant by 'Come to Me.' In light or darkness, seek to do His will and leave the work of faith to Jesus.",
              "simpZh": "牧人不要求你信靠你的信心，只要你信靠祂。这就是祂说‘到我这里来’的意思。无论在光明还是黑暗中，都要遵行祂的旨意，把信心的工作交给耶稣。"
            }

          "sectionId": 4,

          "audio": "audio/Streams in the Desert - May 2.m4a",
          "paragraphs": [
            {
              "en": "The Lord has established his throne in heaven, and his kingdom rules over all. (Psalm 103:19)",
              "zh": "耶和华在天上立定宝座；祂的权柄统管万有。（诗篇103:19）",
              "simpEn": "The Lord has set His throne in heaven, and His kingdom rules over everything.",
              "simpZh": "耶和华在天上设立了祂的宝座；祂的国度统管一切。"
            },
            {
              "en": "Some time ago as I went out my door in the early spring, a <span class=\"vocab-trigger\" data-vocab=\"blast of easterly wind\">blast of easterly wind<\/span> rounded the corner. It seemed <span class=\"vocab-trigger\" data-vocab=\"defiant and merciless\">defiant and merciless<\/span> and was fierce and dry, raising a cloud of dust ahead of it. As I removed the key from the door, I quite impatiently began to say, \"I wish the wind would . . .\" What I was about to say was change, but my thought was stopped and the sentence was never finished.",
              "zh": "不久前一个早春的日子，我出门时，一阵东风绕过角落吹来。它似乎又狂傲又无情，干燥猛烈，在面前扬起一阵尘土。当我从门上取下钥匙时，我很不耐烦地开始说：「我真希望风能……」我本要说的是改变，但我的思绪被止住了，那句话没能说完。",
              "simpEn": "One early spring day, a blast of east wind came around the corner. It felt fierce, dry, and merciless, raising a cloud of dust. Taking my key from the door, I impatiently started to say, 'I wish the wind would...' I was going to say change, but my thought was stopped.",
              "simpZh": "早春的一天，一阵东风刮过墙角。它又干又猛，好像很无情，扬起了一片尘土。我取下钥匙时很不耐烦地说：‘真希望风能……’我本想说改变，但念头被止住了。"
            },
            {
              "en": "As I continued on my way, this incident became a <span class=\"vocab-trigger\" data-vocab=\"parable\">parable<\/span> for me. I imagined an angel handing me a key and saying, \"My Master sends you His love and asked me to give you this.\" Wondering, I asked, \"What is it?\" \"It is the key to the winds,\" the angel said and then disappeared. My first thought was, \"This indeed will bring me happiness.\" So I hurried high into the hills to the source of the winds and stood amid the caves. I proclaimed, \"I will do away with the terrible east wind—it will never <span class=\"vocab-trigger\" data-vocab=\"plague\">plague<\/span> us again!\" I <span class=\"vocab-trigger\" data-vocab=\"summoned\">summoned<\/span> that unfriendly wind to me, closed the door behind it, and heard it echoing through the hollow caves. As I turned the key, <span class=\"vocab-trigger\" data-vocab=\"triumphantly\">triumphantly<\/span> locking it in, I said, \"There, I am finished with that.\"",
              "zh": "我继续前行时，这事就成了我的一个比喻。我想象一位天使递给我一把钥匙，说：「我主人问你的安，并吩咐我把这给你。」我惊奇地问：「这是什么？」「这是风的钥匙，」天使说完就不见了。我第一个念头是：「这真要带给我快乐了。」于是我急忙登上高山，去到风的源头，站在洞穴之中。我宣告：「我要除灭那可怕的东风——它永不能再扰害我们了！」我召唤那不友善的风到我面前，把它关在门后，听见它在空洞的洞穴中回响。我转动钥匙，得意地将它锁住，说：「好了，我从此摆脱它了。」",
              "simpEn": "Walking on, this became a parable. I imagined an angel giving me a key, saying, 'My Master sends His love and told me to give you this.' I asked what it was. 'The key to the winds,' the angel said and vanished. I thought this would bring happiness. I hurried to the hills, to the source of the winds, and declared, 'I will do away with the terrible east wind!' I summoned it, locked it behind a door, and said, 'I am finished with that.'",
              "simpZh": "我继续走，这事成了我的一个比喻。我想象一个天使给我一把钥匙，说：‘我的主人向你说爱，并要我把这给你。’我问是什么。‘是风的钥匙，’天使说完就不见了。我第一个念头是：这真要带给我快乐了。我急忙上山，到风的源头，站在洞穴中。我宣告：‘我要除掉那可怕的东风！’我叫它来，把它锁在门后，听见它在洞里回响。我转动钥匙，得意地锁住它，说：‘好了，我从此摆脱它了。’"
            },
            {
              "en": "Then looking around me, I asked myself, \"What should I put in its place?\" I thought of the warm <span class=\"vocab-trigger\" data-vocab=\"southerly wind\">southerly wind<\/span> and how pleasant it must be to newborn lambs and new flowers and plants of all kinds. But as I put the key in the door, it began to burn my hand. I cried aloud, \"What am I doing? Who knows what damage I may cause? How do I know what the fields want and need? Ten thousand problems may result from this foolish wish of mine!\" <span class=\"vocab-trigger\" data-vocab=\"Bewildered\">Bewildered<\/span> and ashamed, I looked up and asked the Lord to send His angel to take away the key. Then I promised I would never ask for it again. To my amazement, the Lord Himself came and stood by me. He stretched out His hand to take the key, and as I placed it there, I saw it touch that <span class=\"vocab-trigger\" data-vocab=\"sacred scar\">sacred scar<\/span>.",
              "zh": "然后我环顾四周，问自己：「我该放什么在它原来的位置呢？」我想到了温暖的南风，它对初生的羊羔、新开的花朵和各样植物该是何等宜人。但当我把钥匙插入门中时，它开始灼烧我的手。我大声喊道：「我在做什么？谁知道我会造成怎样的损害？我怎么知道田地想要什么、需要什么？我这愚昧的愿望可能引出一万种问题！」我迷惑羞愧，仰望求主打发祂的天使来取走钥匙。然后我应许永不再要它。令我惊讶的是，主亲自来了，站在我身旁。祂伸出手来拿钥匙，当我把钥匙放在祂手中时，我看见它触到了那神圣的伤痕。",
              "simpEn": "Then I wondered what to put in its place. I thought of the warm southerly wind, so pleasant for lambs, flowers, and plants. But as I put the key in the door, it burned my hand. I cried, 'What am I doing? Who knows what damage I may cause? This foolish wish may cause ten thousand problems!' Bewildered and ashamed, I asked the Lord to send His angel to take away the key. I promised never to ask for it again. To my amazement, the Lord Himself came and stood by me. He stretched out His hand to take the key, and as I placed it there, I saw it touch that sacred scar.",
              "simpZh": "然后我想该放什么在原来的位置。我想到了温暖的南风，对新生小羊、花朵和植物多好啊。但当我把钥匙插进门里，它开始烫我的手。我喊：‘我在做什么？谁知道我会造成什么破坏？我这愚蠢的愿望可能引起一万种问题！’我又迷惑又惭愧，仰望求主打发天使把钥匙拿走。我答应再也不要了。让我惊奇的是，主亲自来站在我旁边。祂伸手拿钥匙，当我把钥匙放在祂手中时，我看见它碰到了那神圣的疤痕。"
            },
            {
              "en": "I was filled with <span class=\"vocab-trigger\" data-vocab=\"remorse\">remorse<\/span> as I wondered how I could ever have complained about anything done by Him who bore such sacred signs of His love. Then He took the key and hung it on His belt. I asked, \"Do you keep the key to the winds?\" \"I do, my child,\" He <span class=\"vocab-trigger\" data-vocab=\"graciously\">graciously<\/span> answered. And as He spoke, I noticed that all the keys to my life were hanging there as well. He saw my look of amazement and asked, \"Did you not know, dear child, that my '<span class=\"vocab-trigger\" data-vocab=\"kingdom rules over all\">kingdom rules over all<\/span>'?\" \"If you rule 'over all,'\" I questioned, \"is it safe to complain about anything?\" Then He tenderly laid His hand upon me to say, \"My dear child, your only safety comes from loving, trusting, and praising Me through everything.\" —Mark Guy Pearse",
              "zh": "我充满了懊悔，心想，我怎能抱怨过这位带有如此神圣爱之记号的主所做的任何事呢？然后祂拿了钥匙，挂在祂的腰带上。我问：「风的钥匙是祢保管的吗？」「是的，我的孩子，」祂慈爱地回答。祂说话时，我注意到我生命中所有的钥匙也都挂在那里。祂看到我惊讶的表情，就问：「亲爱的孩子，你岂不知我的『国统管万有』吗？」「如果祢统管万有，」我问道，「那么抱怨任何事安全吗？」祂温柔地将手按在我身上说：「我亲爱的孩子，你唯一的安全，就在于在万事中爱我、信靠我并赞美我。」——马克·盖·皮尔斯",
              "simpEn": "Filled with remorse, I wondered how I could ever complain about anything He did, bearing those sacred scars of love. He took the key and hung it on His belt. I asked, 'Do You keep the key to the winds?' 'I do, My child,' He graciously answered. And I noticed all the keys to my life were hanging there. He saw my amazement and asked, 'Did you not know My kingdom rules over all?' 'If You rule over all, is it safe to complain about anything?' He tenderly laid His hand on me: 'My dear child, your only safety comes from loving, trusting, and praising Me through everything.'",
              "simpZh": "我充满懊悔，心想我怎能抱怨过这位手上有爱之疤痕的主所做的任何事呢。祂把钥匙挂在腰带上。我问：‘风的钥匙是祢保管的吗？’祂慈爱地说：‘是的，我的孩子。’这时我看见我生命中所有的钥匙都挂在那里。祂看见我的惊讶，就问：‘亲爱的孩子，你岂不知我的国统管万有吗？’我问：‘如果祢统管万有，那么抱怨任何事安全吗？’祂温柔地按手在我身上说：‘亲爱的孩子，你唯一的安全就是在万事中爱我、信靠我并赞美我。’"
            }

              "zh": "那么，我为什么不求告祂的名呢？神如此相近，连我最微弱的呼求也必听见，我为什么还跑去找这人或那人呢？我为什么要坐下筹划自己的道路、制定自己的计划呢？为什么不立刻将我自己和我的重担交托给主呢？直向前方是最好的奔跑之路，那么我为什么不直接跑向永活的神呢？我反倒在各处徒然地寻找拯救，但我在神那里必寻见。在祂那里有祂君尊的应许：「就必得救」。在祂那里我永远无需问我可否呼求祂，因为「凡」字涵盖一切。它包括了我，意指任何求告祂名的人。所以我要信靠这节经文，要立刻求告那位发出如此重大应许的荣耀之主。",
              "simpEn": "Why don't I call on His name? God is near and hears my faintest call. Why do I run to others? Why plan my own course? Why not immediately put myself and my burden on the Lord? Straight ahead is best—why not run directly to the living God? I look in vain elsewhere for deliverance, but with God I find it. He promised, 'will be saved.' I never need to ask if I may call; 'everyone' includes me. So I will trust this verse and immediately call on the glorious Lord.",
              "simpZh": "我为什么不求告祂的名？神很近，连我最微弱的呼求祂都听见。我为什么要去找别人？为什么要自己计划？为什么不立刻把我和我的重担交给主？直向前跑是最好的路，那我为什么不直接跑向永活的神呢？我在别处徒然寻找拯救，但在神那里我必找到。祂应许了‘必得救’。我不用问可不可以求告祂，‘凡’字包括了我。所以我要信靠这节经文，立刻求告那位发出这重大应许的荣耀之主。"

          "paragraphs": [
            {
              "en": "He wounds, but he also <span class=\"vocab-trigger\" data-vocab=\"binds up\">binds up<\/span>; he injures, but his hands also heal. (Job 5:18)",
              "zh": "祂打破，又缠裹；祂击伤，用手医治。（约伯记5:18）",

            },
            {
              "en": "The Ministry of Great Sorrow <br>As we walk beside the hills that have been so violently shaken by a severe earthquake, we realize that times of complete calm follow those of destruction. In fact, pools of clear, still water lie in the valley beneath the fallen rocks of those hills as water lilies reflect their beauty to the sky. The reeds along the streams whisper in the wind, and the village rises once again, forgetting the graves of the past. And the church steeple, still bright after weathering the storm, proclaims a renewed prayer for protection from Him who holds the corners of the earth in His hands and gives strength to the hills. —John Ruskin",
              "zh": "大忧伤的职事。当我们沿着被剧烈地震所摇撼的山边行走时，我们意识到，完全的平静紧随毁灭之后来临。事实上，在山崩塌的岩石下面的谷中，清澈平静的池水躺着，睡莲向着天空映出它们的美丽。溪流旁的芦苇在风中低语，村落再度兴起，忘却了过去的坟墓。而教堂的尖顶，经过暴风雨后仍旧明亮，宣告着重新向那位手握地角、赐力量给山岭的主祈求保护。——约翰·罗斯金",
              "simpEn": "The Ministry of Great Sorrow. Walking by hills shaken by an earthquake, we see calm following destruction. Pools of clear still water lie beneath fallen rocks, water lilies reflecting beauty to the sky. Reeds whisper in the wind, the village rises again, forgetting past graves. The church steeple, bright after the storm, prays for protection from Him who holds the earth's corners and strengthens the hills.",
              "simpZh": "大忧伤的职事。我们走过被大地震摇撼的山边时，看见毁灭之后是完全的平静。倒塌的岩石下是清澈平静的水池，睡莲向天空映出美丽。溪边的芦苇在风中低语，村子重新兴起，忘记了过去的坟墓。教堂尖顶在风暴后仍然明亮，向那位手握地角、赐力量给山岭的神祈求保护。"
